<script>
"use strict";
/* ===== MiniPDF : vrai fichier PDF fabriqué sur l'appareil, sans bibliothèque (Helvetica, A4) ===== */
const MiniPDF = (()=>{
  const CP = {"€":128,"‚":130,"ƒ":131,"„":132,"…":133,"†":134,"‡":135,"ˆ":136,"‰":137,"Š":138,"‹":139,"Œ":140,"Ž":142,"‘":145,"’":146,"“":147,"”":148,"•":149,"–":150,"—":151,"˜":152,"™":153,"š":154,"›":155,"œ":156,"ž":158,"Ÿ":159};
  const SUB = {"→":"->","←":"<-","≤":"<=","≥":">=","✓":"OK","★":"*","ⓘ":"i","✎":""," ":" "," ":" ","‑":"-","≈":"~","×":"×","…":"…","Δ":"D","°":"°"};
  function enc(s){ let o=""; for(const ch of String(s??"")){ let c=ch; if(c.charCodeAt(0)>255 && !(c in CP) && SUB[c]!=null) c=SUB[c]; for(const k of c){ const n=k.charCodeAt(0); if(n<256) o+=k; else if(CP[k]) o+=String.fromCharCode(CP[k]); else o+="?"; } } return o.replace(/\\/g,"\\\\").replace(/\(/g,"\\(").replace(/\)/g,"\\)"); }
  let ctx=null;
  function width(s,size,bold){ if(!ctx){ ctx=document.createElement("canvas").getContext("2d"); } ctx.font=(bold?"bold ":"")+"100px Helvetica, Arial, sans-serif"; return ctx.measureText(String(s)).width/100*size*1.02; }
  function hex(c){ const m=/^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(c||"#000000"); return m?[1,2,3].map(i=>(parseInt(m[i],16)/255).toFixed(3)).join(" "):"0 0 0"; }
  class Doc{
    constructor(opt={}){ this.W=opt.landscape?842:595; this.H=opt.landscape?595:842; this.M=opt.margin||36; this.pages=[]; this.addPage(); }
    addPage(){ this.cur=[]; this.pages.push(this.cur); this.y=this.M; return this; }
    text(x,y,s,o={}){ const sz=o.size||10; this.cur.push(`BT /${o.bold?"F2":"F1"} ${sz} Tf ${hex(o.color)} rg ${x.toFixed(2)} ${(this.H-y-sz*0.8).toFixed(2)} Td (${enc(s)}) Tj ET`); }
    rect(x,y,w,h,o={}){ const c=[]; if(o.fill) c.push(hex(o.fill)+" rg"); if(o.stroke) c.push(hex(o.stroke)+" RG "+(o.lw||0.6)+" w"); c.push(`${x.toFixed(2)} ${(this.H-y-h).toFixed(2)} ${w.toFixed(2)} ${h.toFixed(2)} re ${o.fill&&o.stroke?"B":o.fill?"f":"S"}`); this.cur.push(c.join(" ")); }
    line(x1,y1,x2,y2,o={}){ this.cur.push(`${hex(o.color||"#C8CDD4")} RG ${o.lw||0.6} w ${x1.toFixed(2)} ${(this.H-y1).toFixed(2)} m ${x2.toFixed(2)} ${(this.H-y2).toFixed(2)} l S`); }
    wrap(s,size,maxw,bold){ const out=[]; for(const para of String(s??"").split("\n")){ let line=""; for(const w of para.split(/\s+/)){ if(!w) continue; const t=line?line+" "+w:w; if(width(t,size,bold)<=maxw||!line) line=t; else { out.push(line); line=w; } } out.push(line); } return out; }
    need(h){ if(this.y+h>this.H-this.M) { this.addPage(); return true; } return false; }
    /* paragraphe avec retour à la ligne et saut de page automatique */
    para(s,o={}){ const sz=o.size||10, lh=sz*(o.lh||1.3), x=o.x??this.M, w=o.w??(this.W-this.M-x); for(const l of this.wrap(s,sz,w,o.bold)){ this.need(lh); this.text(x,this.y,l,o); this.y+=lh; } this.y+=o.after??2; }
    out(){
      const objs=[]; const add=s=>{ objs.push(s); return objs.length; };
      add("<< /Type /Catalog /Pages 2 0 R >>"); add("PAGES");
      add("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>");
      add("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>");
      const kids=[];
      for(const p of this.pages){ const st=p.join("\n"); const c=add(`<< /Length ${st.length} >>\nstream\n${st}\nendstream`); kids.push(add(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${this.W} ${this.H}] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ${c} 0 R >>`)); }
      objs[1]=`<< /Type /Pages /Kids [${kids.map(k=>k+" 0 R").join(" ")}] /Count ${kids.length} >>`;
      let s="%PDF-1.4\n%\xE2\xE3\xCF\xD3\n"; const off=[];
      objs.forEach((o,i)=>{ off.push(s.length); s+=`${i+1} 0 obj\n${o}\nendobj\n`; });
      const x=s.length; s+=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`+off.map(o=>String(o).padStart(10,"0")+" 00000 n \n").join("")+`trailer\n<< /Size ${objs.length+1} /Root 1 0 R >>\nstartxref\n${x}\n%%EOF`;
      const b=new Uint8Array(s.length); for(let i=0;i<s.length;i++) b[i]=s.charCodeAt(i)&255; return new Blob([b],{type:"application/pdf"});
    }
  }
  /* remise du fichier : feuille de partage (Imprimer, Enregistrer dans Fichiers…) sinon téléchargement */
  async function deliver(blob,name){
    const file=new File([blob],name,{type:"application/pdf"});
    try{ if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:name}); return "share"; } }catch(e){ if(e && e.name==="AbortError") return "abort"; }
    const u=URL.createObjectURL(blob), a=document.createElement("a"); a.href=u; a.download=name; a.rel="noopener"; document.body.appendChild(a); a.click(); a.remove();
    return "download";
  }
  return {Doc, deliver, width};
})();

/* ===== PARTAGE PAR LIEN : l'objet voyage dans l'adresse (#x/…), compressé quand l'appareil le permet ===== */
const Partage = (()=>{
  const toB64=u8=>{ let s=""; for(let i=0;i<u8.length;i+=0x8000) s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000)); return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); };
  const fromB64=s=>{ const b=atob(s.replace(/-/g,"+").replace(/_/g,"/")); const u=new Uint8Array(b.length); for(let i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u; };
  async function pipe(u8,T){ const st=new Blob([u8]).stream().pipeThrough(T); return new Uint8Array(await new Response(st).arrayBuffer()); }
  async function enc(obj){
    const raw=new TextEncoder().encode(JSON.stringify(obj));
    try{ if(window.CompressionStream) return "z"+toB64(await pipe(raw,new CompressionStream("deflate-raw"))); }catch(e){}
    return "p"+toB64(raw);
  }
  async function dec(code){
    const k=code[0], u=fromB64(code.slice(1));
    const raw = k==="z" ? await pipe(u,new DecompressionStream("deflate-raw")) : u;
    return JSON.parse(new TextDecoder().decode(raw));
  }
  async function envoyer(obj,titre,texte,openSheet,esc){
    const url=location.origin+location.pathname+"#x/"+await enc(obj);
    try{ if(navigator.share){ await navigator.share({title:titre,text:texte,url}); return; } }catch(e){ if(e&&e.name==="AbortError") return; }
    let ok=false; try{ await navigator.clipboard.writeText(url); ok=true; }catch(e){}
    openSheet(`<div class="shh"><b>${esc(titre)}</b><button class="ib" data-close type="button">×</button></div><p class="msg">${ok?"Lien copié. ":""}Colle ce lien dans un message : il ouvre directement la même chose sur le téléphone de la personne.</p><textarea class="srch" rows="5" readonly>${esc(url)}</textarea>`);
  }
  return {enc,dec,envoyer};
})();

/* ===== CREATE MY WARM-UP (GRÜN) : la méthode construit un échauffement individualisé, le joueur le lance en un toucher =====
   Données : jeux = GRUN.banque (exos avec champ w) + jeux pas encore assemblés dans la banque (data.json → "gx").
   Clé propre : routines_v1 {routines:[Routine], hist:[{who,date,duree,apres,g:[ids]}], last, mat, matLieu:{lieu:[mat]}, hide:[id], fav:[id], profil:{who:{age,sexe}}, cur}
   Routine = {id, mode:"j"|"c", nom, date, jids:[], gid, age, sexe, apres, sous, duree, lieu, surface, n, mat, meteo, forme, zone, delai, tr, style, logique, notes:[],
              blocks:[{et:"MR|MO|AC|CV|ST|PO|JC", ets:[étapes couvertes], type, nom, min, slots:[{t:[cibles], g:idJeu, neuf}]}], maj}
   Favoris : par joueur dans la fiche (j.favWarmup : ids de jeux ♥ et ids de routines ♥) ; sans joueur : ST.fav. */
"use strict";
const RK="routines_v1", HAS=typeof GRUN!=="undefined";
let DATA=null, G={}, POOL=[];
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>HAS?GRUN.uid():Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const todayIso=()=>HAS?GRUN.today():new Date().toISOString().slice(0,10);
const frD=s=>s?String(s).slice(0,10).split("-").reverse().join("/"):"";
const norm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
function load(k,def){ try{ return JSON.parse(localStorage.getItem(k))||def; }catch(e){ return def; } }
let ST=load(RK,{});
function fixST(){ for(const k of ["routines","hist","hide","fav"]) if(!Array.isArray(ST[k])) ST[k]=[]; for(const k of ["profil","matLieu"]) if(!ST[k]||typeof ST[k]!=="object"||Array.isArray(ST[k])) ST[k]={}; }
fixST();
function saveNow(){ if(HAS) GRUN.save(RK,ST); else try{ localStorage.setItem(RK,JSON.stringify(ST)); }catch(e){} }
const joueurs=()=>HAS?GRUN.joueurs.all():(load("grilles_joueurs_v1",{joueurs:[]}).joueurs||[]);
const jget=id=>HAS?GRUN.joueurs.get(id):joueurs().find(j=>j.id===id)||null;
const groupes=()=>HAS?GRUN.groupes.all():[];
const gget=id=>HAS?GRUN.groupes.get(id):null;
function ageAt(nai){ if(HAS) return GRUN.ageCiv(nai); if(!nai) return null; const a=new Date(nai),r=new Date(); let y=r.getFullYear()-a.getFullYear(); if(r.getMonth()<a.getMonth()||(r.getMonth()===a.getMonth()&&r.getDate()<a.getDate())) y--; return y; }
/* GRÜN = 4-18 ans : un âge au-delà de 18 ans (date de naissance, ancien profil « adulte » 25 ou 40) compte pour 18 ans */
const age18=a=>a==null||a===""||isNaN(+a)?null:Math.max(4,Math.min(18,+a));
const ageOf=j=>{ const a=ageAt(j.naissance); if(a!=null) return age18(a); return age18(ST.profil[j.id]?.age); };
const ageLab=a=>a==null?"":age18(a)+" ans";
const isJ=()=>HAS&&GRUN.isJoueur();
const meJid=()=>HAS?GRUN.mode().jid:null;
const main=$("#main");

/* ---------- référentiels ---------- */
const ET={MR:{n:"Mise en route",c:"#C2410C"},MO:{n:"Mobilité",c:"#0F766E"},AC:{n:"Activation et prévention",c:"#7C3AED"},CV:{n:"Coordination et vitesse",c:"#1D4ED8"},ST:{n:"Spécifique tennis",c:"#B7791F"},PO:{n:"Mise en tension finale",c:"#B91C1C"},JC:{n:"Jeu complet",c:"#9D174D"}};
const ORD=["MR","MO","AC","CV","ST","PO"];
const TYPEN={complet:"Jeu complet",raquette:"Échauffement raquette et balle",mini:"Échauffement sans rien, 2 m²",mobzones:"Circuit mobilité toutes zones"};
const APRES={tennis:"Entraînement tennis",match:"Match",pp:"Séance de PP",bilan:"Bilan / tests"};
const SOUS={tennis:{technique:"Technique, tactique",service:"Service"},match:{premier:"1er match du jour",suivant:"Match suivant"},pp:{force:"Force",vitesse:"Vitesse, pliométrie",endurance:"Endurance"},bilan:{vitesse:"Vitesse, sauts",lancers:"Lancers, service",endurance:"Endurance (paliers)",autres:"Autres tests"}};

    else { W={MR:30,MO:22,AC:10,CV:18,ST:0,PO:20}; CI.CV=["vitesse","direction","rythme","reaction"]; CI.PO=["jambes"]; ["MR","MO","CV","PO"].forEach(e=>obl.add(e)); }

/* candidats pour une case */
function candidats(r,b,slot,used,opt={}){
  const R=opt.R||regles(r), p=R.p, fmt=fmtOf(p.n), mat=new Set(r.mat||[]), S=slot.t, nS=b.slots.length;
  const sec=gameSec(b,r), favs=opt.favs||favSet(r), hs=opt.hs||histStats(r), out=[];
  const chosenMat=new Set((r.blocks||[]).flatMap(x=>x.slots).filter(x=>x!==slot&&x.g&&G[x.g]).flatMap(x=>G[x.g].mat));
  const zs=r.forme==="douleur"&&r.zone?[r.zone,...p.zones]:p.zones;
  for(const g of POOL){
    if(hidden(g.id)) continue;
    let cov;
    if(b.et==="JC"){ if(!isMulti(g)) continue; cov=g.ets.filter(e=>b.ets.includes(e)).length; if(cov<Math.min(b.ets.length,2)) continue; }
    else { if(isMulti(g)||g.et!==b.et) continue; const ci=g.ci||[]; cov=ci.length?ci.filter(x=>S.includes(x)).length:0.5; if(!cov&&!(isFull(g)&&S.length>1)) continue; if(isFull(g)&&S.length===1&&nS>1) continue; }
    const ga=Math.min(p.age,18); if(ga<g.a[0]||(g.a[1]<18&&ga>g.a[1])) continue;
    if(!g.lieu.includes(r.lieu)) continue;
    if(g.mat.some(m=>!mat.has(m)||!matOkAge(m,p.age))) continue;
    if(!(g.fmt.includes(fmt)||g.fmt.includes("seul"))) continue;
    const t=norm(g.n+" "+g.but+" "+g.de);
    if(p.crois==="oui"&&g.int===3&&SAUT.test(t)) continue;
    let s=b.et==="JC"?3*cov/b.ets.length:4*cov/S.length;
    if(b.et==="JC"){ if(b.type&&g.type===b.type) s+=2; if(g.ets.length>=4) s+=0.8; }
    else { if(isFull(g)) s+=S.length>=3?4:S.length===2?1.5:-1.5; if(!isFull(g)&&S.length===1&&(g.ci||[]).length===1) s+=0.8; if(g.type==="mobzones"&&S.length>=4) s+=1.5; }
    if(g.fmt.includes(fmt)) s+=1.5;
    if(R.raq&&(b.et==="ST"||(b.et==="JC"&&b.ets.includes("ST")))) s+=g.mat.includes("rb")?1.5:-1;
    if(g.apres.includes(R.ap)) s+=1.5;
    if(g.src==="new") s+=1.2;
    if(sec<50&&g.dur>=5&&!isFull(g)&&b.et!=="JC") s-=0.8;
    const mid=(g.a[0]+g.a[1])/2; s-=Math.abs(ga-mid)*0.12;
    if(b.et==="PO"&&g.int===3&&!p.crois&&r.forme==="frais") s+=0.6;
    if(r.forme==="fatigue"||r.forme==="courba"){ if(g.int===3) s-=2; }
    for(const z of zs){ if(ZR[z]?.test(t)) s-=5; if(b.et==="AC"&&ZPREV[z]?.test(t)) s+=2; }
    if(p.crois==="oui"&&SAUT.test(t)) s-=2.5; else if(p.crois==="probable"&&g.int===3&&SAUT.test(t)) s-=1.2;
    if(p.fYoung&&/lanc/.test(t)&&["MR","ST","PO","JC"].includes(b.et)) s+=1.2;
    if(p.hasF11&&["AC","CV"].includes(b.et)&&/genou|recept|frein|fente|squat|un pied|equilibre/.test(t)) s+=1.5;
    if(p.hasG13&&["AC","MO"].includes(b.et)&&/epaule|omoplate|thorac|coiffe|rotation externe|haut du dos/.test(t)) s+=1.5;
    if(favs.has(g.id)) s+=opt.style==="habitude"?6:3;
    const cnt=hs.count[g.id]||0;
    if(opt.style==="habitude") s+=Math.min(4,cnt*1.2);
    if(R.ap==="match"&&!cnt&&opt.style!=="surprise"&&hs.total) s-=1.5;
    if(!g.mat.length) s+=0.4; else if(g.mat.every(m=>chosenMat.has(m))) s+=1;
    out.push({g,s,last:hs.last[g.id]||null,cnt,used:used.has(g.id)});
  }
  return out.sort((x,y)=>(x.used-y.used)||(y.s-x.s));
}
const dispo=(r,b,t,R)=>candidats(r,{...b,slots:[{t}]},{t},new Set(),{R}).length;

/* structure de la routine */
function slotsPour(b,r,R,court){
  if(b.et==="JC") return [{t:["*"],g:b.slots?.[0]?.g||null}];
  const T=(R.E.find(x=>x.et===b.et)?.ci)||CIB[b.et].map(x=>x[0]);
  let n;
  if(b.et==="MO"){ const s=b.min*60; n=s>=110?Math.max(5,Math.min(CAP.MO,Math.round(s/30))):1;
    if(n===1&&court){ const full=dispo(r,b,T,R); if(!full) n=Math.max(1,Math.min(5,Math.floor(s/18))); } }
  else { const SEC={MR:court?60:100,AC:court?60:55,CV:court?60:50,ST:court?120:110,PO:court?45:35}[b.et]; n=Math.max(1,Math.min(CAP[b.et],Math.round(b.min*60/SEC))); if(court) n=Math.min(n,b.et==="PO"&&R.ap==="match"&&b.min>=1.2?2:1); }
  const S=[];
  if(n>=T.length){ for(let i=0;i<n;i++) S.push([T[i%T.length]]); }
  else { const base=Math.floor(T.length/n); let rest=T.length%n, a=0; for(let i=0;i<n;i++){ const k=base+(rest-->0?1:0); S.push(T.slice(a,a+k)); a+=k; } }
  const old=b.slots||[];
  return S.map((t,i)=>({t,g:old[i]&&old[i].t.join()===t.join()?old[i].g:null}));
}
const BORD=b=>b.et==="JC"?(b.ets.includes("MR")?0.5:ORD.indexOf(b.ets[0])+0.5):ORD.indexOf(b.et);
function planifier(r){
  const R=regles(r), D=r.duree, court=D<=8, T=D*60; r.tr=court?5:10;
  const E=R.E, has=e=>E.some(x=>x.et===e);
  let blocks=[];
  if(court){
    const tMO=has("MO")?(D<=3?40:D<=5?70:100):0, tPO=has("PO")?(D<=3?30:D<=5?40:55):0;
    /* jeu complet qui couvre plusieurs étapes (type complet | raquette | mini) */
    const pref=(r.lieu==="hotel"||!(r.mat||[]).length)?"mini":(R.raq&&has("ST")?"raquette":"complet");
    const want=E.map(x=>x.et);
    let best=null;
    const tried=new Set();
    for(const g of POOL){ if(!isMulti(g)) continue; const k=g.ets.filter(e=>want.includes(e)).join(); if(!k||tried.has(k)) continue; tried.add(k);
      const ets=k.split(","); if(ets.length<2) continue;
      const b={et:"JC",ets,type:"",min:3,slots:[{t:["*"]}]}; const c=candidats(r,b,b.slots[0],new Set(),{R}).filter(x=>x.g.ets.filter(e=>ets.includes(e)).length===ets.length);
      if(!c.length) continue; const ty=c.some(x=>x.g.type===pref)?pref:c[0].g.type;
      const sc=ets.filter(e=>e!=="MO").length*3+(ets.includes("ST")&&has("ST")?2:0)+(ty===pref?2:0)+Math.min(2,c.length*0.3);
      if(!best||sc>best.sc) best={ets,ty,sc}; }
    let rest=E.filter(x=>!best||!best.ets.includes(x.et)||(x.et==="MO"&&D>=5)||(x.et==="PO"&&R.ap==="match")).map(x=>x.et);
    if(best&&best.ets.includes("MO")&&D<5) rest=rest.filter(e=>e!=="MO");
    const single=rest.filter(e=>e!=="MO"&&e!=="PO");
    const nGames=(best?1:0)+single.length+(rest.includes("MO")?1:0)+(rest.includes("PO")?1:0);
    let avail=T-(nGames-1)*r.tr-(rest.includes("MO")?tMO:0)-(rest.includes("PO")?tPO:0);
    let tJC=0, per={};
    if(best){ tJC=single.length?Math.max(90,Math.min(avail*0.6,avail-single.length*40)):avail; const left=avail-tJC, sw=single.reduce((a,e)=>a+E.find(x=>x.et===e).w,0)||1; single.forEach(e=>per[e]=Math.max(30,left*E.find(x=>x.et===e).w/sw)); }
    else { const sw=single.reduce((a,e)=>a+E.find(x=>x.et===e).w,0)||1; single.forEach(e=>per[e]=Math.max(25,avail*E.find(x=>x.et===e).w/sw)); }
    if(best) blocks.push({et:"JC",ets:best.ets,type:best.ty,min:tJC/60});
    for(const e of rest){ const s=e==="MO"?tMO:e==="PO"?tPO:per[e]; blocks.push({et:e,min:s/60}); }
  } else {
    const SW=E.reduce((a,x)=>a+x.w,0);
    blocks=E.map(x=>({et:x.et,min:Math.max(x.et==="PO"?0.75:1,Math.round(D*x.w/SW*2)/2)}));
    if(R.bloc&&R.bloc.includes("genou")){ const ac=blocks.find(b=>b.et==="AC"); if(ac&&D>=12) ac.min=Math.max(ac.min,3); }
    if(R.bloc&&R.bloc.includes("epaule")){ const ac=blocks.find(b=>b.et==="AC"); if(ac&&D>=12) ac.min=Math.max(ac.min,2.5); }
    const diff=D-blocks.reduce((a,b)=>a+b.min,0);
    const big=blocks.reduce((m,b)=>b.min>m.min&&b.et!=="PO"?b:m,blocks[0]); big.min=Math.max(0.5,big.min+diff);
  }
  blocks.forEach(b=>{ b.k=1; if(b.et==="AC"&&R.bloc) b.nom=R.bloc==="genou"?"Activation · bloc genou":R.bloc==="epaule"?"Activation · bloc épaule-dos":"Activation · genou et épaule-dos"; if(b.et==="JC") b.nom=TYPEN[b.type]||"Jeu complet"; if(b.et==="PO"&&R.ap==="match") b.nom="Mise en tension et routine mentale"; });
  blocks.sort((a,b)=>BORD(a)-BORD(b));
  blocks.forEach(b=>b.slots=slotsPour(b,r,R,court));
  if(!court&&blocks.length>1){ /* les transitions entre blocs sont prises sur le temps total */ const big=blocks.reduce((m,b)=>b.min>m.min&&b.et!=="PO"?b:m,blocks[0]); big.min=Math.max(1,big.min-(blocks.length-1)*r.tr/60); big.slots=slotsPour(big,r,R,court); }
  /* une case sans aucun jeu possible : on la fond dans l'étape voisine (rien d'oublié sans le dire) */
  const vide=[]; blocks=blocks.filter(b=>{ const ok=b.slots.some(s=>candidats(r,b,s,new Set(),{R}).length); if(!ok) vide.push(b); return ok; });
  if(vide.length){ const lost=vide.map(b=>b.et==="JC"?null:ET[b.et].n.toLowerCase()).filter(Boolean); if(lost.length) R.notes.push("Pas de jeu possible ici pour : "+lost.join(", ")+". Ajoute du matériel ou change de lieu pour les retrouver."); const t=vide.reduce((a,b)=>a+b.min,0); if(blocks.length){ const m=blocks.reduce((m,b)=>b.min>m.min?b:m,blocks[0]); m.min+=t; m.slots=slotsPour(m,r,R,court); } }
  r.blocks=blocks;
  r.logique=logique(r,R); r.notes=R.notes;
  return R;
}
function couvertes(r){ const s=new Set(); for(const b of r.blocks){ if(b.et==="JC") b.ets.forEach(e=>s.add(e)); else s.add(b.et); } return s; }
function logique(r,R){
  const D=r.duree, l1=R.why[0]||"", ex=R.why.slice(1).filter(x=>!/^Avant/.test(x));
  let l2;
  if(D<=8){ const jc=r.blocks.find(b=>b.et==="JC"); const pk=[jc?"un jeu complet qui enchaîne "+jc.ets.length+" étapes":"un jeu « tout le bloc » par étape",r.blocks.some(b=>b.et==="MO")?"la mobilité de toutes les zones":"",r.blocks.some(b=>b.et==="ST")?"le spécifique tennis":"",r.blocks.some(b=>b.et==="PO")?(R.ap==="match"?"la mise en tension et la routine mentale":"des efforts brefs pour finir"):""].filter(Boolean);
    l2=`En ${D} min, rien n'est sauté : ${pk.slice(0,-1).join(", ")}${pk.length>1?" puis ":""}${pk[pk.length-1]}.`; }
  else l2=R.agePk;
  return [l1,D<=8?l2:(ex[0]||l2)].filter(Boolean).join(" ");
}

/* remplir les cases : comme d'habitude, surprends-moi, ou automatique */
function histStats(r){ const who=new Set(whoIds(r)); const count={}, last={}; let total=0;
  for(const h of ST.hist) if(who.has(h.who)){ total++; for(const id of h.g){ count[id]=(count[id]||0)+1; if(!last[id]||last[id]<h.date) last[id]=h.date; } }
  return {count,last,total}; }
function favSet(r){ const s=new Set(ST.fav); for(const id of whoIds(r)){ if(id==="invite") continue; (jget(id)?.favWarmup||[]).forEach(x=>s.add(x)); } return s; }
function rnd(a){ return a[Math.floor(Math.random()*a.length)]; }
function remplir(r,style,onlyEmpty){
  const R=regles(r), favs=favSet(r), hs=histStats(r), det=R.ap==="bilan"&&style!=="surprise";
  const used=new Set(onlyEmpty?allG(r):[]);
  const all=r.blocks.flatMap((b,i)=>b.slots.map((s,j)=>({b,s,i,j})));
  for(const {b,s} of all){ if(onlyEmpty&&s.g) continue; s.g=null; s.neuf=false;
    let C=candidats(r,b,s,used,{R,favs,hs,style}).filter(x=>!x.used); if(!C.length) continue;
    let pick;
    if(det) pick=C[0];
    else if(style==="surprise"){ let P=C.filter(x=>!x.cnt); if(R.ap==="match"&&hs.total){ const K=C.filter(x=>x.cnt); if(K.length) P=K.slice().sort(()=>Math.random()-0.5); } pick=rnd((P.length?P:C).slice(0,6)); }
    else if(style==="habitude"){ const top=C.slice(0,3); pick=top[0].s-(top[1]?.s??-99)>3?top[0]:rnd(top); }
    else pick=rnd(C.slice(0,5));
    s.g=pick.g.id; s.neuf=false; used.add(pick.g.id);
  }
  if(style==="habitude"&&R.ap!=="match"&&!det){ /* + 1 ou 2 nouveaux */
    const nNew=all.length>=6?2:1; let done=all.filter(x=>x.s.neuf).length;
    const cand=all.filter(x=>x.b.et!=="PO"&&x.s.g&&!x.s.neuf&&!favs.has(x.s.g)).sort(()=>Math.random()-0.5);
    for(const x of cand){ if(done>=nNew) break; const C=candidats(r,x.b,x.s,new Set(allG(r).filter(id=>id!==x.s.g)),{R,favs,hs}).filter(y=>!y.used&&!y.cnt&&!favs.has(y.g.id)); if(!C.length) continue; x.s.g=rnd(C.slice(0,4)).g.id; x.s.neuf=true; done++; }
  }
  /* case impossible à remplir sans doublon (lieu ou matériel très limités) : on la retire, le temps du bloc va aux autres jeux */
  for(const b of r.blocks){ if(b.slots.length>1&&b.slots.some(s=>!s.g)&&b.slots.some(s=>s.g)) b.slots=b.slots.filter(s=>s.g); }
  /* temps total tenu : les transitions (changement de matériel) sont reprises sur le plus gros bloc */
  const over=steps(r).reduce((a,x)=>a+x.sec,0)-r.duree*60;
  if(Math.abs(over)>8&&r.blocks.length){ const big=r.blocks.reduce((m,b)=>b.min>m.min&&b.et!=="PO"?b:m,r.blocks[0]); big.min=Math.max(0.5,big.min-over/60); }
  r.style=style;
}

  return `<div class="card ask"><b>${key==="me"?"Ton âge et ton sexe (une seule fois)":"Âge et sexe"}</b><div class="row"><div class="f"><label for="pa">Âge</label><input type="number" id="pa" min="4" max="18" value="${age18(p.age)??""}" inputmode="numeric"></div>
   <div class="chips">${[["F","Fille"],["G","Garçon"]].map(([v,l])=>`<button type="button" class="tg" data-sx="${v}" aria-pressed="${p.sexe===v}">${l}</button>`).join("")}</div>${key==="invite"?`<div class="f"><label for="pn">Joueurs</label><input type="number" id="pn" min="1" max="40" value="${p.n||1}"></div>`:""}</div></div>`;
}
function bindAsk(key,rerender){
  const p=ST.profil[key]||{age:12,sexe:"G",n:1}; const sv=()=>{ ST.profil[key]=p; saveNow(); };
  $("#pa")&&($("#pa").onchange=e=>{ p.age=Math.max(4,Math.min(18,+e.target.value||12)); sv(); rerender(); });
  $("#pn")&&($("#pn").onchange=e=>{ p.n=Math.max(1,+e.target.value||1); sv(); });
  $$("[data-sx]").forEach(b=>b.onclick=()=>{ p.sexe=b.dataset.sx; sv(); rerender(); });
}
function lancer(style){
  let w=whoBase();
  if(!w&&$("#pa")){ const key=isJ()?"me":WHO?.t==="j"?WHO.id:"invite"; const sx=$("[data-sx][aria-pressed=true]"); const pa=$("#pa");
    ST.profil[key]={...(ST.profil[key]||{}),age:age18(+pa.value||12),sexe:sx?sx.dataset.sx:"G",n:+($("#pn")?.value||1)}; saveNow(); w=whoBase(); }
  if(!w) return;
  ST.last={...Q}; saveNow();
  const base={...w,apres:Q.apres,sous:Q.sous,duree:Q.duree,lieu:Q.lieu,surface:Q.surface,mat:matPour(Q.lieu).filter(m=>matOkAge(m,w.age)),meteo:"normal",forme:"frais",zone:"",delai:0,mode:isJ()?"j":"c"};
  if(style==="choix"){ DRAFT={...base}; go("#/choix"); return; }
  ST.cur=construire(base,style); saveNow(); go("#/r/cur");
}
function quickScreen(title,lead,extraTop){
  const ask=!whoBase()||WHO?.t==="i"&&!isJ();
  const key=isJ()?"me":"invite";
  return `<h1>${title}</h1>${lead?`<p class="lead">${lead}</p>`:""}${extraTop||""}
   ${(ask||(!isJ()&&WHO?.t==="i"))&&!(isJ()&&whoBase())?profilAsk(key,ST.profil[key]):""}
   ${quickHtml()}
   <div class="big3"><button type="button" class="bigb hb" data-go="habitude"><b>Comme d'habitude</b><span>Tes ♥ et tes jeux préférés, + 1 ou 2 nouveaux</span></button>
   <button type="button" class="bigb sb" data-go="surprise"><b>Surprends-moi</b><span>Que des jeux que tu n'as jamais faits</span></button>
   <button type="button" class="bigb cb" data-go="choix"><b>Je choisis tout</b><span>Tous les réglages, tu choisis chaque jeu</span></button></div>`;
}
function bindScreen(rerender){ bindQuick(rerender); bindAsk(isJ()?"me":"invite",rerender); $$("[data-go]").forEach(b=>b.onclick=()=>lancer(b.dataset.go)); }

  if(!Q) Q=newQ();
  if(isJ()){ const id=meJid(), j=id&&jget(id);
    const prof=j?`${esc(j.nom)}${ageOf(j)!=null?" · "+ageLab(ageOf(j)):""} · ${j.sexe==="F"?"fille":"garçon"}`:"";
    const mine=ST.routines.filter(r=>id&&(r.jids||[]).includes(id)||!id&&!r.jids?.length);
    main.innerHTML=quickScreen("Mon échauffement",prof?prof+" · trois choix, un toucher, c'est prêt.":"Trois choix, un toucher, c'est prêt.")+
     (mine.length?`<section class="sec"><h2>Mes routines</h2>${routList(mine)}</section>`:"")+
     `<section class="sec"><h2>Mes derniers échauffements</h2>${histHtml(id?[id]:["invite"],8)}</section>`;

  if(WHO.t==="j"&&!jget(WHO.id)||WHO.t==="g"&&!gget(WHO.id)) WHO={t:"i"};

    ${Gs.map(g=>`<button type="button" class="tg" data-w="g:${g.id}" aria-pressed="${WHO.t==="g"&&WHO.id===g.id}">👥 ${esc(g.nom)}</button>`).join("")}
    ${J.slice(0,40).map(j=>`<button type="button" class="tg" data-w="j:${j.id}" aria-pressed="${WHO.t==="j"&&WHO.id===j.id}">${esc(j.nom)}${ageOf(j)!=null?" · "+ageOf(j):""}</button>`).join("")}</div>
    ${WHO.t==="j"?`<p class="msg">${whoLine(jget(WHO.id))} · <a href="#/joueur/${WHO.id}">son warm-up</a></p>`:WHO.t==="g"?`<p class="msg">${esc(gget(WHO.id).nom)} : ${HAS?GRUN.groupes.joueurs(WHO.id).length:0} joueurs · le plus jeune donne l'âge · <a href="#/groupe/${WHO.id}">ses routines</a></p>`:""}
    ${WHO.t==="j"&&ageOf(jget(WHO.id))==null?profilAsk(WHO.id,ST.profil[WHO.id]):""}</div>`;
  const saved=ST.routines.slice().sort((a,b)=>(b.maj||"")<(a.maj||"")?-1:1);
  main.innerHTML=quickScreen("Create my warm-up","L'échauffement construit pour le joueur : âge, sexe, croissance, durée, ce qui suit et lieu.",whoSel)+
   (saved.length?`<section class="sec"><h2>Routines enregistrées</h2>${routList(saved.slice(0,30))}</section>`:"")+
   (J.length?`<section class="sec"><h2>Par joueur</h2><div class="chips">${J.map(j=>`<a class="tg" href="#/joueur/${j.id}">${esc(j.nom)}</a>`).join("")}${Gs.map(g=>`<a class="tg" href="#/groupe/${g.id}">👥 ${esc(g.nom)}</a>`).join("")}</div></section>`:"")+
   `<section class="sec"><h2>Mes jeux</h2><a class="li solo" href="#/m"><span class="code">♥ ${ST.fav.length}</span><span class="tt">Coups de cœur et jeux masqués<small>${ST.hide.length} jeu${ST.hide.length>1?"x":""} masqué${ST.hide.length>1?"s":""} · ${POOL.length} jeux d'échauffement dans la banque</small></span></a></section>
   <section class="sec"><h2>Historique</h2>${histHtml(null,40)}</section>
   <section class="sec"><h2>Sauvegarde</h2><div class="tools"><button class="ib" id="exp" type="button">Sauvegarder (toute l'appli)</button><label class="ib">Restaurer<input type="file" id="imp" accept=".json,application/json" hidden></label></div><p class="msg" id="smsg">Tout reste sur cet appareil.</p></section>`;
  $$("[data-w]").forEach(b=>b.onclick=()=>{ const [t,id]=b.dataset.w.split(":"); WHO=t==="i"?{t:"i"}:{t,id}; ST.lastWho=WHO; saveNow(); showHome(); });
  bindScreen(showHome); if(WHO.t==="j") bindAsk(WHO.id,showHome);
  bindSave();
}
function whoLine(j){ if(!j) return ""; const a=ageOf(j), m=HAS?GRUN.maturite(j):null, c=mesureCrois(j);
  return `${esc(j.nom)}${a!=null?" · "+ageLab(a):""} · ${j.sexe==="F"?"fille":"garçon"}${m?" · "+esc(m.statut):c==="probable"?" · âge du pic de croissance probable":""}${(j.zones||[]).length?" · zones : "+esc(j.zones.join(", ")):""}`; }
function bindSave(){
  $("#exp")&&($("#exp").onclick=()=>{ saveNow(); if(HAS) GRUN.telecharger(GRUN.exportAll(),`GRUN_${todayIso()}.json`); });
  $("#imp")&&($("#imp").onchange=e=>{ const f=e.target.files[0]; if(!f) return; const rd=new FileReader(); rd.onload=()=>{ try{ const d=JSON.parse(rd.result);
      if(d.format==="routines"&&d.st){ const s=d.st; ST.routines=[...ST.routines,...(s.routines||[]).filter(x=>!ST.routines.some(y=>y.id===x.id))]; ST.hist=[...ST.hist,...(s.hist||[])]; ST.fav=[...new Set([...ST.fav,...(s.fav||[])])]; ST.hide=[...new Set([...ST.hide,...(s.hide||[])])]; saveNow(); }
      else if(HAS){ GRUN.importAll(d); ST=load(RK,{}); fixST(); }
      else throw 0; route(); }catch(x){ $("#smsg").textContent="Ce fichier n'est pas une sauvegarde de GRÜN."; } }; rd.readAsText(f); });
}
function routList(L){ const favs=new Set(ST.fav); L.forEach(r=>(r.jids||[]).forEach(id=>(jget(id)?.favWarmup||[]).forEach(x=>favs.add(x))));
  return `<div class="list">${L.map(r=>`<a class="li" href="#/r/${r.id}"><span class="code">${Math.round(r.duree)} min</span><span class="tt">${favs.has(r.id)?"♥ ":""}${esc(r.nom||"Routine")}<small>${esc(whoName(r))} · ${esc(APRES[r.apres]||"")}${r.sous?" ("+esc(sousN(r).toLowerCase())+")":""} · ${r.blocks.length} blocs · ${esc(LIEUX[r.lieu]||"")}</small></span></a>`).join("")}</div>`; }
function histHtml(who,max){
  const H=ST.hist.filter(h=>!who||who.includes(h.who));
  if(!H.length) return `<div class="empty">Aucun échauffement fait pour l'instant.</div>`;
  const nm=w=>w==="invite"?"Sans profil":(jget(w)?.nom||"Joueur");
  return `<div class="list">${H.slice().reverse().slice(0,max).map(h=>`<div class="li"><span class="code">${frD(h.date).slice(0,5)}</span><span class="tt">${esc(nm(h.who))} · ${h.duree} min avant ${esc((APRES[h.apres]||"").toLowerCase())}${h.rpe!=null?" · dureté "+h.rpe+"/10":""}<small>${h.g.map(id=>esc(G[id]?.n||id)).join(" · ")}</small></span></div>`).join("")}</div>`;
}

  if(!DRAFT){ if(!Q) Q=newQ(); const w=whoBase()||{jids:[],age:12,sexe:"G",n:1}; DRAFT={...w,apres:Q.apres,sous:Q.sous||SOUS0[Q.apres],duree:Q.duree,lieu:Q.lieu,surface:Q.surface,mat:matPour(Q.lieu),meteo:"normal",forme:"frais",zone:"",delai:0}; }

   <p class="msg">Avec un joueur ou un groupe coché, âge, sexe, croissance et zones fragiles viennent de leur fiche.</p></div></section>`:""}

  <section class="sec step"><h2><b>${coach?3:2}</b> Lieu, matériel, avec qui</h2><div class="card">${chips("li",LIEUXL,d.lieu)}<div id="surf"${d.lieu==="court"?"":" hidden"}>${chips("su",SURF,d.surface)}</div>
   <div class="f"><label>Matériel disponible</label><div class="chips">${MAT.map(([v,l])=>`<button type="button" class="tg sm" data-m="${v}" aria-pressed="${d.mat.includes(v)}">${l}</button>`).join("")}</div></div>
   ${coach?"":`<div class="f"><label>Avec qui</label>${chips("nb",{1:"Seul",2:"À deux",3:"En groupe"},Math.min(3,d.n||1))}</div>`}</div></section>
  <section class="sec step"><h2><b>${coach?4:3}</b> Conditions du jour</h2><div class="card"><div class="f"><label>Météo</label>${chips("me",METEO,d.meteo)}</div><div class="f"><label>Forme</label>${chips("fo",FORME,d.forme)}</div>
   <div id="zz"${d.forme==="douleur"?"":" hidden"} class="f"><label>Zone</label>${chips("zo",ZN,d.zone)}</div>
   ${d.apres==="match"?`<div class="f"><label>Délai entre la fin de l'échauffement et le match</label>${chips("de",{0:"Tout de suite",5:"5 min",15:"15 min",30:"30 min et plus"},d.delai)}</div>`:""}</div></section>
  <div class="tools bigact"><button class="go big" id="build" type="button">Construire la structure</button><button class="ib" id="build2" type="button">Construire et remplir pour moi</button></div>`;
  const tog=(a,fn,re)=>$$(`[data-${a}]`).forEach(b=>b.onclick=()=>{ fn(b.dataset[a]); if(re) showChoix(); else $$(`[data-${a}]`).forEach(x=>x.setAttribute("aria-pressed",x===b)); });
  tog("ap",v=>{ d.apres=v; d.sous=SOUS0[v]; },1); tog("so",v=>d.sous=v); tog("du",v=>d.duree=+v); tog("li",v=>{ d.lieu=v; d.mat=matPour(v); },1); tog("su",v=>d.surface=v);

  $$("[data-m]").forEach(b=>b.onclick=()=>{ const m=b.dataset.m; d.mat=d.mat.includes(m)?d.mat.filter(x=>x!==m):[...d.mat,m]; b.setAttribute("aria-pressed",d.mat.includes(m)); });
  $("#cn")&&($("#cn").onchange=e=>d.n=Math.max(1,+e.target.value||1)); $("#ca")&&($("#ca").onchange=e=>{ d.age=Math.max(4,Math.min(18,+e.target.value||12)); showChoix(); });

  $("#build").onclick=()=>fin("choix"); $("#build2").onclick=()=>fin("auto");

/* ---------- LA ROUTINE ---------- */
const fsec=s=>{ s=Math.round(s/5)*5; return s>=60?(Math.floor(s/60)+" min"+(s%60?" "+(s%60):"")):s+" s"; };
function getR(id){ const r=id==="cur"?ST.cur:ST.routines.find(r=>r.id===id); if(r) migrate(r); return r; }
const slotLab=(b,s)=>b.et==="JC"?"Couvre : "+b.ets.map(e=>ET[e].n).join(" · "):(s.t.length===CIB[b.et].length&&s.t.length>1?"Tout le bloc":s.t.map(x=>CIBN[x]||x).join(" + "));
function favToggle(r,id){ const one=r.jids?.length===1?r.jids[0]:(isJ()&&meJid())||null;
  if(one&&HAS&&jget(one)){ const j=jget(one); const f=j.favWarmup||[]; const nf=f.includes(id)?f.filter(x=>x!==id):[...f,id]; GRUN.joueurs.update(one,{favWarmup:nf}); return nf.includes(id); }
  ST.fav=ST.fav.includes(id)?ST.fav.filter(x=>x!==id):[...ST.fav,id]; saveNow(); return ST.fav.includes(id); }
function showRoutine(id){
  const r=getR(id); if(!r){ go("#"); return; }
  const coach=!isJ()&&r.mode!=="j", tot=r.blocks.reduce((a,b)=>a+b.min,0), favs=favSet(r);
  const nJ=r.blocks.reduce((a,b)=>a+b.slots.length,0), done=r.blocks.length&&r.blocks.every(b=>b.slots.every(s=>s.g));
  const cov=couvertes(r);
  main.innerHTML=`<div class="crumb"><a href="#">Warm-up</a> › ${id==="cur"?"Ta routine":"Routine enregistrée"}</div>
  <h1>${esc(r.nom||("Échauffement "+Math.round(r.duree)+" min"))}</h1>
  <p class="lead">${esc(whoName(r))} · avant ${esc(APRES[r.apres].toLowerCase())}${r.sous?" ("+esc(sousN(r).toLowerCase())+")":""} · ${esc(LIEUXL[r.lieu]||"")}${r.lieu==="court"&&SURF[r.surface]?" "+SURF[r.surface].toLowerCase():""}</p>
  ${r.logique?`<div class="why"><b>Pourquoi cet échauffement</b><p>${esc(r.logique)}</p><div class="etc">${ORD.map(e=>`<span class="${cov.has(e)?"on":""}" style="--c:${ET[e].c}">${ET[e].n}</span>`).join("")}</div></div>`:""}
  ${(r.notes||[]).map(n=>`<p class="note">${esc(n)}</p>`).join("")}
  <div class="tbar"><b>${fmn(steps(r).reduce((a,x)=>a+x.sec,0)/60)}</b> · ${r.blocks.length} blocs · ${nJ} jeux <span class="sp"></span><button class="ib sm" id="hab" type="button" title="Comme d'habitude">♥ Habitude</button><button class="ib sm" id="sur" type="button">🎲 Surprends-moi</button></div>
  <div class="tools bigact top1"><button class="go big lan" id="gostart" type="button" ${done?"":"disabled"}>${done?"▶ Lancer":"Choisis un jeu dans chaque case"}</button>${done?"":`<button class="ib" id="fill" type="button">Remplir les cases vides</button>`}</div>
  <div class="blks">${r.blocks.map((b,i)=>{ const sec=gameSec(b,r); return `<div class="blk" style="--c:${ET[b.et].c}"><div class="bh"><span class="bn">${i+1}</span><div><b>${esc(bname(b))}</b><small>${fmn(b.min)} · ${b.slots.length} jeu${b.slots.length>1?"x":""} de ${fsec(sec)}${b.slots.length>1?" + transitions":""}</small></div>${coach?`<span class="sp"></span><input type="number" class="nb" min="0.5" step="0.5" value="${Math.round(b.min*2)/2}" data-min="${i}" aria-label="Minutes"><button class="ib sm" data-del="${i}" aria-label="Retirer le bloc" type="button">×</button>`:""}</div>
    ${b.slots.map((s,j)=>{ const g=s.g&&G[s.g];
      return `<div class="slot"><span class="stl">${esc(slotLab(b,s))}</span>${g?`<button type="button" class="gsel" data-pick="${i}:${j}"><b>${favs.has(g.id)?"♥ ":""}${esc(g.n)}${s.neuf?' <em class="nv">nouveau</em>':""}</b><span>${esc(g.but)}</span></button>`:`<button type="button" class="go pick" data-pick="${i}:${j}">Choisir</button>`}</div>`; }).join("")}</div>`; }).join("")}</div>
  ${coach?`<div class="tools"><button class="ib" id="addb" type="button">+ Ajouter un bloc</button></div>`:""}
  <div class="tools bigact"><button class="go big lan" id="gostart2" type="button" ${done?"":"disabled"}>${done?"▶ Lancer":"Choisis un jeu dans chaque case"}</button></div>
  <div class="tools"><button class="ib" id="save" type="button">${id==="cur"?"Enregistrer cette routine":"Renommer"}</button>${id!=="cur"?`<button class="ib${favs.has(r.id)?" on":""}" id="rfav" type="button">♥ Routine favorite</button>`:""}<button class="ib" id="snd" type="button">📲 Envoyer au joueur</button><button class="ib" id="pdf" type="button">PDF / partager</button>${id!=="cur"?`<button class="ib" id="dup" type="button">Refaire avec d'autres jeux</button><button class="ib" id="del" type="button">Supprimer</button>`:""}</div>`;
  const store=()=>{ r.maj=todayIso(); saveNow(); };
  const resum=()=>{ r.duree=Math.round(r.blocks.reduce((a,b)=>a+b.min,0)); };
  $$("[data-pick]").forEach(b=>b.onclick=()=>{ const [i,j]=b.dataset.pick.split(":").map(Number); picker(r,i,j,id); });
  $("#sur").onclick=()=>{ remplir(r,"surprise"); store(); showRoutine(id); };
  $("#hab").onclick=()=>{ remplir(r,"habitude"); store(); showRoutine(id); };
  $("#fill")&&($("#fill").onclick=()=>{ remplir(r,"auto",true); store(); showRoutine(id); });
  const R=regles(r);

/* ---------- MODE GUIDÉ : chrono, vidéo, bip, du plus doux au plus vif ---------- */
let TIMER=null, ACX=null;
function beep(){ try{ ACX ||= new (window.AudioContext||window.webkitAudioContext)(); [0,0.25,0.5].forEach(t=>{ const o=ACX.createOscillator(), g=ACX.createGain(); o.frequency.value=t<0.5?880:1320; o.connect(g); g.connect(ACX.destination); g.gain.setValueAtTime(0.25,ACX.currentTime+t); g.gain.exponentialRampToValueAtTime(0.001,ACX.currentTime+t+0.2); o.start(ACX.currentTime+t); o.stop(ACX.currentTime+t+0.22); }); }catch(e){} if(navigator.vibrate) navigator.vibrate([200,100,200]); }
const trOf=r=>r.tr||10, TRM=20;
function gameSec(b,r){ const n=b.slots.length, tr=r?trOf(r):10; return Math.max(15,Math.round((b.min*60-(n-1)*tr)/n)); }
function steps(r){
  const S=[]; let prev=null;
  r.blocks.forEach((b,i)=>{ const order=b.slots.map((s,j)=>({s,j})).sort((x,y)=>((G[x.s.g]?.int||2)-(G[y.s.g]?.int||2))||(x.j-y.j));
    const gsec=gameSec(b,r);
    order.forEach(({s},m)=>{ const g=G[s.g];
      if(prev){ const newMat=(g?.mat||[]).filter(x=>!(G[prev]?.mat||[]).includes(x)); S.push({tr:true,b,s,sec:newMat.length?Math.max(TRM,trOf(r)):trOf(r),newMat}); }
      S.push({b,i,s,j:m,sec:gsec}); prev=s.g; }); });
  return S;
}
let AUTO=true;

  const r=getR(id); if(!r){ go("#"); return; } k=+k||0; clearInterval(TIMER);

  const x=S[k], b=x.b, g=G[x.s.g]; let left=x.sec;

     <div class="tools"><a class="go big" href="${gh(k+1)}">J'y suis</a></div><div class="terx">${g?`<p class="but">${esc(g.but)}</p><p>${esc(g.de)}</p>`:""}</div></div>`;
  } else {
  main.innerHTML=`<div class="ter" style="--c:${ET[b.et].c}"><div class="terh"><a class="ib" href="#/r/${id}">Quitter</a><span>Jeu ${gi}/${games.length}</span></div>${bar}
   <div class="etq">${esc(nm)} · ${x.j+1}/${b.slots.length}</div><h1>${esc(g?.n||"")}</h1>
   <div class="clock" id="clk"></div>
   <div class="tools"><button class="go big" id="st" type="button">${k===0?"Démarrer":"Pause"}</button><a class="ib" href="${gh(k+1)}" id="nxt">${nx?"Suivant ›":"Terminer"}</a></div>
   <label class="chk"><input type="checkbox" id="auto"${AUTO?" checked":""}> Enchaîner tout seul</label>
   <p class="msg">Joue pendant le temps du chrono : si la fiche parle d'un nombre de passages, adapte-le.</p>
   <div id="vid"></div><div class="terx">${g?ficheHtml(g):""}</div>
   ${nx?`<p class="msg">Ensuite : ${esc(bname(nx.b))} · ${esc(G[nx.s.g]?.n||"")}</p>`:""}</div>`;
  }
  const show=()=>{ const m=Math.floor(Math.abs(left)/60), s=Math.abs(left)%60; $("#clk").textContent=(left<0?"+":"")+m+":"+String(s).padStart(2,"0"); $("#clk").classList.toggle("over",left<0); };
  let run=false;

  show();
  $("#auto")&&($("#auto").onchange=e=>AUTO=e.target.checked);
  $("#st")&&($("#st").onclick=()=>{ try{ ACX ||= new (window.AudioContext||window.webkitAudioContext)(); ACX.resume(); }catch(e){} if(run){ run=false; clearInterval(TIMER); $("#st").textContent="Reprendre"; } else start(); });
  if(x.tr||(k>0&&AUTO)) start();
  if(g&&!x.tr) videoOf(g.id).then(v=>{ const el=$("#vid"); if(el) el.innerHTML=vidHtml(v); });

/* ---------- ENVOYER AU JOUEUR : la routine voyage dans un lien ---------- */
const b64e=s=>btoa(unescape(encodeURIComponent(s))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const b64d=s=>decodeURIComponent(escape(atob(s.replace(/-/g,"+").replace(/_/g,"/"))));
async function envoyer(r){
  const nm=r.gid?gget(r.gid)?.nom||"":r.jids?.length?r.jids.map(id=>(jget(id)?.nom||"").split(" ")[0]).join(", "):"";
  const p={v:2,nm,nom:r.nom||"",ag:r.age,sx:r.sexe,ap:r.apres,so:r.sous||"",du:r.duree,li:r.lieu,su:r.surface,n:r.n,me:r.meteo,fo:r.forme,zo:r.zone||"",de:r.delai||0,mat:r.mat,tr:r.tr||10,lo:r.logique||"",no:r.notes||[],
    b:r.blocks.map(b=>[b.et,b.k||1,b.min,b.slots.map(s=>[s.t,s.g||""]),b.ets||null,b.nom||"",b.type||""])};
  const msg=`Ton échauffement ${Math.round(r.duree)} min${nm?" ("+nm+")":""} : ouvre ce lien, puis « Lancer »`;
  if(typeof Partage!=="undefined"){ await Partage.envoyer(p,"Échauffement",msg,openSheet,esc); return; }
  const url=location.origin+location.pathname+"#x/"+b64e(JSON.stringify(p));
  try{ if(navigator.share){ await navigator.share({title:"Échauffement",text:msg,url}); return; } }catch(e){ if(e&&e.name==="AbortError") return; }
  try{ await navigator.clipboard.writeText(url); }catch(e){}
  openSheet(`<div class="shh"><b>Envoyer au joueur</b><button class="ib" data-close type="button">×</button></div><p class="msg">Lien copié. Colle-le dans un message à ton joueur : il ouvre l'échauffement directement sur son téléphone.</p><textarea class="srch" rows="4" readonly>${esc(url)}</textarea>`);
}
async function recevoir(code){
  try{ const p=(code[0]==="z"||code[0]==="p")&&typeof Partage!=="undefined"?await Partage.dec(code):JSON.parse(b64d(code));
    const r={id:"cur",mode:"j",recu:p.nm||"",nom:p.nom||(p.nm?"Échauffement préparé pour "+p.nm:""),date:todayIso(),jids:isJ()&&meJid()?[meJid()]:[],age:p.ag,sexe:p.sx||"G",apres:p.ap,sous:p.so,duree:p.du,lieu:p.li,surface:p.su||"dur",n:p.n||1,mat:p.mat||[],meteo:p.me||"normal",forme:p.fo||"frais",zone:p.zo||"",delai:p.de||0,tr:p.tr||10,logique:p.lo||"",notes:p.no||[],

  const R=ST.routines.filter(r=>(r.jids||[]).includes(jid)||(r.gid&&(gget(r.gid)?.jids||[]).includes(jid)));
  const fv=j.favWarmup||[], fG=fv.filter(id=>G[id]), fR=fv.map(id=>ST.routines.find(r=>r.id===id)).filter(Boolean);
  const ret=HAS?GRUN.journal.retours(jid).filter(x=>x.type==="warmup"):[];
  main.innerHTML=`<div class="crumb"><a href="#">Warm-up</a> › ${esc(j.nom)}</div><h1>${esc(j.nom)}</h1><p class="lead">${whoLine(j)}${HAS&&!isJ()?` · <a href="${GRUN.href("joueurs","#/j/"+jid)}">dossier complet</a>`:""}</p>
   <div class="tools bigact"><button class="go big" id="nw" type="button">Nouveau warm-up pour ${esc(j.nom.split(" ")[0])}</button></div>
   <section class="sec"><h2>Ses routines (${R.length})</h2>${R.length?routList(R):`<div class="empty">Aucune routine enregistrée.</div>`}</section>
   <section class="sec"><h2>Ses favoris</h2>${fR.length?routList(fR):""}${fG.length?`<div class="list">${fG.map(id=>`<div class="li"><span class="code">♥</span><span class="tt">${esc(G[id].n)}<small>${esc((ET[isMulti(G[id])?"JC":G[id].et]).n)} · ${esc(G[id].but)}</small></span><button class="ib sm" type="button" data-uf="${id}">Retirer</button></div>`).join("")}</div>`:(fR.length?"":`<div class="empty">Aucun favori : ♥ dans la liste d'une case ou sur une routine.</div>`)}</section>
   <section class="sec"><h2>Historique</h2>${histHtml([jid],40)}${ret.length?`<p class="msg">${ret.length} retour${ret.length>1?"s":""} dans son journal · dernier : ${frD(ret[0].date)}, ${ret[0].duree} min, dureté ${ret[0].rpe}/10.</p>`:""}</section>`;
  $("#nw").onclick=()=>{ WHO={t:"j",id:jid}; ST.lastWho=WHO; saveNow(); go("#/nouveau"); };
  $$("[data-uf]").forEach(b=>b.onclick=()=>{ GRUN.joueurs.update(jid,{favWarmup:(jget(jid).favWarmup||[]).filter(x=>x!==b.dataset.uf)}); showJoueur(jid); });
}
function showGroupe(gid){
  const g=gget(gid); if(!g){ main.innerHTML=`<div class="empty">Groupe introuvable.</div>`; return; }
  const R=ST.routines.filter(r=>r.gid===gid), J=GRUN.groupes.joueurs(gid);
  main.innerHTML=`<div class="crumb"><a href="#">Warm-up</a> › 👥 ${esc(g.nom)}</div><h1>${esc(g.nom)}</h1><p class="lead">${J.length} joueurs : ${J.map(j=>`<a href="#/joueur/${j.id}">${esc(j.nom)}</a>`).join(", ")}</p>
   <div class="tools bigact"><button class="go big" id="nw" type="button">Nouveau warm-up pour le groupe</button></div>
   <section class="sec"><h2>Routines du groupe (${R.length})</h2>${R.length?routList(R):`<div class="empty">Aucune routine enregistrée.</div>`}</section>
   <section class="sec"><h2>Historique</h2>${histHtml(g.jids,40)}</section>`;
  $("#nw").onclick=()=>{ WHO={t:"g",id:gid}; ST.lastWho=WHO; saveNow(); go("#/nouveau"); };
}

/* ---------- PDF ---------- */
async function pdfRoutine(r){
  const btn=$("#pdf"); btn.textContent="Préparation…";
  try{ const d=new MiniPDF.Doc(), M=d.M, W=d.W-2*M;
    d.para(r.nom||("Échauffement "+Math.round(r.duree)+" min"),{size:18,bold:true,after:4});
    d.para(`${whoName(r)} · avant : ${APRES[r.apres]}${r.sous?" ("+sousN(r)+")":""} · ${Math.round(r.duree)} min · ${LIEUXL[r.lieu]||""}`,{size:10,color:"#5D6675",after:4});
    if(r.logique) d.para(r.logique,{size:10,after:10});
    r.blocks.forEach((b,i)=>{ d.need(60); d.rect(M,d.y,W,18,{fill:ET[b.et].c}); d.text(M+8,d.y+4,`${i+1}. ${bname(b)}`,{size:11,bold:true,color:"#FFFFFF"}); const mn=fmn(b.min)+" · "+b.slots.length+" jeu"+(b.slots.length>1?"x":""); d.text(M+W-8-MiniPDF.width(mn,11,true),d.y+4,mn,{size:11,bold:true,color:"#FFFFFF"}); d.y+=24;
      b.slots.forEach(s=>{ const g=G[s.g]; const lab=slotLab(b,s);
        if(g){ d.need(40); d.para(`${g.n}  (${fsec(gameSec(b,r))} · ${lab})`,{size:11,bold:true,after:1}); d.para(g.de,{size:9.5,after:1}); (g.co||[]).forEach(c=>d.para("• "+c,{size:9,x:M+6,after:0})); d.y+=5; }
        else d.para(lab+" : (jeu à choisir)",{size:9.5,color:"#8A94A3"}); });
      d.y+=6; });
    const res=await MiniPDF.deliver(d.out(),`Echauffement ${Math.round(r.duree)} min ${todayIso()}.pdf`); btn.textContent=res==="download"?"PDF téléchargé":"PDF / partager";
  }catch(e){ console.warn(e); btn.textContent="Erreur PDF"; }
  setTimeout(()=>{ const x=$("#pdf"); if(x) x.textContent="PDF / partager"; },2500);
}

/* ---------- ROUTAGE ----------
   #/nouveau (lit le relais) · #/choix · #/r/<id> · #/guide/<id>[/<k>] · #/joueur/<jid> · #/groupe/<gid> · #/m · #/x/<code>
   anciennes adresses gardées : #r/<id>, #g/<id>/<k>, #j/…, #c, #m, #x/<code> */
function route(){
  clearInterval(TIMER); closeSheet();
  const parts=location.hash.replace(/^#\/?/,"").split("/").map(decodeURIComponent); const [a,b,c]=parts;
  document.body.classList.toggle("terrain",a==="g"||a==="guide");
  if(a==="x"&&b) recevoir(b);
  else if(a==="m") showMesJeux();
  else if(a==="nouveau") showNouveau();
  else if(a==="choix") showChoix();
  else if(a==="j"||a==="c") { location.replace(a==="c"?"#/choix":"#/nouveau"); return; }
  else if(a==="r"&&b) showRoutine(b);
  else if((a==="g"||a==="guide")&&b) showGuide(b,c);
  else if(a==="joueur"&&b) showJoueur(b);
  else if(a==="groupe"&&b) showGroupe(b);
  else showHome();
  relaisBar();
  scrollTo(0,0); $("#back").style.visibility=a?"visible":"hidden";
}
function showNouveau(){
  const h=HAS?GRUN.relais.lire():null;
  if(h&&!h.res&&(!h.vers||h.vers==="warmup")&&!h.wu){
    const {ap,so}=normApres(h); let w={jids:[],age:age18(h.age)||(h.age==="adulte"?18:12),sexe:h.sexe==="F"?"F":"G",n:+h.n||1};
    if(h.gid&&gget(h.gid)){ const J=GRUN.groupes.joueurs(h.gid); const ag=J.map(ageOf).filter(x=>x!=null); w={jids:[],gid:h.gid,age:age18(h.age)||(h.age==="adulte"?18:(ag.length?Math.min(...ag):12)),sexe:J.some(j=>j.sexe==="F")?"F":"G",n:J.length||1}; }
    else if(h.jid&&jget(h.jid)){ const j=jget(h.jid); w={jids:[h.jid],age:ageOf(j)??(age18(h.age)||12),sexe:j.sexe||h.sexe,n:1}; }
    const lieu=LIEUX[h.lieu]?h.lieu:"court", D=Math.max(3,Math.min(60,+h.duree||10));
    const mat=Array.isArray(h.mat)?h.mat:matPour(lieu);
    const hs=histStats({jids:w.jids,gid:w.gid});
    ST.cur=construire({...w,apres:ap,sous:so,duree:D,lieu,surface:"dur",mat:mat.filter(m=>matOkAge(m,w.age)),meteo:"normal",forme:"frais",zone:"",delai:0,mode:"c"},hs.total?"habitude":"auto");
    setRelais({retour:h.retour||"seances.html",de:h.de||"seances",t:h.t});
    h.wu=1; if(HAS) GRUN.save(GRUN.K.handoff,h); saveNow();
    location.replace("#/r/cur"); return;
  }
  showHome();
}
addEventListener("hashchange",route);
let BOOTED=false;
async function boot(){
  try{ const r=await fetch("data-warmup.json"); DATA=r.ok?await r.json():{}; }catch(e){ DATA={}; }
  await buildPool();
  if(!POOL.length){ main.innerHTML=`<div class="empty">Impossible de charger les jeux. Ouvre l'appli une fois avec une connexion.</div>`; return; }
  if(HAS){ GRUN.nav("create"); GRUN.on("grun:banque",async()=>{ await buildPool(); }); GRUN.on("grun:joueurs",()=>{ if(/joueur|^#?$/.test(location.hash)) route(); }); }
  BOOTED=true; route();
}
/* outils de test et d'intégration (séance, terrain) */
window.WU={steps,regles,planifier,construire,remplir,couvertes,exportRoutine,candidats,pool:()=>POOL,G:()=>G,ST:()=>ST};
boot();
