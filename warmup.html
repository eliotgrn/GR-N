<!doctype html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png">
<style>/* GRÜN — styles communs injectés dans chaque module (barre des pôles en bas, éléments partagés).
   Les modules gardent leurs jetons (--bg, --panel, --ink, --mute, --line, --soft) au style Veille. */
:root{--grun:#0F766E;--grun-ink:#0B3B36;--nav-h:62px}
body.grun-has-nav{padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px))}
#grun-nav{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:space-around;align-items:stretch;
  background:var(--panel,#fff);border-top:1px solid var(--line,#D9DDE3);padding-bottom:env(safe-area-inset-bottom,0px);
  box-shadow:0 -4px 18px rgba(0,0,0,.05)}
#grun-nav a{flex:1;max-width:140px;min-height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  text-decoration:none;color:var(--mute,#5D6675);font:600 11.5px/1.1 var(--ui,system-ui,sans-serif);letter-spacing:.01em}
#grun-nav svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#grun-nav a.on{color:var(--ink,#16202E)}
#grun-nav a.on svg{stroke:var(--grun)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) #grun-nav{box-shadow:none}}
@media print{#grun-nav{display:none}body.grun-has-nav{padding-bottom:0}}
/* fil « poupée russe » : bandeau de retour vers le module appelant */
.grun-relais{position:sticky;top:0;z-index:40;display:flex;gap:10px;align-items:center;justify-content:space-between;
  background:var(--grun);color:#fff;padding:8px 16px;font:600 14px/1.3 var(--ui,system-ui,sans-serif)}
.grun-relais a,.grun-relais button{color:#fff;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);border-radius:8px;
  min-height:36px;padding:0 12px;display:inline-flex;align-items:center;text-decoration:none;font:inherit;white-space:nowrap}
.grun-mod #back{visibility:visible!important}
</style>
<script src="grun.js?v=1"></script>
<meta name="grun-module" content="warmup"></head><body><title>Choose your warm-up · GRÜN</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Choose your warm-up : bibliothèque (cartes par tranche de durée, filtres) → fiche → mode terrain plein écran ; éditeur de « Mes échauffements ». Style Veille. */
:root{
  --bg:#F4F5F7; --panel:#FFFFFF; --ink:#16202E; --mute:#5D6675; --line:#D9DDE3; --soft:#ECEFF3; --mark:#FFE58A;
  --acc:#C2410C; --acc-soft:#FFF1E8; --ok:#0F766E;
  --ui:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --read:"Source Serif 4",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10141B; --panel:#181E28; --ink:#E6EAF0; --mute:#9AA4B3; --line:#2B3442; --soft:#212938; --mark:#6B5A12;
  --acc:#F08A4B; --acc-soft:#3A1E10; --ok:#3CC7B2; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10141B; --panel:#181E28; --ink:#E6EAF0; --mute:#9AA4B3; --line:#2B3442; --soft:#212938; --mark:#6B5A12;
  --acc:#F08A4B; --acc-soft:#3A1E10; --ok:#3CC7B2; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.45;margin:0;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
a{color:inherit}
button,input,select,textarea{font:inherit;color:var(--ink)}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.topin{max-width:1100px;margin:0 auto;padding-block:8px;padding-inline:16px;display:flex;gap:8px;align-items:center}
.ib{min-width:40px;min-height:40px;border:1px solid var(--line);background:var(--panel);border-radius:9px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:600;padding:0 12px;white-space:nowrap;text-decoration:none}
.ib.sm{min-width:36px;min-height:36px;padding:0 9px;font-size:14px}
.ib.on{color:#B91C1C;border-color:#B91C1C}
.brand{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.01em;white-space:nowrap;text-decoration:none;overflow:hidden;text-overflow:ellipsis}
main{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:16px 60px}
h1{font-family:var(--display);font-weight:700;font-size:32px;line-height:1.05;margin:0;text-wrap:balance}
.lead{color:var(--mute);margin:6px 0 0}
.sec{margin-top:24px}
.sec>h2{font-family:var(--display);font-size:22px;font-weight:700;margin:0 0 10px;display:flex;align-items:baseline;gap:8px}
.sec>h2 small{font-family:var(--ui);font-size:13px;font-weight:500;color:var(--mute)}
.msg{font-size:13.5px;color:var(--mute)}
.empty{color:var(--mute);padding:14px;background:var(--panel);border:1px dashed var(--line);border-radius:12px}
.load{padding:40px 0;color:var(--mute)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.go{min-height:44px;border-radius:10px;border:none;background:var(--ink);color:var(--bg);font-weight:600;padding:0 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.go.acc{background:var(--acc);color:#fff}
.go.big{min-height:58px;font-size:20px;padding:0 28px;border-radius:14px;font-family:var(--display);letter-spacing:.02em}
.go[disabled]{opacity:.45}
.lnk{all:unset;cursor:pointer;color:var(--acc);font-weight:600;font-size:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.note{background:#FEF3C7;color:#5B3B00;border-radius:10px;padding:9px 12px;font-size:14.5px;margin:10px 0}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .note{background:#3A2E08;color:#F5DE9A}}
:root[data-theme="dark"] .note{background:#3A2E08;color:#F5DE9A}

/* filtres */
.filt{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.frow{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.frow::-webkit-scrollbar{display:none}
.tabs{gap:0;border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:3px;align-self:flex-start;max-width:100%}
.tab{border:none;background:none;border-radius:9px;padding:0 16px;min-height:40px;font-weight:700;font-size:15px;white-space:nowrap;color:var(--mute)}
.tab[aria-selected=true]{background:var(--ink);color:var(--bg)}
.fl{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--mute);flex:0 0 auto;align-self:center;min-width:64px}
.tg{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 13px;font-size:14px;font-weight:600;min-height:38px;white-space:nowrap;flex:0 0 auto}
.tg[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tg.sm{min-height:32px;padding:3px 10px;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* cartes */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
@media (max-width:640px){.grid{grid-template-columns:minmax(0,1fr)}}
.wc{position:relative;display:flex;flex-direction:column;gap:6px;text-decoration:none;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px 12px 18px;overflow:hidden;min-height:112px}
.wc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:linear-gradient(var(--g1,#C2410C),var(--g2,#B91C1C))}
.wc:active{transform:scale(.99)}
.wch{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.wch b{font-family:var(--display);font-size:24px;line-height:1.05}
.dur{flex:0 0 auto;font-family:var(--display);font-weight:700;font-size:20px;line-height:1;background:var(--soft);border-radius:10px;padding:6px 9px;text-align:center}
.dur small{display:block;font-family:var(--ui);font-size:11px;font-weight:600;color:var(--mute)}
.wcr{color:var(--mute);font-size:14px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pills{display:flex;flex-wrap:wrap;gap:4px;margin-top:auto}
.pill{font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--acc-soft);color:var(--acc);white-space:nowrap}
.pill.k{background:var(--soft);color:var(--ink);font-weight:600;white-space:normal}
.cons li::first-letter,.sb li::first-letter,.ic li::first-letter{text-transform:uppercase}
.pill.mine{background:#E6F6F3;color:#0F766E}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pill.mine{background:#123A35;color:#7FE0D0}}
:root[data-theme="dark"] .pill.mine{background:#123A35;color:#7FE0D0}
.fav{color:#B91C1C}

/* fiche */
.crumb{font-size:13px;color:var(--mute)}
.crumb a{color:var(--acc);font-weight:600;text-decoration:none}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--mute);font-size:14.5px;margin-top:8px}
.meta b{color:var(--ink)}
.resume{font-family:var(--read);font-size:17px;line-height:1.55;margin:12px 0 0;max-width:68ch}
.launch{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px;align-items:center}
.launch .go.big{flex:1 1 260px;max-width:420px}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.sits{display:flex;flex-direction:column;gap:6px}
.sit{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:12px}
.sit>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px}
.sit>summary::-webkit-details-marker{display:none}
.sn{width:26px;height:26px;border-radius:50%;background:var(--c);color:#fff;font-weight:700;font-size:13px;display:inline-flex;align-items:center;justify-content:center}
.st b{display:block;font-size:15.5px;line-height:1.25}
.st small{color:var(--c);font-weight:700;font-size:12px;letter-spacing:.03em}
.sd{font-variant-numeric:tabular-nums;font-weight:600;color:var(--mute);white-space:nowrap}
.sb{padding:0 14px 12px 50px;font-size:15px}
.sb p{margin:4px 0}
.sb ul{margin:4px 0;padding-left:18px}
.vidn{font-size:12.5px;color:var(--mute);background:var(--soft);border-radius:8px;padding:6px 9px;display:inline-block;margin-top:6px}
.info{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
@media (max-width:640px){.info{grid-template-columns:minmax(0,1fr)}}
.ic h3{font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--mute);margin:0 0 6px}
.ic ul{margin:0;padding-left:18px}.ic li{margin:2px 0}
.ic p{margin:0}
.ic.plus{border-left:4px solid #0F766E}.ic.moins{border-left:4px solid #B91C1C}
.phl{display:flex;gap:3px;margin-top:10px;height:8px;border-radius:4px;overflow:hidden}
.phl i{display:block;height:100%}

/* feuille */
#sheet{position:fixed;inset:0;background:rgba(10,14,20,.45);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.shin{background:var(--bg);width:100%;max-width:720px;max-height:90vh;overflow:auto;border-radius:16px 16px 0 0;padding:14px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
@media (min-width:760px){#sheet{align-items:center}.shin{border-radius:16px}}
.shh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.shh b{font-family:var(--display);font-size:22px}
body.noscroll{overflow:hidden}
.srch{width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:0 12px}
.res{display:flex;gap:8px;align-items:center;border-top:1px solid var(--line);padding:8px 0}
.res>div{flex:1;min-width:0}
.res b{display:block;font-size:15px;line-height:1.25}
.res small{color:var(--mute);font-size:12.5px}
.jrow{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid var(--line);padding:8px 0}

/* éditeur */
.ebar{position:sticky;top:calc(57px + env(safe-area-inset-top,0px));z-index:4;background:var(--bg);border-bottom:1px solid var(--line);padding:8px 0;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
body.has-relais .ebar{top:calc(109px + env(safe-area-inset-top,0px))}
.ebar .tot{font-family:var(--display);font-size:22px;font-weight:700}
.ebar .sp{flex:1}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f label{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--mute)}
.f input,.f textarea,.f select{min-height:42px;border:1px solid var(--line);border-radius:9px;background:var(--panel);padding:0 10px;width:100%}
.f textarea{padding:8px 10px;line-height:1.4;resize:vertical}
.nomin{font-family:var(--display);font-size:26px!important;font-weight:700;min-height:50px!important}
.eg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:640px){.eg{grid-template-columns:minmax(0,1fr)}}
.es{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.esh{display:flex;gap:8px;align-items:center}
.esh input{flex:1;min-width:0;min-height:42px;border:1px solid var(--line);border-radius:9px;background:var(--bg);padding:0 10px;font-weight:600}
.esr{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.esr select{min-height:38px;border:1px solid var(--line);border-radius:9px;background:var(--bg);padding:0 8px;flex:1 1 140px;max-width:220px}
.esb{display:inline-flex;gap:6px;margin-left:auto}
@media (max-width:420px){.secs span{display:none}}
.secs{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--bg)}
.secs button{all:unset;cursor:pointer;width:36px;height:38px;text-align:center;font-weight:700}
.secs input{width:56px;height:38px;border:none;border-inline:1px solid var(--line);text-align:center;background:var(--panel)}
.secs span{padding:0 8px;font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
.esr .sp{flex:1}
.es details summary{cursor:pointer;font-size:13.5px;font-weight:600;color:var(--acc)}
.es details .f{margin-top:6px}

/* mode terrain */
body.terrain .top,body.terrain #grun-nav{display:none!important}
body.terrain.grun-has-nav{padding-bottom:0}
body.terrain main{padding-block:10px 30px;max-width:1000px}
.ter{--c:#C2410C;display:flex;flex-direction:column;gap:10px;min-height:calc(100vh - 40px)}
.terh{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:16px;color:var(--mute);font-weight:600}
.gbar{display:flex;gap:3px}.gbar i{flex:1;height:7px;border-radius:4px;background:var(--line)}
.ph{align-self:flex-start;background:var(--c);color:#fff;border-radius:999px;padding:4px 14px;font-weight:700;font-size:clamp(14px,2.4vw,20px)}
.ter h1{font-size:clamp(34px,6.5vw,62px);line-height:1.02}
.clock{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums;font-size:clamp(100px,24vw,220px);line-height:.9;text-align:center;margin:4px 0;color:var(--ink)}
.clock.last{color:var(--c)}
.ctl{display:grid;grid-template-columns:72px minmax(0,1fr) 72px;gap:10px}
.ctl button{min-height:68px;border-radius:16px;font-family:var(--display);font-weight:700;font-size:24px;border:1px solid var(--line);background:var(--panel)}
.ctl .main{background:var(--c);border-color:var(--c);color:#fff;font-size:28px}
.cons{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.cons li{font-size:clamp(22px,3.6vw,34px);font-weight:600;line-height:1.2;padding-left:26px;position:relative}
.cons li::before{content:"";position:absolute;left:4px;top:.42em;width:12px;height:12px;border-radius:50%;background:var(--c)}
.tde{font-size:clamp(17px,2.4vw,22px);line-height:1.4;margin:0;color:var(--ink)}
.tser{font-weight:700;font-size:clamp(17px,2.4vw,22px)}
.nxt{margin-top:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px;font-size:clamp(17px,2.6vw,24px)}
.nxt small{display:block;font-size:13px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.nxt.soon{border-color:var(--c);box-shadow:0 0 0 2px var(--c) inset}
.tvid video{width:100%;max-height:44vh;border-radius:12px;background:#000}
.fin{text-align:center;padding-top:30px;max-width:560px;margin:0 auto}
.fin .card{text-align:left;margin-top:16px}
.rpe{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.rpe .tg{min-height:50px;font-size:20px;font-family:var(--display)}
#relais[hidden]{display:none}
body.has-relais .top{top:52px}
.rl-t{flex:1;text-align:center;opacity:.92;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:560px){.rl-t{display:none}}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:70;font-weight:600;max-width:90vw}
.kit{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.kit .card{display:flex;gap:12px;align-items:center}
.kit .ico{font-size:30px;width:46px;height:46px;flex:0 0 46px;border-radius:12px;background:var(--soft);display:flex;align-items:center;justify-content:center}
.kit b{display:block;font-size:16px}
.kit span{color:var(--mute);font-size:14px}
@media print{.top,.noprint,#sheet,#relais,#grun-nav{display:none!important} body{background:#fff;color:#000} main{padding:0} details.sit{break-inside:avoid} details>.sb{display:block}}
</style>
<div id="relais" class="grun-relais" hidden></div>
<header class="top"><div class="topin">
  <button class="ib" id="back" type="button" aria-label="Retour">‹</button>
  <a class="brand" href="#/">Choose your warm-up</a><span style="flex:1"></span>
</div></header>
<main id="main"><div class="load">Chargement…</div></main>
<div id="sheet" hidden></div>
<script>
"use strict";
/* ===== MiniPDF : vrai fichier PDF fabriqué sur l'appareil, sans bibliothèque (Helvetica, A4) ===== */
const MiniPDF = (()=>{
  const CP = {"€":128,"‚":130,"ƒ":131,"„":132,"…":133,"†":134,"‡":135,"ˆ":136,"‰":137,"Š":138,"‹":139,"Œ":140,"Ž":142,"‘":145,"’":146,"“":147,"”":148,"•":149,"–":150,"—":151,"˜":152,"™":153,"š":154,"›":155,"œ":156,"ž":158,"Ÿ":159};
  const SUB = {"→":"->","←":"<-","≤":"<=","≥":">=","✓":"OK","★":"*","ⓘ":"i","✎":""," ":" "," ":" ","‑":"-","≈":"~","×":"×","…":"…","Δ":"D","°":"°"};
  function enc(s){ let o=""; for(const ch of String(s??"")){ let c=ch; if(c.charCodeAt(0)>255 && !(c in CP) && SUB[c]!=null) c=SUB[c]; for(const k of c){ const n=k.charCodeAt(0); if(n<256) o+=k; else if(CP[k]) o+=String.fromCharCode(CP[k]); else o+="?"; } } return o.replace(/\\/g,"\\\\").replace(/\(/g,"\\(").replace(/\)/g,"\\)"); }
  let ctx=null;
  function width(s,size,bold){ if(!ctx){ ctx=document.createElement("canvas").getContext("2d"); } ctx.font=(bold?"bold ":"")+"100px Helvetica, Arial, sans-serif"; return ctx.measureText(String(s)).width/100*size*1.02; }
  function hex(c){ const m=/^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(c||"#000000"); return m?[1,2,3].map(i=>(parseInt(m[i],16)/255).toFixed(3)).join(" "):"0 0 0"; }
  class Doc{
    constructor(opt={}){ this.W=opt.landscape?842:595; this.H=opt.landscape?595:842; this.M=opt.margin||36; this.pages=[]; this.addPage(); }
    addPage(){ this.cur=[]; this.pages.push(this.cur); this.y=this.M; return this; }
    text(x,y,s,o={}){ const sz=o.size||10; this.cur.push(`BT /${o.bold?"F2":"F1"} ${sz} Tf ${hex(o.color)} rg ${x.toFixed(2)} ${(this.H-y-sz*0.8).toFixed(2)} Td (${enc(s)}) Tj ET`); }
    rect(x,y,w,h,o={}){ const c=[]; if(o.fill) c.push(hex(o.fill)+" rg"); if(o.stroke) c.push(hex(o.stroke)+" RG "+(o.lw||0.6)+" w"); c.push(`${x.toFixed(2)} ${(this.H-y-h).toFixed(2)} ${w.toFixed(2)} ${h.toFixed(2)} re ${o.fill&&o.stroke?"B":o.fill?"f":"S"}`); this.cur.push(c.join(" ")); }
    line(x1,y1,x2,y2,o={}){ this.cur.push(`${hex(o.color||"#C8CDD4")} RG ${o.lw||0.6} w ${x1.toFixed(2)} ${(this.H-y1).toFixed(2)} m ${x2.toFixed(2)} ${(this.H-y2).toFixed(2)} l S`); }
    wrap(s,size,maxw,bold){ const out=[]; for(const para of String(s??"").split("\n")){ let line=""; for(const w of para.split(/\s+/)){ if(!w) continue; const t=line?line+" "+w:w; if(width(t,size,bold)<=maxw||!line) line=t; else { out.push(line); line=w; } } out.push(line); } return out; }
    need(h){ if(this.y+h>this.H-this.M) { this.addPage(); return true; } return false; }
    /* paragraphe avec retour à la ligne et saut de page automatique */
    para(s,o={}){ const sz=o.size||10, lh=sz*(o.lh||1.3), x=o.x??this.M, w=o.w??(this.W-this.M-x); for(const l of this.wrap(s,sz,w,o.bold)){ this.need(lh); this.text(x,this.y,l,o); this.y+=lh; } this.y+=o.after??2; }
    out(){
      const objs=[]; const add=s=>{ objs.push(s); return objs.length; };
      add("<< /Type /Catalog /Pages 2 0 R >>"); add("PAGES");
      add("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>");
      add("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>");
      const kids=[];
      for(const p of this.pages){ const st=p.join("\n"); const c=add(`<< /Length ${st.length} >>\nstream\n${st}\nendstream`); kids.push(add(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${this.W} ${this.H}] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ${c} 0 R >>`)); }
      objs[1]=`<< /Type /Pages /Kids [${kids.map(k=>k+" 0 R").join(" ")}] /Count ${kids.length} >>`;
      let s="%PDF-1.4\n%\xE2\xE3\xCF\xD3\n"; const off=[];
      objs.forEach((o,i)=>{ off.push(s.length); s+=`${i+1} 0 obj\n${o}\nendobj\n`; });
      const x=s.length; s+=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`+off.map(o=>String(o).padStart(10,"0")+" 00000 n \n").join("")+`trailer\n<< /Size ${objs.length+1} /Root 1 0 R >>\nstartxref\n${x}\n%%EOF`;
      const b=new Uint8Array(s.length); for(let i=0;i<s.length;i++) b[i]=s.charCodeAt(i)&255; return new Blob([b],{type:"application/pdf"});
    }
  }
  /* remise du fichier : feuille de partage (Imprimer, Enregistrer dans Fichiers…) sinon téléchargement */
  async function deliver(blob,name){

    const u=URL.createObjectURL(blob), a=document.createElement("a"); a.href=u; a.download=name; a.rel="noopener"; document.body.appendChild(a); a.click(); a.remove();
    return "download";
  }
  return {Doc, deliver, width};
})();

/* ===== PARTAGE PAR LIEN : l'objet voyage dans l'adresse (#x/…), compressé quand l'appareil le permet ===== */
const Partage = (()=>{
  const toB64=u8=>{ let s=""; for(let i=0;i<u8.length;i+=0x8000) s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000)); return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); };
  const fromB64=s=>{ const b=atob(s.replace(/-/g,"+").replace(/_/g,"/")); const u=new Uint8Array(b.length); for(let i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u; };
  async function pipe(u8,T){ const st=new Blob([u8]).stream().pipeThrough(T); return new Uint8Array(await new Response(st).arrayBuffer()); }
  async function enc(obj){
    const raw=new TextEncoder().encode(JSON.stringify(obj));
    try{ if(window.CompressionStream) return "z"+toB64(await pipe(raw,new CompressionStream("deflate-raw"))); }catch(e){}
    return "p"+toB64(raw);
  }
  async function dec(code){
    const k=code[0], u=fromB64(code.slice(1));
    const raw = k==="z" ? await pipe(u,new DecompressionStream("deflate-raw")) : u;
    return JSON.parse(new TextDecoder().decode(raw));
  }
  async function envoyer(obj,titre,texte,openSheet,esc){
    const url=location.origin+location.pathname+"#x/"+await enc(obj);
    try{ if(navigator.share){ await navigator.share({title:titre,text:texte,url}); return; } }catch(e){ if(e&&e.name==="AbortError") return; }
    let ok=false; try{ await navigator.clipboard.writeText(url); ok=true; }catch(e){}
    openSheet(`<div class="shh"><b>${esc(titre)}</b><button class="ib" data-close type="button">×</button></div><p class="msg">${ok?"Lien copié. ":""}Colle ce lien dans un message : il ouvre directement la même chose sur le téléphone de la personne.</p><textarea class="srch" rows="5" readonly>${esc(url)}</textarea>`);
  }
  return {enc,dec,envoyer};
})();

  TY=typeOf(E);

  const blocs=[]; for(const s of S){ const last=blocs[blocs.length-1];
    const j={id:s.id,n:s.n,nom:s.n,sec:s.duree,duree:s.duree,de:s.de,but:shortTxt(s.de,90),co:s.consignes,consignes:s.consignes,exo:s.exo};
    if(last&&last.et===s.phase){ last.jeux.push(j); last.min+=s.duree/60; } else blocs.push({etape:s.phase,et:s.phase,etapes:[s.phase],nom:phOf(s.phase).n,min:s.duree/60,jeux:[j]}); }
  blocs.forEach(b=>b.min=Math.round(b.min*100)/100);
  const tot=secTot(E)/60, d=Math.round(tot*2)/2;
  return {id:E.id,type:typeOf(E),nom:E.nom,titre:E.nom,duree:d,dureeTotale:d,situations:S,logique:E.resume||"",notes:E.notes?[].concat(E.notes):[],blocs,jeux:blocs.flatMap(b=>b.jeux.map(j=>({...j,etape:b.etape}))),src:E.src||(isMod(E)?E.id:null),lien:"warmup.html#/m/"+E.id};
}
function valider(E){

  if(HAS) GRUN.relais.rendre({routine:exportRoutine(E),titre:E.nom,nom:E.nom,id:E.id,duree:Math.round(minOf(E)*2)/2});
  const ret=rl.retour||(HAS?GRUN.href(rl.de||"seances"):"#/"); setRL(null); location.href=ret;
}
function scoreRL(E){ let s=0; const m=minOf(E);
  if(RL.duree) s-=Math.abs(m-RL.duree)*0.8;
  if(RL.fam==="cooldown"){ const Q=E.quand||[], t=norm(E.nom+" "+(E.resume||"")); const K=norm(RL.kw).split(/\s+/).filter(Boolean); s+=K.filter(k=>Q.includes(k)).length*5+K.filter(k=>t.includes(k)).length*1.5; }
  else if((E.quand||[]).some(q=>(RL.quand||[]).includes(q))) s+=4;
  if(RL.lieu&&lieuOf(E).includes(RL.lieu)) s+=2;
  if(!RL.mat||!RL.mat.length||matOf(E).every(k=>RL.mat.includes(k)||(k==="balles"&&RL.mat.includes("rb"))||!MATN[k]||KITK.includes(k))) s+=2;
  if(favSet().has(E.id)) s+=1.5; if(!isMod(E)) s+=0.5; if(RL.rid===E.id) s+=50;
  return s; }

function keepLF(){ if(!rlValide()){ ST.filt=LF; save(); } }
function passe(E){
  if(typeOf(E)!==(LF.type||"warmup")) return false;
  if(LF.tr&&trancheOf(minOf(E))!==LF.tr) return false;
  if(LF.lieu&&!lieuOf(E).includes(LF.lieu)) return false;
  const M=matOf(E);
  if(LF.mat==="none") return !M.length;
  if(LF.mat==="kit") return M.every(k=>KITK.includes(k));
  if(Array.isArray(LF.mat)) return M.every(k=>LF.mat.includes(k));
  return true;
}

const grid=(L,fv)=>`<div class="grid">${L.map(E=>cardHtml(E,fv)).join("")}</div>`;

function bindFiltres(){

}

    try{ const db=await new Promise((ok,ko)=>{ const q=indexedDB.open("banque_videos",1); q.onupgradeneeded=()=>q.result.createObjectStore("v"); q.onsuccess=()=>ok(q.result); q.onerror=()=>ko(); });
      const blob=await new Promise(ok=>{ const t=db.transaction("v").objectStore("v").get(id); t.onsuccess=()=>ok(t.result); t.onerror=()=>ok(null); }); if(blob) return {u:URL.createObjectURL(blob)}; }catch(e){} }

}

   ${de?`<p class="tde">${esc(de)}</p>`:""}
   <div id="tv" class="tvid"></div>
   <div class="nxt" id="nxt">${nx?`<small>Ensuite</small>${esc(nx.n)} · ${fmtS(nx.duree)}`:`<small>Ensuite</small>Fin de l'échauffement`}</div></div>`;
  $("#quit").onclick=()=>{ stopRun(); go("#/m/"+encodeURIComponent(R.id)); };
  $("#pp").onclick=()=>{ if(R.on) pause(); else start(); };
  $("#prv").onclick=()=>step(-1,true);
  $("#nxb").onclick=()=>step(1,true);
  const want=s.id; videoOf(s).then(v=>{ if(!RUN||RUN.E.situations[RUN.i].id!==want) return; const el=$("#tv"); if(el&&v) el.innerHTML=vidHtml(v); });
}
function start(){ const R=RUN; if(!R) return; try{ ACX ||= new (window.AudioContext||window.webkitAudioContext)(); ACX.resume&&ACX.resume(); }catch(e){}
  if(!R.t0){ R.t0=Date.now(); } if(R.left===R.E.situations[R.i].duree) bipDebut();
  R.on=true; R.endAt=Date.now()+R.left*1000; clearInterval(R.T); R.T=setInterval(tick,200); const b=$("#pp"); if(b) b.textContent="⏸ Pause"; }
function pause(){ const R=RUN; if(!R) return; R.on=false; clearInterval(R.T); R.left=Math.max(0,Math.ceil((R.endAt-Date.now())/1000)); const b=$("#pp"); if(b) b.textContent="▶ Reprendre"; }
function tick(){ const R=RUN; if(!R||!R.on) return; const l=Math.max(0,Math.ceil((R.endAt-Date.now())/1000));
  if(l!==R.left){ R.left=l; if(l<=3&&l>0) bipTick(); const c=$("#clk"); if(c){ c.textContent=mmss(l); c.classList.toggle("last",l<=5); }
    const S=R.E.situations, rest=S.slice(R.i).reduce((a,x)=>a+x.duree,0)-(S[R.i].duree-l); const r=$("#rest"); if(r) r.textContent="reste "+mmss(rest);
    const nx=$("#nxt"); if(nx&&S[R.i+1]){ nx.classList.toggle("soon",l<=5); if(l<=5) nx.innerHTML=`<small>Dans ${l} s</small>${esc(S[R.i+1].n)}`; } }
  if(l<=0){ bipFin(); step(1,false); } }
function step(d,manual){ const R=RUN; if(!R) return; const S=R.E.situations, j=R.i+d;
  if(j<0) return;
  if(j>=S.length){ const t0=R.t0; clearInterval(R.T); finGo(R.E,R.id,t0,R.jid); return; }
  const wasOn=R.on||!manual; clearInterval(R.T); R.i=j; R.left=S[j].duree; R.on=false; drawGo(); scrollTo(0,0);
  if(wasOn&&R.t0){ setTimeout(()=>{ if(RUN===R&&!R.on) start(); },manual?0:400); } }
function finGo(E,id,t0,jid0){
  stopRun();
  const prevu=minOf(E), ecoule=t0?(Date.now()-t0)/60000:0, reel=Math.max(1,Math.round(ecoule>=prevu*0.4?ecoule:prevu));
  const RPEL=["Repos","Très très facile","Très facile","Facile","Modéré","Un peu dur","Dur","Dur +","Très dur","Très très dur","Maximal"];
  let rpe=null; const sel=new Set(jid0&&jget(jid0)?[jid0]:[]);
  const J=isJ()?[]:joueurs();
  const rl=rlValide();
  TY=typeOf(E);
  main.innerHTML=`<div class="fin"><h1>${FAM[TY].fin}</h1><p class="lead">${esc(E.nom)} · ${E.situations.length} situations · ${reel} min</p>
   <div class="card" id="fb"><b>Ton retour en 10 secondes</b><p class="msg" style="margin:4px 0 8px">C'était dur comment ? (0 = repos, 10 = maximal)</p>
    <div class="rpe">${RPEL.map((l,i)=>`<button type="button" class="tg" data-rpe="${i}" aria-pressed="false" title="${l}">${i}</button>`).join("")}</div><p class="msg" id="rpel">Touche une note.</p>
    ${J.length?`<p class="msg" style="margin-bottom:4px">Pour qui ? (le retour part dans son dossier)</p><div class="chips">${J.map(j=>`<button type="button" class="tg sm" data-wj="${esc(j.id)}" aria-pressed="${sel.has(j.id)}">${esc(j.nom)}</button>`).join("")}</div>`:""}
    <div class="tools" style="margin-top:12px"><button class="go acc" id="fbok" type="button" disabled>Valider</button><button class="ib" id="fbno" type="button">Passer</button></div></div>
   <div id="after" hidden><div class="tools" style="justify-content:center;margin-top:18px">${rl?`<a class="go big acc" href="${esc(RL.retour||"seances.html")}" id="tos">Revenir à ${esc(DE_N[RL.de]||"la séance")}</a>`:""}<a class="go big${rl?"":" acc"}" href="#/">Bibliothèque</a><a class="ib" href="#/go/${encodeURIComponent(id)}">Relancer</a></div></div></div>`;
  $$("[data-rpe]").forEach(b=>b.onclick=()=>{ rpe=+b.dataset.rpe; $$("[data-rpe]").forEach(x=>x.setAttribute("aria-pressed",x===b)); $("#rpel").textContent=rpe+" · "+RPEL[rpe]; $("#fbok").disabled=false; });
  $$("[data-wj]").forEach(b=>b.onclick=()=>{ const k=b.dataset.wj; sel.has(k)?sel.delete(k):sel.add(k); b.setAttribute("aria-pressed",sel.has(k)); });
  const after=()=>{ $("#fb").hidden=true; $("#after").hidden=false; };
  $("#fbok").onclick=()=>{ const who=isJ()?[meJid()].filter(x=>x&&jget(x)):[...sel];
    for(const w of (who.length?who:["invite"])) ST.hist.push({id:uid(),who:w,date:todayIso(),duree:reel,ref:id,titre:E.nom,rpe,g:[]});
    if(ST.hist.length>2000) ST.hist=ST.hist.slice(-2000); saveNow();
    if(HAS) for(const w of who) GRUN.journal.addRetour({jid:w,date:todayIso(),type:TY==="cooldown"?"autre":"warmup",ref:id,titre:(TY==="cooldown"?"Retour au calme · ":"")+E.nom,duree:reel,rpe,fait:true});
    toast(who.length?"Retour enregistré dans "+(who.length>1?"leurs dossiers":"son dossier"):"Retour noté"); after(); };
  $("#fbno").onclick=after;
  $("#tos")&&($("#tos").onclick=()=>setRL(null));
}

/* ---------- JOUEUR (vue coach) ---------- */
function showJoueur(jid){
  const j=jget(jid); if(!j){ main.innerHTML=`<div class="empty">Joueur introuvable.</div>`; return; }
  if(isJ()&&jid!==meJid()){ go("#/"); return; }
  const fv=new Set(j.favWarmup||[]), F=[...MODL,...mine()].filter(E=>fv.has(E.id)), M=mine().filter(r=>(r.jids||[]).includes(jid));
  const ret=HAS?GRUN.journal.retours(jid).filter(x=>x.type==="warmup"):[];
  main.innerHTML=`<div class="crumb"><a href="#/">Bibliothèque</a> › Joueur</div><h1>${esc(j.nom)}</h1>
   <p class="lead">${ageOf(j)!=null?ageOf(j)+" ans · ":""}${j.sexe==="F"?"fille":"garçon"}${HAS&&!isJ()?` · <a href="${GRUN.href("joueurs","#/j/"+jid)}">dossier complet</a>`:""}</p>
   <section class="sec"><h2>♥ Ses favoris <small>${F.length}</small></h2>${F.length?grid(F,fv):`<div class="empty">Aucun favori : sur une fiche, touche « Pour un joueur… ».</div>`}</section>
   ${M.length?`<section class="sec"><h2>Ses échauffements</h2>${grid(M,fv)}</section>`:""}
   <section class="sec"><h2>Ses derniers échauffements</h2>${ret.length?`<div class="card">${ret.slice(0,15).map(r=>`<div class="jrow"><span><b>${esc(r.titre||"Échauffement")}</b> <span class="msg">${frD(r.date)}</span></span><span class="msg">${r.duree||"?"} min · dureté ${r.rpe!=null?r.rpe+"/10":"–"}</span></div>`).join("")}</div>`:`<div class="empty">Aucun retour pour l'instant.</div>`}</section>`;
}

/* ---------- PDF ---------- */
async function pdfE(E){
  const btn=$("#pdf"); if(btn) btn.textContent="Préparation…";
  TY=typeOf(E);
  try{ const d=new MiniPDF.Doc(), M=d.M, W=d.W-2*M;
    d.para(E.nom,{size:20,bold:true,after:3});
    d.para(`${durLab(E)} · ${E.situations.length} situations · ${lieuOf(E).map(l=>LIEU[l]||l).join(", ")} · ${matOf(E).length?matOf(E).map(matN).join(", "):"sans matériel"}`,{size:10,color:"#5D6675",after:4});
    if((E.quand||[]).length) d.para(E.quand.map(q=>quandN(q)).join(" · "),{size:10,bold:true,color:"#C2410C",after:4});
    if(E.resume) d.para(E.resume,{size:11,after:10});
    E.situations.forEach((s,i)=>{ d.need(50); const c=phOf(s.phase).c; d.rect(M,d.y,W,18,{fill:c}); d.text(M+8,d.y+4,`${i+1}. ${s.n}`,{size:11,bold:true,color:"#FFFFFF"}); const r=fmtS(s.duree)+" · "+phOf(s.phase).n; d.text(M+W-8-MiniPDF.width(r,10,true),d.y+4.5,r,{size:10,bold:true,color:"#FFFFFF"}); d.y+=23;
      if(s.de) d.para(s.de,{size:10,after:2}); (s.consignes||[]).forEach(x=>d.para("• "+x,{size:10,x:M+8,after:0})); if(s.series) d.para(s.series,{size:9.5,bold:true,after:0}); d.y+=8; });
    const blk=(t,L)=>{ if(!L||!L.length) return; d.need(30); d.para(t,{size:11,bold:true,after:2}); L.forEach(x=>d.para("• "+x,{size:9.5,x:M+8,after:0})); d.y+=6; };
    blk("Objectifs",E.objectifs); blk("Avantages",E.avantages); blk("Inconvénients",E.inconvenients);
    if(E.ages&&E.ages.conseille) blk("Âges",["Conseillé de "+E.ages.conseille[0]+" à "+E.ages.conseille[1]+" ans"].concat(E.ages.variante_11_13?["Variante 11-13 ans : "+E.ages.variante_11_13]:[]));
    if(E.intensite_fin) blk("Intensité de fin",[E.intensite_fin]); if(E.principes) blk("Principes",[E.principes]); if(E.notes) blk("Notes",lines(E.notes));
    const res=await MiniPDF.deliver(d.out(),`${TY==="cooldown"?"Retour au calme":"Echauffement"} ${E.nom.replace(/[^\w\- ]+/g,"")} ${todayIso()}.pdf`); if(btn) btn.textContent=res==="download"?"PDF téléchargé":"PDF";
  }catch(e){ console.warn(e); if(btn) btn.textContent="Erreur PDF"; }
  setTimeout(()=>{ const x=$("#pdf"); if(x) x.textContent="PDF"; },2500);
}

/* ---------- ENVOYER AU JOUEUR : l'échauffement voyage dans un lien ---------- */
async function envoyer(E){
  const p=isMod(E)?{v:3,m:E.id}:{v:3,e:{...clone(E),jids:undefined,gid:undefined,cree:undefined}};
  const msg=`Ton ${FAM[typeOf(E)].un} « ${E.nom} » (${durLab(E)}) : ouvre ce lien, puis « Lancer »`;
  if(typeof Partage!=="undefined"){ await Partage.envoyer(p,"Échauffement",msg,openSheet,esc); return; }
}
async function recevoir(code){
  try{ const p=await Partage.dec(code);
    if(p.v===3&&p.m){ if(MOD[p.m]){ location.replace("#/m/"+encodeURIComponent(p.m)); return; } throw new Error("modèle absent"); }
    let E;
    if(p.v===3&&p.e){ E={...p.e,v:3}; }
    else if(Array.isArray(p.b)){ /* ancien lien (générateur) */ const tr=p.tr||10; const S=[];
      p.b.forEach(([et,k,min,sl,ets])=>{ const g=(sl||[]).filter(x=>x&&x[1]); const n=g.length||1, sec=Math.max(15,Math.round(((+min||1)*60-(n-1)*tr)/n));
        g.forEach(([t,id])=>{ const e=BQ&&BQ.byId[id]; S.push({id:"S-"+uid(),n:e?e.n:"Jeu d'échauffement",duree:sec,phase:et==="JC"?((ets||[])[0]||"MR"):(PH[et]?et:"MR"),de:e?e.de||"":"",consignes:e?coArr(e.co):[],mat:[],exo:id}); }); });
      E={v:3,nom:p.nom||"Échauffement reçu",resume:p.lo||"",situations:S}; }
    else throw new Error("format");
    const ex=ST.routines.find(r=>r.id===E.id&&r.recu); E.id=ex?ex.id:(E.id&&!getE(E.id)?E.id:"R-"+uid()); E.recu=p.nm||true; E.jids=isJ()&&meJid()?[meJid()]:[]; E.date=todayIso(); fixMine(E);
    ST.routines=ST.routines.filter(r=>r.id!==E.id); ST.routines.push(E); saveNow(); location.replace("#/m/"+encodeURIComponent(E.id));
  }catch(e){ main.innerHTML=`<div class="empty">Ce lien d'échauffement est abîmé ou incomplet. Demande à ton coach de te le renvoyer.</div>`; }
}

/* ---------- ROUTAGE ----------
   #/ bibliothèque · #/m/<id> fiche · #/edit/<id> · #/go/<id>[?j=<jid>] mode terrain · #/nouveau (relais) · #/creer · #/kit · #/joueur/<jid> · #/x/<code>
   anciennes adresses : #/r/<id> et #r/<id> → fiche ; #/guide/<id> et #g/<id> → mode terrain ; #/choix, #/m, #/groupe/…, #j, #c → bibliothèque */
function route(){
  if(RUN&&!/^#\/go\//.test(location.hash)) stopRun();
  SHEET_AFTER=null; closeSheet(); initRL();
  const raw=location.hash.replace(/^#\/?/,""), [path,qs]=raw.split("?"), q=new URLSearchParams(qs||"");
  const [a,b]=path.split("/").map(x=>{ try{ return decodeURIComponent(x); }catch(e){ return x; } });
  document.body.classList.toggle("terrain",a==="go");
  if(a==="x"&&b){ recevoir(b); return; }
  if(a==="r"&&b){ location.replace(getE(b)?"#/m/"+encodeURIComponent(b):"#/"); return; }
  if((a==="guide"||a==="g")&&b){ location.replace(getE(b)?"#/go/"+encodeURIComponent(b):"#/"); return; }
  if(a==="nouveau"){ location.replace("#/"); return; }
  if(a==="creer"){ newMine(); return; }
  if(a==="m"&&b) showFiche(b);
  else if(a==="edit"&&b) showEdit(b);
  else if(a==="go"&&b) showGo(b,q);
  else if(a==="kit") showKit();
  else if(a==="joueur"&&b) showJoueur(b);
  else if(a){ location.replace("#/"); return; }
  else showLib();
  relaisBar();
  if(a!=="go") scrollTo(0,0);
}
addEventListener("hashchange",route);
async function boot(){
  try{ const r=await fetch("data-warmup.json"); DATA=r.ok?await r.json():{}; }catch(e){ DATA={}; }
  MODL=(DATA&&Array.isArray(DATA.modeles)?DATA.modeles:[]).filter(m=>m&&m.id&&Array.isArray(m.situations)); MOD=Object.fromEntries(MODL.map(m=>[m.id,m]));
  if(HAS){ try{ BQ=await GRUN.banque.load(); }catch(e){ console.warn("banque",e); BQ=null; } }
  migrerAnciennes();
  if(HAS){ GRUN.nav("create"); GRUN.on("grun:banque",()=>{ BQ=GRUN.banque.cache()||BQ; }); GRUN.on("grun:joueurs",()=>{ if(/^#\/?$|^#\/joueur/.test(location.hash)) route(); }); }
  route();
}
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"&&RUN&&RUN.on) tick(); });
/* outils de test et d'intégration */
window.WU={exportRoutine,getE,modeles:()=>MODL,mine,ST:()=>ST,minOf};
boot();
