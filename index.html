<!doctype html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="GRÜN"><meta name="theme-color" content="#0B3B36">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png">
<style>/* GRÜN — styles communs injectés dans chaque module (barre des pôles en bas, éléments partagés).
   Les modules gardent leurs jetons (--bg, --panel, --ink, --mute, --line, --soft) au style Veille. */
:root{--grun:#0F766E;--grun-ink:#0B3B36;--nav-h:62px}
body.grun-has-nav{padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px))}
#grun-nav{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:space-around;align-items:stretch;
  background:var(--panel,#fff);border-top:1px solid var(--line,#D9DDE3);padding-bottom:env(safe-area-inset-bottom,0px);
  box-shadow:0 -4px 18px rgba(0,0,0,.05)}
#grun-nav a{flex:1;max-width:140px;min-height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  text-decoration:none;color:var(--mute,#5D6675);font:600 11.5px/1.1 var(--ui,system-ui,sans-serif);letter-spacing:.01em}
#grun-nav svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#grun-nav a.on{color:var(--ink,#16202E)}
#grun-nav a.on svg{stroke:var(--grun)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) #grun-nav{box-shadow:none}}
@media print{#grun-nav{display:none}body.grun-has-nav{padding-bottom:0}}
/* fil « poupée russe » : bandeau de retour vers le module appelant */
.grun-relais{position:sticky;top:0;z-index:40;display:flex;gap:10px;align-items:center;justify-content:space-between;
  background:var(--grun);color:#fff;padding:8px 16px;font:600 14px/1.3 var(--ui,system-ui,sans-serif)}
.grun-relais a,.grun-relais button{color:#fff;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);border-radius:8px;
  min-height:36px;padding:0 12px;display:inline-flex;align-items:center;text-decoration:none;font:inherit;white-space:nowrap}
.grun-mod #back{visibility:visible!important}
</style>
<script src="grun.js?v=1"></script>
<meta name="grun-module" content="accueil"></head><body><title>GRÜN</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* GRÜN · accueil + Individualisation. Style de la Veille : barre fixe (retour, marque, recherche, réglages), cartes, listes, sections dépliables.
   Tailles en rem : la taille du texte des réglages agit sur html{font-size}. */
:root{
  --bg:#F4F5F7; --panel:#FFFFFF; --ink:#16202E; --mute:#5D6675; --line:#D9DDE3; --soft:#ECEFF3; --mark:#FFE58A;
  --ind:#0F766E; --create:#C2410C; --res:#1D4ED8; --tests:#6D3FC0;
  --pp:#C2410C; --ge:#1D4ED8; --de:#0F766E;
  --ok:#15803D; --warn:#B45309; --bad:#B91C1C; --low:#475569;
  --n1:#B91C1C; --n2:#B45309; --n3:#15803D; --n4:#6D3FC0;
  --acc:var(--ind);
  --ui:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --read:"Source Serif 4",Georgia,"Times New Roman",serif;
  --z:1;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10141B; --panel:#181E28; --ink:#E6EAF0; --mute:#9AA4B3; --line:#2B3442; --soft:#212938; --mark:#6B5A12;
  --ind:#2DD4BF; --create:#F08A4B; --res:#86A8FF; --tests:#B49BF0;
  --pp:#F08A4B; --ge:#86A8FF; --de:#2DD4BF;
  --ok:#4ADE80; --warn:#FBBF24; --bad:#F87171; --low:#94A3B8;
  --n1:#F87171; --n2:#FBBF24; --n3:#4ADE80; --n4:#B49BF0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10141B; --panel:#181E28; --ink:#E6EAF0; --mute:#9AA4B3; --line:#2B3442; --soft:#212938; --mark:#6B5A12;
  --ind:#2DD4BF; --create:#F08A4B; --res:#86A8FF; --tests:#B49BF0;
  --pp:#F08A4B; --ge:#86A8FF; --de:#2DD4BF;
  --ok:#4ADE80; --warn:#FBBF24; --bad:#F87171; --low:#94A3B8;
  --n1:#F87171; --n2:#FBBF24; --n3:#4ADE80; --n4:#B49BF0; color-scheme:dark}
html{font-size:calc(15px * var(--z))}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:1rem;line-height:1.45;margin:0;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
a{color:inherit}
button,input,select,textarea{font:inherit;color:var(--ink)}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
/* barre du haut */
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.topin{max-width:1100px;margin:0 auto;padding:8px 16px;display:flex;gap:8px;align-items:center}
.ib{min-width:40px;min-height:40px;border:1px solid var(--line);background:var(--panel);border-radius:9px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:600;padding:0 12px;white-space:nowrap;text-decoration:none;font-size:.95rem}
.ib svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ib.sm{min-height:34px;min-width:34px;padding:0 10px;font-size:.88rem;border-radius:8px}
.ib.dang{color:var(--bad)}
.ib[aria-pressed=true]{border-color:var(--acc);color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.brand{font-family:var(--display);font-weight:700;font-size:1.45rem;letter-spacing:.06em;white-space:nowrap;text-decoration:none;color:var(--ink)}
.brand i{font-style:normal;color:var(--ind)}
.sbox{flex:1;min-width:0;position:relative}
.sbox input{width:100%;min-height:40px;border:1px solid var(--line);border-radius:9px;background:var(--panel);padding:0 12px 0 34px;font-size:1rem}
.sbox svg{position:absolute;left:10px;top:11px;width:18px;height:18px;stroke:var(--mute);fill:none}
.sp{flex:1}
main{max-width:1100px;margin:0 auto;padding:16px 16px 40px}
h1{font-family:var(--display);font-weight:700;font-size:2rem;line-height:1.1;margin:0;text-wrap:balance}
h1 small{display:block;font-family:var(--ui);font-weight:500;font-size:.95rem;color:var(--mute);margin-top:4px;letter-spacing:0}
.lead{color:var(--mute);margin:4px 0 0}
.crumb{font-size:.87rem;color:var(--mute);display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;margin-bottom:4px}
.crumb a{text-decoration:none;color:var(--acc);font-weight:600}
.sec{margin-top:22px}
.sec>h2,.h2{font-family:var(--display);font-size:1.4rem;font-weight:700;margin:0 0 8px;display:flex;gap:8px;align-items:baseline;justify-content:space-between}
.h2 a,.sec>h2 a{font-family:var(--ui);font-size:.88rem;font-weight:600;color:var(--acc);text-decoration:none;white-space:nowrap}
.cols{display:grid;grid-template-columns:minmax(0,1fr);gap:0 18px}
@media (min-width:860px){.cols{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.cols>.sec:first-child,.cols>.sec:nth-child(2){margin-top:22px}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.card+.card{margin-top:10px}
.list{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.li{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:10px;padding:10px 14px;text-decoration:none;border-top:1px solid var(--line);align-items:center;min-height:48px}
.li:first-child{border-top:none}
.li .code{font-variant-numeric:tabular-nums;color:var(--mute);font-size:.87rem;line-height:1.2}
.li .tt{font-size:1rem;min-width:0;overflow-wrap:anywhere}
.li .tt small{display:block;color:var(--mute);font-size:.84rem;margin-top:1px}
.li .end{display:flex;gap:6px;align-items:center;color:var(--mute);font-size:.84rem}
.li.n2c{grid-template-columns:minmax(0,1fr) auto}
a.li:active,a.card:active{background:var(--soft)}
.empty{color:var(--mute);padding:14px;background:var(--panel);border:1px dashed var(--line);border-radius:12px}
.msg{font-size:.9rem;color:var(--mute)}
.msg.ok{color:var(--ok)}
.tools{display:flex;flex-wrap:wrap;gap:8px}
.go{min-height:40px;border-radius:9px;border:none;background:var(--ink);color:var(--bg);font-weight:600;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;white-space:nowrap}
.go.acc{background:var(--acc);color:#fff}
:root[data-theme="dark"] .go.acc{color:#0B1117}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .go.acc{color:#0B1117}}
.load{padding:40px 0;color:var(--mute)}
/* formulaires */
.form{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.f{display:flex;flex-direction:column;gap:3px;min-width:0}
.f.w{flex:1;min-width:180px}
.f.full{flex-basis:100%}
.f>label,.lab{font-size:.74rem;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--mute)}
.inp,.f select,.f input:not([type=range]):not([type=checkbox]),.f textarea{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:0 10px;max-width:100%;width:100%;font-size:1rem}
.f input[type=date]{min-width:150px}
.f input[type=number]{width:96px}
.f textarea{padding:8px 10px;min-height:76px;resize:vertical;font-size:.98rem}
.chk{display:flex;gap:8px;align-items:center;min-height:40px}
.chk input{width:20px;height:20px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.tg{min-height:34px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:0 12px;font-size:.9rem;font-weight:600;color:var(--mute)}
.tg[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#fff}
:root[data-theme="dark"] .tg[aria-pressed=true]{color:#0B1117}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tg[aria-pressed=true]{color:#0B1117}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--panel)}
.seg button{border:none;background:none;min-height:38px;padding:0 14px;font-weight:600;color:var(--mute)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.rng{display:grid;grid-template-columns:minmax(0,1fr);gap:2px}
.rng .rh{display:flex;justify-content:space-between;gap:8px;font-weight:600;font-size:.95rem}
.rng .rh output{font-variant-numeric:tabular-nums;color:var(--acc)}
.rng input{width:100%;accent-color:var(--acc);min-height:30px}
.rng .rl{display:flex;justify-content:space-between;font-size:.78rem;color:var(--mute)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
@media (min-width:600px){.grid2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
/* accueil */
.hero{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 16px;align-items:flex-end}
.word{font-family:var(--display);font-weight:700;font-size:3rem;line-height:.95;letter-spacing:.08em;margin:0}
.word i{font-style:normal;color:var(--ind)}
.poles{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
@media (min-width:640px){.poles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.pole{display:flex;flex-direction:column;gap:6px;text-decoration:none;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;border-top:5px solid var(--pc);min-height:128px}
.pole b{font-family:var(--display);font-size:1.75rem;color:var(--pc);line-height:1.05}
.pole span{color:var(--mute);font-size:.95rem}
.pole small{color:var(--mute);font-size:.84rem;margin-top:auto}
.day{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.day+.day{margin-top:8px}
.day>h3{margin:0;padding:8px 14px;font-size:.8rem;letter-spacing:.07em;text-transform:uppercase;color:var(--mute);background:var(--soft);display:flex;justify-content:space-between}
.day>h3.auj{color:var(--acc)}
.ev{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:10px;padding:9px 14px;border-top:1px solid var(--line);text-decoration:none;align-items:center}
.day>h3+.ev{border-top:none}
.ev .dot{width:10px;height:10px;border-radius:50%;background:var(--ec,var(--mute))}
.ev .tt small{display:block;color:var(--mute);font-size:.84rem}
.ev .end{font-size:.82rem;color:var(--mute);text-align:right}
.al{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;padding:10px 14px;border-top:1px solid var(--line);text-decoration:none}
.al:first-child{border-top:none}
.badge{display:inline-flex;align-items:center;min-height:22px;padding:0 8px;border-radius:999px;font-size:.76rem;font-weight:700;letter-spacing:.03em;white-space:nowrap;border:1px solid currentColor}
.b-haute{color:var(--bad)}.b-attention{color:var(--warn)}.b-info{color:var(--low)}.b-ok{color:var(--ok)}.b-basse{color:var(--low)}
/* cartes joueurs */
.pgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
@media (min-width:640px){.pgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1000px){.pgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.pc{display:flex;flex-direction:column;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-decoration:none;border-left:4px solid var(--ind)}
.pc .nm{font-family:var(--display);font-size:1.35rem;font-weight:700;line-height:1.1;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.pc .meta{color:var(--mute);font-size:.88rem}
.moys{display:flex;gap:6px;flex-wrap:wrap}
.mo{display:inline-flex;gap:5px;align-items:baseline;font-size:.85rem;border-radius:7px;background:var(--soft);padding:2px 8px}
.mo b{font-variant-numeric:tabular-nums;font-size:.98rem}
.mo.pp b{color:var(--pp)}.mo.ge b{color:var(--ge)}.mo.de b{color:var(--de)}
/* dossier */
.head{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-start}
.facts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.fact{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px;min-width:96px}
.fact .lab{display:block;font-size:.68rem}
.fact b{font-size:1.02rem;font-variant-numeric:tabular-nums}
.fact b small{font-weight:500;color:var(--mute);font-size:.82rem}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.dos{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;margin-top:18px;align-items:start}
@media (min-width:900px){.dos{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.dcol{display:flex;flex-direction:column;gap:10px;min-width:0}
details.sx{background:var(--panel);border:1px solid var(--line);border-radius:12px;border-left:4px solid var(--sc,var(--acc))}
details.sx>summary{list-style:none;cursor:pointer;display:flex;gap:10px;align-items:baseline;padding:12px 14px;min-height:48px}
details.sx>summary::-webkit-details-marker{display:none}
details.sx>summary::before{content:"+";width:1em;color:var(--sc,var(--acc));font-weight:700;font-size:1.1rem}
details.sx[open]>summary::before{content:"–"}
details.sx>summary b{font-family:var(--display);font-size:1.3rem;line-height:1.1}
details.sx>summary span{color:var(--mute);font-size:.86rem;margin-left:auto;text-align:right}
.sxb{padding:0 14px 14px;display:flex;flex-direction:column;gap:12px}
.sub{font-size:.76rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--mute);margin:4px 0 -4px}
.inner{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.inner .li{padding:8px 12px;min-height:44px}
.rads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.rad{text-align:center;min-width:0}
.rad svg{width:100%;height:auto;max-width:190px;display:block;margin:0 auto}
.rad .rt{font-weight:700;font-size:.86rem}
.rad .rv{font-variant-numeric:tabular-nums;font-size:1.25rem;font-weight:700}
.rad .rd{font-size:.8rem;color:var(--mute)}
.lv{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:22px;border-radius:6px;font-weight:700;font-size:.82rem;color:#fff;padding:0 5px;font-variant-numeric:tabular-nums}
.lv.n1{background:var(--n1)}.lv.n2{background:var(--n2)}.lv.n3{background:var(--n3)}.lv.n4{background:var(--n4)}
:root[data-theme="dark"] .lv{color:#0B1117}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .lv{color:#0B1117}}
.lc{font-size:.75rem;font-weight:700;border-radius:5px;padding:1px 5px;background:var(--soft)}
.lc.pp{color:var(--pp)}.lc.ge{color:var(--ge)}.lc.de{color:var(--de)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
table.cmp{border-collapse:collapse;width:100%;font-size:.9rem;min-width:520px}
.cmp th,.cmp td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:middle;white-space:nowrap}
.cmp th{background:var(--soft);font-weight:600;font-size:.78rem;letter-spacing:.05em;text-transform:uppercase;color:var(--mute)}
.cmp td.n{font-variant-numeric:tabular-nums;text-align:center}
.cmp tr:last-child td{border-bottom:none}
.chart svg{width:100%;height:auto;display:block}
.kpi{display:flex;flex-wrap:wrap;gap:8px}
.kpi>div{background:var(--soft);border-radius:10px;padding:6px 10px}
.kpi .lab{display:block;font-size:.68rem}
.kpi b{font-variant-numeric:tabular-nums;font-size:1.1rem}
.note{font-family:var(--read);font-size:.98rem;line-height:1.55;color:var(--ink)}
.res{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;text-decoration:none;display:block}
.res+.res{margin-top:8px}
.res .t{font-weight:600}
.res .w{color:var(--mute);font-size:.84rem}
.res .s{font-family:var(--read);font-size:.95rem;margin-top:3px}
mark{background:var(--mark);color:inherit;border-radius:2px}
.rgrp{margin-top:18px}
.rgrp>h2{font-family:var(--display);font-size:1.3rem;margin:0 0 8px;color:var(--rc,var(--ink));display:flex;justify-content:space-between;align-items:baseline}
.rgrp>h2 small{font-family:var(--ui);font-size:.84rem;color:var(--mute);font-weight:500}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h,62px) + 14px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;max-width:calc(100vw - 32px);box-shadow:0 6px 24px rgba(0,0,0,.2)}
/* mode joueur */
.big{display:flex;flex-direction:column;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;border-top:5px solid var(--bc,var(--ind));text-decoration:none}
.big .k{font-size:.76rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--bc,var(--ind))}
.big b{font-family:var(--display);font-size:1.6rem;line-height:1.1}
.big span{color:var(--mute)}
.bigs{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
@media (min-width:640px){.bigs{grid-template-columns:repeat(2,minmax(0,1fr))}}
.pin{display:flex;gap:8px;justify-content:center;margin:12px 0}
.pin input{width:56px;height:60px;text-align:center;font-size:1.6rem;font-weight:700;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
/* écran de lancement */
#splash{position:fixed;inset:0;z-index:100;background:#0B3B36;color:#F3F7F6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .28s ease}
#splash .w{font-family:var(--display);font-weight:700;font-size:4.6rem;letter-spacing:.14em;line-height:1;padding-left:.14em;animation:spIn .5s ease both}

<script>
/* ===== GRÜN · ACCUEIL + INDIVIDUALISATION =====
   Routes : #/ (accueil coach ou dossier du joueur en mode joueur) · #/recherche/<q> · #/pole/<id> · #/joueurs · #/j/<jid>[/<section>] · #/g/<gid> · #/reglages
   Tout passe par GRUN.* (joueurs, groupes, journal, banque, tests, relais, sauvegarde). Les données des modules (plans, séances, routines)
   sont lues sous leurs clés historiques, en tolérant les champs absents. */
"use strict";
(function () {
const G = window.GRUN;
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = G.esc, arr = x => Array.isArray(x) ? x : [];
const fold = s => String(s == null ? "" : s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const pad = n => String(n).padStart(2, "0");
const DAY = 864e5;
const P = s => { const [y, m, d] = String(s).slice(0, 10).split("-").map(Number); return Date.UTC(y, (m || 1) - 1, d || 1); };
const I = t => new Date(t).toISOString().slice(0, 10);
const add = (s, n) => I(P(s) + n * DAY);
const lundi = s => { const t = P(s); return I(t - ((new Date(t).getUTCDay() + 6) % 7) * DAY); };
const ecart = (a, b) => Math.round((P(a) - P(b)) / DAY);
const JS = ["dimanche", "lundi", "mardi", "mercredi", "jeudi", "vendredi", "samedi"], JC = ["dim.", "lun.", "mar.", "mer.", "jeu.", "ven.", "sam."];
const MOIS = ["janv.", "févr.", "mars", "avr.", "mai", "juin", "juil.", "août", "sept.", "oct.", "nov.", "déc."];
const dLong = s => { const d = new Date(P(s)); return JS[d.getUTCDay()] + " " + d.getUTCDate() + " " + MOIS[d.getUTCMonth()]; };
const dCourt = s => { const d = new Date(P(s)); return d.getUTCDate() + " " + MOIS[d.getUTCMonth()]; };
const dJour = s => { const d = new Date(P(s)); return JC[d.getUTCDay()] + " " + d.getUTCDate() + " " + MOIS[d.getUTCMonth()]; };
const nf = (v, d = 1) => v == null || isNaN(v) ? "–" : String(Math.round(v * 10 ** d) / 10 ** d).replace(".", ",");
const prenom = j => (j && j.nom || "").split(" ")[0];
const isoOk = s => /^\d{4}-\d{2}-\d{2}/.test(String(s || ""));
/* GRÜN = 4-18 ans : un âge calculé au-delà de 18 ans compte pour 18 ans (anciennes données adulte:true ignorées) */
const ageJ = (nai, ref) => { const a = G.ageCiv(nai, ref); return a == null ? null : Math.min(18, a); };
const matur = j => G.maturite(j);
const ageTxt = j => ageJ(j.naissance) != null ? ageJ(j.naissance) + " ans" : "";

/* ---------- référentiels ---------- */
const LN0 = {
  PP: ["Force du bas du corps", "Force du haut du corps", "Gainage et stabilité du tronc", "Puissance des jambes : sauts et pliométrie", "Puissance du haut du corps et rotation", "Vitesse et accélération", "Freinage, changements de direction et agilité", "Endurance aérobie", "Répétition d'efforts intenses", "Coordination, motricité fondamentale et rythme", "Équilibre et proprioception", "Mobilité et souplesse"],
  GE: ["Service à plat", "Service slicé", "Service lifté", "Coup droit lifté", "Coup droit à plat", "Coup droit slicé", "Revers lifté", "Revers à plat", "Revers slicé", "Volée de coup droit", "Volée de revers", "Smash", "Amortie et touché de balle"],
  DE: ["Position d'attention", "Allègement et reprise d'appuis", "Démarrage et premiers pas", "Déplacements latéraux", "Déplacements vers l'avant et vers l'arrière", "Pas d'ajustement et mise à distance", "Appuis de frappe", "Freinage et décélération", "Changement de direction et réaccélération", "Replacement", "Enchaînements et liaison des actions"]
};
const DOMS = ["PP", "GE", "DE"], DOMN = { PP: "Préparation physique", GE: "Geste", DE: "Déplacement" }, DOMC = { PP: "var(--pp)", GE: "var(--ge)", DE: "var(--de)" };
const KN = { PPI: "PP individuelle", PPC: "PP collective", TI: "Tennis individuel", TC: "Tennis collectif", PM: "Préparation mentale" };
const PHN = { G: "Préparation générale", S: "Préparation spécifique", P: "Pré-compétition", C: "Compétition", R: "Récupération", T: "Transition" };
const CLASSEMENTS = ["NC", "40", "30/5", "30/4", "30/3", "30/2", "30/1", "30", "15/5", "15/4", "15/3", "15/2", "15/1", "15", "5/6", "4/6", "3/6", "2/6", "1/6", "0", "-2/6", "-4/6", "-15", "-30", "Top 60", "Top 40"];
const ZONES = { dos: "Dos", genou: "Genou", talon: "Talon, cheville", epaule: "Épaule", poignet: "Poignet, coude", hanche: "Hanche", autre: "Autre" };
const zn = z => ZONES[z] || z || "";
const TYPN = { tournoi: "Tournoi", bilan: "Bilan", seance: "Séance", plan: "Séance du plan", repos: "Repos", autre: "Autre" };
const TYPC = { tournoi: "var(--bad)", bilan: "var(--tests)", seance: "var(--create)", plan: "var(--create)", repos: "var(--low)", autre: "var(--mute)" };
const RTYP = { seance: "Séance", warmup: "Warm-up", tennis: "Tennis", match: "Match", autre: "Autre" };
const APRES = { tennis: "entraînement tennis", pp: "séance de PP", match: "match", bilan: "bilan" };
const FF = [["sommeil", "Sommeil", "Très mal dormi", "Très bien dormi"], ["fatigue", "Énergie", "Épuisé", "Plein d'énergie"], ["courbatures", "Courbatures", "Très courbaturé", "Aucune"], ["stress", "Stress", "Très stressé", "Serein"], ["humeur", "Humeur", "Au plus bas", "Au top"]];
const RPEN = ["Repos", "Très très facile", "Très facile", "Facile", "Modéré", "Un peu dur", "Dur", "Très dur", "Très très dur", "Presque maximal", "Maximal"];
const POLEC = { ind: "var(--ind)", create: "var(--create)", res: "var(--res)", tests: "var(--tests)" };

/* ---------- données de l'accueil (index de recherche, barèmes, calendrier) ---------- */
let RD = { docs: [], tests: [], saisons: [], fams: [], lignes: LN0, gm: {}, s: {}, sens: {}, cal: [] }, TM = {};
const rdP = fetch("data-recherche.json").then(r => r.ok ? r.json() : null).catch(() => null).then(d => {
  if (d) RD = { ...RD, ...d, lignes: d.lignes && d.lignes.PP ? d.lignes : LN0 };
  RD.tests.forEach(t => TM[t.id] = t);
});
const LN = d => (RD.lignes && RD.lignes[d]) || LN0[d];
const ligneNom = l => { const m = /^(PP|GE|DE)(\d+)$/.exec(l || ""); return m ? (LN(m[1])[+m[2] - 1] || l) : l; };

/* ---------- données des modules (lecture tolérante) ---------- */
function PROG() { const s = G.load(G.K.prog, {}) || {}; return { plans: arr(s.plans), profils: s.profils || {} }; }
function CACHE() { return G.load(G.K.progCache, {}) || {}; }
function SEANCES() { const s = G.load(G.K.seances, {}) || {}; return arr(s.seances).filter(x => x && x.id); }
function ROUT() { const s = G.load(G.K.routines, {}) || {}; return { routines: arr(s.routines).filter(x => x && x.id), hist: arr(s.hist) }; }
const REG = () => ({ theme: "auto", fs: 100, nomCoach: "", code: "", ...(G.load(G.K.reglages, {}) || {}) });
/* profil d'utilisation : "coach" (ses joueurs et groupes) ou "autonome" (joueur sans coach : son seul dossier, jidMoi) — distinct du mode joueur prêté par un coach */
const auto = () => !G.isJoueur() && REG().profil === "autonome";
const moi = () => G.joueurs.get(REG().jidMoi || "");
const setReg = p => quiet(() => G.save(G.K.reglages, { ...REG(), ...p }));
const gidsDe = jid => G.groupes.de(jid).map(g => g.id);
const grpOk = gid => gid && G.groupes.get(gid);
function planJids(p) { const s = new Set([p.jid, ...arr(p.jids)].filter(Boolean)); if (grpOk(p.gid)) G.groupes.joueurs(p.gid).forEach(j => s.add(j.id)); return [...s]; }
function seanceJids(x) { const s = new Set([...arr(x.joueurs), ...arr(x.jids), x.jid].filter(Boolean)); const g = x.gid || x.groupe; if (grpOk(g)) G.groupes.joueurs(g).forEach(j => s.add(j.id)); return [...s]; }
function routJids(r) { const s = new Set([...arr(r.jids), r.jid].filter(Boolean)); if (grpOk(r.gid)) G.groupes.joueurs(r.gid).forEach(j => s.add(j.id)); return [...s]; }
const plansDe = jid => PROG().plans.filter(p => planJids(p).includes(jid));
const seancesDe = jid => SEANCES().filter(s => seanceJids(s).includes(jid));
const routinesDe = jid => ROUT().routines.filter(r => routJids(r).includes(jid));

/* semaines d'un plan : cache de Create my prog (thèmes) sinon semaine type brute */
function planSemaines(p) {
  const c = CACHE()[p.id];
  if (c && arr(c.W).length) return c.W.map(w => {
    const d1 = typeof w.d1 === "number" ? I(w.d1) : String(w.d1 || "").slice(0, 10);
    return { d1, ph: w.ph, mi: w.mi, ses: arr(w.ses).map(s => ({ date: add(d1, +s.j || 0), j: s.j, k: s.k, t: s.t || "", l: arr(s.l), key: s.key })) };
  }).filter(w => isoOk(w.d1));
  if (!isoOk(p.debut) || !isoOk(p.fin)) return [];
  const out = []; let m = lundi(p.debut), n = 0;
  while (m <= p.fin && n < 70) {
    const ses = arr(p.sem).map(s => ({ date: add(m, +s.j || 0), j: s.j, k: s.k, t: "", l: [] })).filter(s => s.date >= p.debut && s.date <= p.fin);
    out.push({ d1: m, ses, brut: true }); m = add(m, 7); n++;
  }
  return out;
}

/* tous les évènements datés d'un joueur entre a et b (inclus) */
function evJoueur(j, a, b) {
  const out = [], jid = j.id;
  for (const x of arr(j.agenda)) { if (!x || !isoOk(x.date)) continue; const fin = isoOk(x.fin) ? x.fin : x.date; if (x.date <= b && fin >= a) out.push({ date: x.date < a ? a : x.date, fin: fin !== x.date ? fin : "", type: x.type || "autre", titre: x.titre || TYPN[x.type] || "Évènement", src: "agenda", id: x.id, k: "ag|" + x.id }); }
  const S = SEANCES(), built = new Set();
  for (const s of S) {
    if (s.src && s.src.plan && s.src.key) built.add(s.src.plan + "|" + s.src.key);
    if (!isoOk(s.date) || s.date < a || s.date > b || !seanceJids(s).includes(jid)) continue;
    out.push({ date: s.date, type: "seance", titre: s.nom || s.theme || "Séance", sous: [KN[s.type], s.duree ? s.duree + " min" : ""].filter(Boolean).join(" · "), href: G.href("seances", "#/s/" + s.id), terrain: G.href("seances", "#/terrain/" + s.id), ref: s.id, fait: !!s.fait, duree: s.duree, gid: grpOk(s.gid) ? s.gid : null, k: "s|" + s.id });
  }
  for (const p of PROG().plans) {
    if (!planJids(p).includes(jid)) continue;
    if ((isoOk(p.fin) && p.fin < a) || (isoOk(p.debut) && p.debut > b)) continue;
    for (const w of planSemaines(p)) {
      if (add(w.d1, 6) < a || w.d1 > b) continue;
      for (const s of w.ses) {
        if (s.date < a || s.date > b || (s.key && built.has(p.id + "|" + s.key))) continue;
        out.push({ date: s.date, type: "plan", titre: s.t || KN[s.k] || "Séance du plan", sous: (s.t ? (KN[s.k] || "") + " · " : "") + (p.nom || "Plan"), kk: s.k, l: s.l, href: G.href("prog", "#p/" + p.id), plan: p.id, gid: grpOk(p.gid) ? p.gid : null, k: "p|" + p.id + "|" + s.date + "|" + (s.key || s.k) });
      }
    }
    for (const c of arr(p.compets)) if (c && isoOk(c.d1) && c.d1 <= b && (isoOk(c.d2) ? c.d2 : c.d1) >= a) out.push({ date: c.d1 < a ? a : c.d1, fin: c.d2 && c.d2 !== c.d1 ? c.d2 : "", type: "tournoi", titre: c.nom || "Tournoi", sous: p.nom || "", href: G.href("prog", "#p/" + p.id), k: "c|" + p.id + "|" + c.d1 + "|" + (c.nom || "") });
  }
  return out.sort((x, y) => x.date < y.date ? -1 : x.date > y.date ? 1 : (x.type === "tournoi" ? -1 : 1));
}

/* ---------- bilans des grilles ---------- */
/* un bilan vide (créé d'office par Grilles à la création du joueur, rien de saisi) ne compte pas */
const bilanRempli = b => ["PP", "GE", "DE"].some(d => arr((b.v || b.valeurs || {})[d]).some(x => x != null && x !== "")) || Object.keys(b.res || {}).some(k => b.res[k] && Object.keys(b.res[k]).length);
const bilans = j => arr(j.bilans).filter(b => b && b.date && bilanRempli(b)).slice().sort((a, b) => a.date < b.date ? 1 : -1);
const vOf = (b, d) => arr((b.v || b.valeurs || {})[d]);
const bAge = (j, b) => Math.min(18, +b.age || ageJ(j.naissance, b.date) || 12);
function mask(j, b, d) { const m = RD.gm && RD.gm[(j.sexe === "F" ? "F" : "G") + pad(bAge(j, b)) + "_" + d]; return LN(d).map((_, i) => m ? m[i] === "1" : true); }
function moy(j, b, d) { if (!b) return null; const mk = mask(j, b, d); const v = vOf(b, d).map((x, i) => x == null || x === "" || !mk[i] ? null : +x).filter(x => x != null && !isNaN(x)); return v.length ? Math.round(v.reduce((a, x) => a + x, 0) / v.length * 10) / 10 : null; }
const parseN = s => { if (s == null) return null; s = String(s).trim().replace(",", ".").replace(/\s/g, ""); if (s === "") return null; if (/^\d+:\d+(\.\d+)?$/.test(s)) { const [m, x] = s.split(":"); return +m * 60 + +x; } const v = parseFloat(s); return isNaN(v) ? null : v; };
function niveauTest(tid, sx, age, vals) {
  if (!vals || typeof vals !== "object") return null;
  const S = RD.s && RD.s[tid] && RD.s[tid][sx] && RD.s[tid][sx][age];
  if (S) { let lv = 4; for (const k in S) { const v = parseN(vals[k]); if (v == null) return null; const t = S[k]; const asc = t[0] < t[2] || (t[0] === t[2] && /grand/.test(RD.sens[tid] || "")); lv = Math.min(lv, asc ? (v >= t[2] ? 4 : v >= t[1] ? 3 : v >= t[0] ? 2 : 1) : (v <= t[2] ? 4 : v <= t[1] ? 3 : v <= t[0] ? 2 : 1)); } return lv; }
  const tp = G.tests.perso().find(t => t.id === tid); const t = tp && tp.seuils && tp.seuils[sx] && tp.seuils[sx][age];
  if (t && t.length === 3) { const v = parseN(Object.values(vals)[0]); if (v == null) return null; const asc = tp.sens !== "petit"; return asc ? (v >= t[2] ? 4 : v >= t[1] ? 3 : v >= t[0] ? 2 : 1) : (v <= t[2] ? 4 : v <= t[1] ? 3 : v <= t[0] ? 2 : 1); }
  return null;
}
const testNom = id => { const t = TM[id]; if (t) return t.n; const p = G.tests.perso().find(x => x.id === id); return p ? p.nom : id; };
const lvB = v => v == null ? "" : `<span class="lv n${Math.min(4, Math.max(1, Math.floor(v)))}">${nf(v)}</span>`;
function moysHTML(j, b) { return `<div class="moys">${DOMS.map(d => `<span class="mo ${d.toLowerCase()}">${d} <b>${b ? nf(moy(j, b, d)) : "–"}</b></span>`).join("")}</div>`; }

/* radar SVG d'un domaine (pointillés = bilan précédent ; cercle tireté = niveau 3) */
function radar(d, vals, mk, prev) {
  const n = LN(d).length, R = 76, c = 105, A = i => -Math.PI / 2 + i * 2 * Math.PI / n, Pt = (i, v) => [c + Math.cos(A(i)) * R * v / 4, c + Math.sin(A(i)) * R * v / 4].map(x => Math.round(x * 10) / 10);
  const poly = v => [...Array(n)].map((_, i) => Pt(i, Math.max(0, Math.min(4, +v[i] || 0))).join(",")).join(" ");
  let s = `<svg viewBox="0 0 210 210" role="img" aria-label="Radar ${DOMN[d]}" style="--dc:${DOMC[d]}">`;
  for (let k = 4; k >= 1; k--) s += `<polygon points="${poly(Array(n).fill(k))}" style="fill:none;stroke:var(--line)${k === 3 ? ";stroke:var(--n3);stroke-dasharray:3 3;opacity:.8" : ""}"/>`;
  for (let i = 0; i < n; i++) { const [x, y] = Pt(i, 4); s += `<line x1="${c}" y1="${c}" x2="${x}" y2="${y}" style="stroke:var(--line);stroke-width:.6"/>`; }
  if (prev && prev.some(v => v != null)) s += `<polygon points="${poly(prev.map((v, i) => mk[i] ? v : 0))}" style="fill:none;stroke:var(--mute);stroke-width:1.4;stroke-dasharray:4 3"/>`;
  if (vals.some(v => v != null)) s += `<polygon points="${poly(vals.map((v, i) => mk[i] ? v : 0))}" style="fill:var(--dc);fill-opacity:.2;stroke:var(--dc);stroke-width:2;stroke-linejoin:round"/>`;
  for (let i = 0; i < n; i++) { const [x, y] = Pt(i, 4.75); s += `<text x="${x}" y="${y + 4}" text-anchor="middle" font-size="11" font-weight="600" style="fill:currentColor;opacity:${mk[i] ? 1 : .3}">${i + 1}</text>`; }
  return s + "</svg>";
}
function radars(j, b, prev) {
  return `<div class="rads">${DOMS.map(d => {
    const mk = mask(j, b, d), v = LN(d).map((_, i) => { const x = vOf(b, d)[i]; return x == null || x === "" ? null : +x; });
    const pv = prev ? LN(d).map((_, i) => { const x = vOf(prev, d)[i]; return x == null || x === "" ? null : +x; }) : null;
    const m = moy(j, b, d), mp = prev ? moy(j, prev, d) : null, dl = m != null && mp != null ? m - mp : null;
    return `<div class="rad"><div class="rt" style="color:${DOMC[d]}">${DOMN[d]}</div>${radar(d, v, mk, pv)}<div class="rv">${nf(m)}</div>${dl != null ? `<div class="rd">${dl > 0 ? "+" : ""}${nf(dl)} depuis le ${G.frD(prev.date)}</div>` : ""}</div>`;
  }).join("")}</div>`;
}

/* ---------- forme, charge, alertes ---------- */
function formeScore(f) { const v = FF.map(x => +f[x[0]]).filter(x => x >= 1 && x <= 5); return v.length ? v.reduce((a, x) => a + x, 0) / v.length : null; }
function semaineBilan(t) { return arr(RD.cal).find(w => w.bilan && w.au >= t && ecart(w.du, t) <= 7) || null; }
function alertes(j) {
  const A = [], t = G.today();
  const ch = G.journal.charge(j.id);
  const RR = G.journal.retours(j.id).filter(r => r.rpe != null && r.duree), recul = RR.length ? ecart(t, RR[RR.length - 1].date) : 0;
  if (ch.ratio != null && ch.ratio > 1.3 && recul >= 21) A.push({ n: ch.ratio > 1.5 ? "haute" : "attention", t: "Charge en hausse : ratio " + nf(ch.ratio, 2), s: "journal" });

/* --- Croissance --- */
function courbe(j, m) {
  const M = arr(j.mesures).filter(x => x && x.taille && isoOk(x.date) && j.naissance).map(x => ({ a: G.ageDec(j.naissance, x.date), h: +x.taille })).sort((a, b) => a.a - b.a);
  if (M.length < 2) return "";
  const W = 320, H = 150, pl = 34, pr = 10, pt = 10, pb = 24;
  let a0 = Math.floor(M[0].a), a1 = Math.ceil(M[M.length - 1].a); if (a1 - a0 < 1) a1 = a0 + 1;
  if (m && m.aphv > a0 - 0.5 && m.aphv < a1 + 0.5) { a0 = Math.min(a0, Math.floor(m.aphv)); a1 = Math.max(a1, Math.ceil(m.aphv)); }
  let h0 = Math.floor(Math.min(...M.map(x => x.h)) / 5) * 5, h1 = Math.ceil(Math.max(...M.map(x => x.h)) / 5) * 5; if (h1 - h0 < 10) h1 = h0 + 10;
  const X = a => pl + (a - a0) / (a1 - a0) * (W - pl - pr), Y = v => pt + (1 - (v - h0) / (h1 - h0)) * (H - pt - pb);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Courbe de taille">`;
  for (let v = h0; v <= h1; v += (h1 - h0 > 30 ? 10 : 5)) s += `<line x1="${pl}" x2="${W - pr}" y1="${Y(v)}" y2="${Y(v)}" style="stroke:var(--line);stroke-width:.7"/><text x="${pl - 5}" y="${Y(v) + 3.5}" text-anchor="end" font-size="10" style="fill:var(--mute)">${v}</text>`;
  for (let a = a0; a <= a1; a++) s += `<text x="${X(a)}" y="${H - 7}" text-anchor="middle" font-size="10" style="fill:var(--mute)">${a} ans</text>`;
  if (m && m.aphv >= a0 && m.aphv <= a1) s += `<line x1="${X(m.aphv)}" x2="${X(m.aphv)}" y1="${pt}" y2="${H - pb}" style="stroke:var(--warn);stroke-dasharray:4 3"/><text x="${X(m.aphv) + 4}" y="${pt + 9}" font-size="10" style="fill:var(--warn)">pic estimé</text>`;
  s += `<polyline points="${M.map(x => X(x.a).toFixed(1) + "," + Y(x.h).toFixed(1)).join(" ")}" style="fill:none;stroke:var(--ind);stroke-width:2.2;stroke-linejoin:round"/>`;
  s += M.map(x => `<circle cx="${X(x.a).toFixed(1)}" cy="${Y(x.h).toFixed(1)}" r="3.2" style="fill:var(--panel);stroke:var(--ind);stroke-width:2"/>`).join("");
  return `<div class="chart">${s}</svg></div>`;
}

  const k = (lab, val, s) => `<div><span class="lab">${lab}</span><b>${val}</b>${s ? ` <small class="msg">${s}</small>` : ""}</div>`;
  const body = `${d ? `<div class="kpi">${k("Taille", d.taille ? nf(+d.taille) + " cm" : "–")}${k("Taille assise", d.assise ? nf(+d.assise) + " cm" : "–")}${k("Poids", d.poids ? nf(+d.poids) + " kg" : "–")}${k("Envergure", d.envergure ? nf(+d.envergure) + " cm" : "–")}</div>
    <div class="kpi">${k("Âge biologique", m ? nf(m.bio) + " ans" : "–")}${k("Âge du pic", m ? nf(m.aphv) + " ans" : "–")}${k("Vitesse", v != null ? nf(v) + " cm/an" : "–", v != null && v > 7 ? "rapide" : "")}${k("Statut", m ? esc(m.statut) : "–")}</div>
    ${m ? `<p class="msg" style="margin:0">${m.avance === "précoce" ? "Maturation précoce" : m.avance === "tardif" ? "Maturation tardive" : "Maturation dans la moyenne"} · estimation par ${esc(m.methode)} · grille conseillée ${m.grille} ans.</p>` : `<p class="msg" style="margin:0">${j.naissance ? "Ajoute la taille assise et le poids (garçon) ou la taille (fille) pour estimer l'âge biologique." : "Renseigne la date de naissance dans la fiche pour calculer l'âge biologique."}</p>`}` : ""}

    <p class="msg" style="margin:0">L'âge biologique situe la maturité du corps : il dit quelle grille utiliser et quand protéger. Autour du pic de croissance (± 1 an), on plafonne les charges, les sauts et les volumes, et on surveille genou, talon et dos. Mesure tous les 3 mois, le matin, sans chaussures.</p>`;
  return sx("j-croissance", "Croissance", d && d.taille ? nf(+d.taille) + " cm" + (m ? " · âge bio " + nf(m.bio) : "") : "aucune mesure", body, "var(--ind)");

function semaineCourante(p) { const t = G.today(); return planSemaines(p).find(w => w.d1 <= t && add(w.d1, 6) >= t) || null; }

  return `<div class="inner">${w.ses.length ? w.ses.map(s => li(null, JC[new Date(P(s.date)).getUTCDay()] + "<br>" + dCourt(s.date), esc(s.t || KN[s.k] || s.k || "Séance"), esc(KN[s.k] || "") + (arr(s.l).length ? " · " + arr(s.l).map(l => `<span class="lc ${String(l).slice(0, 2).toLowerCase()}">${esc(l)}</span>`).join(" ") : ""), s.date === G.today() ? badge("ok", "aujourd'hui") : "")).join("") : `<div class="li n2c"><span class="tt msg">Pas de séance cette semaine (repos ou coupure).</span><span></span></div>`}</div>`;
}
function sProg(j) {

  for (const p of act) {

    body += `<div class="sub">Semaine en cours · ${esc(p.nom || "Plan")}${gp ? " (groupe " + esc(gp.nom) + ")" : ""}</div><p style="margin:0"><b>Du ${dCourt(w.d1)} au ${dCourt(add(w.d1, 6))}</b>${w.ph ? " · " + esc(PHN[w.ph] || w.ph) : ""}${w.mi ? " · " + esc(w.mi) : ""}</p>${semHTML(w)}
      ${w.brut ? `<p class="msg" style="margin:0">Ouvre ce plan une fois dans Create my prog pour voir les thèmes de chaque séance.</p>` : ""}`;
    if (w.ph) res = (PHN[w.ph] || "") + (w.mi ? " · " + w.mi : "");
  }
  body += L.length ? `<div class="sub">Plans</div><div class="inner">${L.map(p => { const gp = grpOk(p.gid) ? G.groupes.get(p.gid) : null; return li(G.href("prog", "#p/" + p.id), p.debut ? G.frD(p.debut).slice(0, 5) + "<br>" + p.debut.slice(0, 4) : "", esc(p.nom || "Plan"), (p.debut ? G.frD(p.debut) + " → " + G.frD(p.fin) : "") + (gp ? " · groupe " + esc(gp.nom) : "") + (arr(p.compets).length ? " · " + arr(p.compets).length + " tournoi" + (arr(p.compets).length > 1 ? "s" : "") : ""), (!p.fin || p.fin >= t) && (!p.debut || p.debut <= t) ? badge("ok", "en cours") : ""); }).join("")}</div>` : empty("Pas encore de plan pour ce joueur ni pour ses groupes.");
  body += `<div class="tools"><button class="go acc" data-a="relais" data-vers="prog" data-jid="${esc(j.id)}">Nouvelle prog</button><a class="ib" href="${G.href("prog", "#/joueur/" + j.id)}">Ouvrir Create my prog</a></div>`;
  return sx("j-programmation", "Programmation", esc(res), body, "var(--create)");
}

/* --- Séances --- */
function retourDe(jid, ref) { return G.journal.retours(jid).find(r => r.ref === ref) || null; }
function sSeances(j) {
  const t = G.today(), S = seancesDe(j.id), av = S.filter(s => isoOk(s.date) && s.date >= t && !s.fait).sort((a, b) => a.date < b.date ? -1 : 1), fa = S.filter(s => !(isoOk(s.date) && s.date >= t && !s.fait)).sort((a, b) => (a.date || "") < (b.date || "") ? 1 : -1);
  const nd = S.filter(s => !isoOk(s.date));
  const row = (s, fut) => { const r = retourDe(j.id, s.id); return li(G.href("seances", "#/s/" + s.id), isoOk(s.date) ? dJour(s.date).replace(" ", "<br>") : "–", esc(s.nom || s.theme || "Séance"), esc([KN[s.type], s.duree ? s.duree + " min" : "", grpOk(s.gid) ? "groupe " + G.groupes.get(s.gid).nom : ""].filter(Boolean).join(" · ")) + (r ? " · retour : RPE " + r.rpe + (r.duree ? ", " + r.duree + " min" : "") + (r.comment ? " · « " + esc(r.comment.slice(0, 60)) + " »" : "") : ""),

    <div class="sub">Faites ou passées</div>${fa.length ? `<div class="inner">${fa.slice(0, 12).map(s => row(s, false)).join("")}</div>` : `<p class="msg" style="margin:0">Aucune pour l'instant.</p>`}
    <div class="tools"><button class="go acc" data-a="relais" data-vers="seances" data-jid="${esc(j.id)}">Nouvelle séance</button><a class="ib" href="${G.href("seances", "#/joueur/" + j.id)}">Ouvrir Create my séance</a></div>`;
  return sx("j-seances", "Séances", av.length ? av.length + " à venir · prochaine " + dCourt(av[0].date) : fa.length + " séance" + (fa.length > 1 ? "s" : ""), body, "var(--create)");
}

/* --- Warm-up --- */

  const body = `${fav.length ? `<div class="sub">Ses favoris</div><div class="inner">${fav.map(id => { const r = rby[id]; return li(G.href("warmup", "#/r/" + id), "♥", esc(r ? nomR(r) : id), r && r.duree ? r.duree + " min" : "", ""); }).join("")}</div>` : ""}
    <div class="sub">Routines</div>${rs.length ? `<div class="inner">${rs.slice(0, 10).map(r => li(G.href("warmup", "#/r/" + r.id), isoOk(r.date) ? G.frD(r.date).slice(0, 5) : "", esc(nomR(r)), esc([r.duree ? r.duree + " min" : "", r.apres ? "avant " + (APRES[r.apres] || r.apres) : "", grpOk(r.gid) ? "groupe " + G.groupes.get(r.gid).nom : ""].filter(Boolean).join(" · ")), fav.includes(r.id) ? "♥" : "")).join("")}</div>` : `<p class="msg" style="margin:0">Aucune routine enregistrée pour ce joueur.</p>`}
    <div class="sub">Historique</div>${H.length ? `<div class="inner">${H.slice(0, 10).map(h => li(null, isoOk(h.date) ? G.frD(h.date).slice(0, 5) : "", (h.duree ? h.duree + " min" : "Échauffement") + (h.apres ? " avant " + esc(APRES[h.apres] || h.apres) : ""), arr(h.g).length ? arr(h.g).length + " jeux" : "", "")).join("")}</div>` : `<p class="msg" style="margin:0">Aucun échauffement fait pour l'instant.</p>`}

}

/* --- Journal --- */
function chargeSVG(ch) {
  const W = 320, H = 120, pl = 30, pb = 20, pt = 8, S = ch.semaines, mx = Math.max(100, ...S.map(s => s.ua)) * 1.1, bw = (W - pl - 6) / S.length;
  const Y = v => pt + (1 - v / mx) * (H - pt - pb);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Charge des 12 dernières semaines">`;
  const step = mx > 3000 ? 1000 : mx > 1200 ? 500 : mx > 500 ? 200 : 100;
  for (let v = 0; v <= mx; v += step) s += `<line x1="${pl}" x2="${W - 4}" y1="${Y(v)}" y2="${Y(v)}" style="stroke:var(--line);stroke-width:.7"/><text x="${pl - 4}" y="${Y(v) + 3.5}" text-anchor="end" font-size="9.5" style="fill:var(--mute)">${v}</text>`;
  if (ch.chronique) s += `<line x1="${pl}" x2="${W - 4}" y1="${Y(ch.chronique)}" y2="${Y(ch.chronique)}" style="stroke:var(--mute);stroke-dasharray:4 3"/>`;
  S.forEach((w, i) => { const x = pl + i * bw + 3, last = i === S.length - 1; s += `<rect x="${x.toFixed(1)}" y="${Y(w.ua).toFixed(1)}" width="${(bw - 6).toFixed(1)}" height="${(H - pb - Y(w.ua)).toFixed(1)}" rx="2" style="fill:${last ? (ch.alerte === "haute" ? "var(--bad)" : ch.alerte === "attention" ? "var(--warn)" : "var(--ind)") : "var(--ind)"};opacity:${last ? 1 : .55}"/>`;
    if (i % 3 === 2 || last) s += `<text x="${(x + (bw - 6) / 2).toFixed(1)}" y="${H - 6}" text-anchor="middle" font-size="9.5" style="fill:var(--mute)">${G.frD(w.fin).slice(0, 5)}</text>`; });
  return `<div class="chart">${s}</svg></div>`;
}
function rng(name, lab, min, max, val, l0, l1, labs) {
  return `<div class="rng"><div class="rh"><label for="r-${name}">${lab}</label><output>${labs ? val + " · " + labs[val] : val}</output></div><input id="r-${name}" type="range" name="${name}" min="${min}" max="${max}" step="1" value="${val}" ${labs ? `data-labs="${esc(JSON.stringify(labs))}"` : ""}><div class="rl"><span>${l0}</span><span>${l1}</span></div></div>`;
}
const douleurF = (z, i) => `<div class="form"><div class="f"><label>Douleur</label><select name="dzone"><option value="">Aucune</option>${Object.entries(ZONES).map(([k, t]) => `<option value="${k}"${z === k ? " selected" : ""}>${t}</option>`).join("")}</select></div><div class="f w">${rng("dint", "Intensité", 0, 10, i || 0, "0", "10 : insupportable")}</div></div>`;
function formeForm(j, joueur) {
  const f = G.journal.forme(j.id).find(x => x.date === G.today()) || {};

    <form data-f="forme2" class="sxb" style="padding:0">${douleurF(f.douleur && f.douleur.zone, f.douleur && f.douleur.int)}

    <div class="tools"><button class="go acc" type="button" data-a="forme" data-jid="${esc(j.id)}">${f.id ? "Mettre à jour la forme du jour" : "Enregistrer la forme du jour"}</button></div></form>`;
}
function retourForm(j, joueur) {

  const recent = seancesDe(j.id).filter(s => isoOk(s.date) && ecart(t, s.date) >= 0 && ecart(t, s.date) <= 14).sort((a, b) => a.date < b.date ? 1 : -1);

      <div class="f"><label>Type</label><select name="type">${Object.entries(RTYP).map(([k, v]) => `<option value="${k}"${(pr.type || "seance") === k ? " selected" : ""}>${v}</option>`).join("")}</select></div>
      ${recent.length ? `<div class="f w"><label>Séance</label><select name="ref" data-refsel="1"><option value="">— autre —</option>${recent.map(s => `<option value="${esc(s.id)}" data-t="${esc(s.nom || s.theme || "Séance")}" data-d="${esc(s.duree || "")}" data-date="${esc(s.date)}"${pr.ref === s.id ? " selected" : ""}>${dCourt(s.date)} · ${esc(s.nom || s.theme || "Séance")}</option>`).join("")}</select></div>` : ""}

}
function sJournal(j) {

    <div class="sub">Formes</div>${F.length ? `<div class="inner">${F.slice(0, 15).map(f => { const sc = formeScore(f); return li(null, G.frD(f.date).slice(0, 5), `${nf(sc)} / 5 <span class="msg">· ${FF.map(([k, t]) => t.toLowerCase() + " " + (f[k] || "–")).join(", ")}</span>`, (f.douleur && +f.douleur.int > 0 ? "douleur " + esc(zn(f.douleur.zone).toLowerCase()) + " " + f.douleur.int + "/10" : "") + (f.comment ? " · « " + esc(f.comment) + " »" : ""), `<button class="ib sm" data-a="deljr" data-v="${esc(f.id)}" aria-label="Supprimer">×</button>`); }).join("")}</div>` : `<p class="msg" style="margin:0">Aucune forme renseignée.</p>`}`;
  const f0 = F[0];

}

/* --- Fin du suivi : archiver (« je ne l'entraîne plus ») ou supprimer définitivement --- */

    n(JR, "ligne du journal (retours, forme, charge)", "lignes du journal (retours, forme, charge)"), n(P, "plan individuel", "plans individuels"), n(S, "séance individuelle", "séances individuelles"),

/* ================= DOSSIER DE GROUPE ================= */

/* ================= RECHERCHE GLOBALE ================= */
const termes = q => fold(q).split(/[\s,;]+/).filter(w => w.length >= 2);
const hit = (hay, ts) => { const f = fold(hay); return ts.every(t => f.includes(t)); };
function marque(txt, ts) {
  const e = esc(txt), f = fold(e); const H = []; ts.forEach(t => { let p = f.indexOf(t); while (p >= 0) { H.push([p, p + t.length]); p = f.indexOf(t, p + t.length); } });
  H.sort((a, b) => a[0] - b[0]); let o = "", last = 0; for (const [s, x] of H) { if (s < last) continue; const pre = e.slice(last, s); if (/&[a-z#0-9]*$/i.test(pre)) continue; o += pre + "<mark>" + e.slice(s, x) + "</mark>"; last = x; } return o + e.slice(last);
}
function extrait(txt, ts, n = 170) { const f = fold(txt); let p = -1; for (const t of ts) { const k = f.indexOf(t); if (k >= 0 && (p < 0 || k < p)) p = k; } const a = Math.max(0, p - 50); return (a ? "…" : "") + txt.slice(a, a + n) + (a + n < txt.length ? "…" : ""); }
function chercher(q) {
  const ts = termes(q), G2 = [];
  if (!ts.length) return G2;
  const grp = (t, col, items, all) => { if (items.length) G2.push({ t, col, items, n: all || items.length }); };
  const sc = (title, ts) => ts.reduce((a, t) => a + (fold(title).includes(t) ? 10 : 0), 0) + (fold(title).startsWith(ts[0]) ? 5 : 0);
  const top = (L, n) => L.sort((a, b) => b.s - a.s).slice(0, n);
  const js = (auto() ? [moi()].filter(Boolean) : G.joueurs.all()).filter(j => hit([j.nom, j.groupe, j.classement, j.notes, j.objectifs].join(" "), ts)).map(j => ({ s: sc(j.nom, ts), h: "#/j/" + j.id, t: j.nom, w: (j.sexe === "F" ? "Fille" : "Garçon") + (ageJ(j.naissance) != null ? " · " + ageJ(j.naissance) + " ans" : "") + " · dossier joueur" }));
  grp("Joueurs", "var(--ind)", top(js, 20));
  grp("Groupes", "var(--ind)", G.groupes.all().filter(g => hit(g.nom + " " + (g.notes || ""), ts)).map(g => ({ h: "#/g/" + g.id, t: g.nom, w: g.jids.length + " joueurs · dossier de groupe" })));
  const se = SEANCES().filter(s => hit([s.nom, s.theme, KN[s.type], arr(s.lignes).join(" ")].join(" "), ts)).map(s => ({ s: sc(s.nom || s.theme || "", ts), h: G.href("seances", "#/s/" + s.id), t: s.nom || s.theme || "Séance", w: [isoOk(s.date) ? G.frD(s.date) : "", KN[s.type], seanceJids(s).map(id => prenom(G.joueurs.get(id))).filter(Boolean).join(", ")].filter(Boolean).join(" · ") }));
  grp("Séances", "var(--create)", top(se, 15), se.length);
  const pl = PROG().plans.filter(p => hit([p.nom, (G.joueurs.get(p.jid) || {}).nom, arr(p.compets).map(c => c.nom).join(" ")].join(" "), ts)).map(p => ({ h: G.href("prog", "#p/" + p.id), t: p.nom || "Plan", w: [(G.joueurs.get(p.jid) || {}).nom, p.debut ? G.frD(p.debut) + " → " + G.frD(p.fin) : ""].filter(Boolean).join(" · ") }));
  grp("Plans", "var(--create)", pl.slice(0, 15), pl.length);
  const ro = ROUT().routines.filter(r => hit([r.nom, APRES[r.apres], routJids(r).map(id => (G.joueurs.get(id) || {}).nom).join(" "), "echauffement warm-up"].join(" "), ts)).map(r => ({ h: G.href("warmup", "#/r/" + r.id), t: r.nom || "Échauffement", w: [r.duree ? r.duree + " min" : "", r.apres ? "avant " + (APRES[r.apres] || r.apres) : ""].filter(Boolean).join(" · ") }));
  grp("Warm-up", "var(--create)", ro.slice(0, 15), ro.length);
  const dv = RD.docs.filter(d => hit([d.c, d.t, d.d, d.k].join(" "), ts)).map(d => ({ s: sc(d.t, ts) + (hit(d.t, ts) ? 20 : 0), h: G.href("veille", "#d/" + d.c), t: d.t, w: d.c + " · " + String(d.p).replace(/^\d+\s*/, "").toLowerCase() + " › " + d.d.replace(/^\d+(\.\d+)*\s/, ""), x: extrait(d.k, ts) }));
  if (!auto()) grp("Veille", "var(--res)", top(dv, 12), dv.length);
  const tp = G.tests.perso().map(t => ({ id: t.id, n: t.nom, l: "Test perso", dom: t.dom }));
  const tt = [...RD.tests, ...tp].filter(t => hit([t.id, t.n, t.l].join(" "), ts)).map(t => ({ s: sc(t.n, ts), h: G.href("grilles", "#/test/" + t.id), t: t.n, w: t.id + " · " + t.l }));
  grp("Tests", "var(--tests)", top(tt, 12), tt.length);
  if (BQ) { const ex = BQ.ex.filter(e => hit([e.id, e.n, e.s, e.li, e.ob, arr(e.L).join(" ")].join(" "), ts)).map(e => ({ s: sc(e.n || "", ts) + (e.perso ? 3 : 0), h: G.href("banque", "#/ex/" + e.id), t: e.n || e.id, w: [e.id, e.perso ? "mon exo" : "", e.s].filter(Boolean).join(" · "), x: e.ob ? extrait(e.ob, ts, 140) : "" }));
    grp("Exercices", "var(--res)", top(ex, 15), ex.length); }
  const fa = RD.fams.filter(f => hit([f.c, f.t, f.d].join(" "), ts)).map(f => ({ h: G.href("banque", "#f/" + f.c), t: f.t, w: f.c + " · famille de la banque" }));
  grp("Familles de la banque", "var(--res)", fa.slice(0, 10), fa.length);
  const sa = RD.saisons.filter(s => hit([s.c, s.t, s.d, s.x].join(" "), ts)).map(s => ({ h: G.href("saisons", "#/s/" + s.c), t: s.t, w: s.c + " · " + s.d, x: s.x }));
  grp("Saisons de référence", "var(--res)", sa.slice(0, 10), sa.length);
  return G2;
}

/* ---------- import des sauvegardes (GRÜN et anciennes applis) ---------- */
function fusionPrefs(key, d, unions, objets) {
  const cur = G.load(key, {}) || {};
  for (const k of unions) if (Array.isArray(d[k])) cur[k] = [...new Set([...arr(cur[k]), ...d[k]])];
  for (const k of objets) if (d[k] && typeof d[k] === "object") cur[k] = { ...(cur[k] || {}), ...d[k] };
  G.save(key, cur);
}
function parId(cur, nv) { const m = new Map(arr(cur).filter(x => x && x.id).map(x => [x.id, x])); arr(nv).forEach(x => { if (x && x.id) m.set(x.id, x); }); return [...m.values()]; }
function fusionJoueurs(list) {
  const s = G.load(G.K.joueurs, { joueurs: [] }) || {}; s.joueurs = arr(s.joueurs); let n = 0;
  for (const p of arr(list)) {

    const bil = arr(p.bilans).map(b => ({ ...b, id: b.id || G.uid(), date: b.date || G.today(), age: b.age, note: b.note || "", v: b.v || b.valeurs || { PP: [], GE: [], DE: [] }, sel: arr(b.sel), res: b.res || {} }));
    let ex = s.joueurs.find(x => p.id && x.id === p.id) || s.joueurs.find(x => x.nom === p.nom && (x.naissance || "") === (p.naissance || ""));
    if (!ex) { const j = { ...p, id: p.id || G.uid(), sexe: p.sexe === "F" ? "F" : "G", bilans: bil }; delete j.valeurs; s.joueurs.push(j); n++; continue; }
    for (const k in p) if (k !== "bilans" && k !== "id" && (ex[k] == null || ex[k] === "" || (Array.isArray(ex[k]) && !ex[k].length))) ex[k] = p[k];
    ex.bilans = arr(ex.bilans); for (const b of bil) if (!ex.bilans.some(x => x.id === b.id || (x.date === b.date && x.age === b.age))) ex.bilans.push(b);
    n++;
  }
  G.save(G.K.joueurs, s); return n;
}
function importer(d, nom) {

  if (d.app === "GRUN" && d.data) { const o = { ...d, data: { ...d.data } }; delete o.data[G.K.mode]; delete o.data[G.K.handoff]; G.importAll(o, true); return "Sauvegarde GRÜN du " + G.frD(d.date); }

    case "banque": { fusionPrefs(G.K.banqueDocs, d, ["fav"], ["notes", "links"]); const c = G.load(G.K.banqueDocs, {}) || {}; c.lists = parId(c.lists, d.lists); G.save(G.K.banqueDocs, c); return "Banque d'exercices (favoris, listes, notes)"; }
    case "saisons": fusionPrefs(G.K.saisons, d, ["fav"], ["notes"]); return "Référentiel des saisons (favoris et notes)";
    case "grilles-docs": fusionPrefs(G.K.grillesDocs, d, ["fav"], ["notes"]); { const n = fusionJoueurs(d.joueurs); return "Grilles (favoris, notes" + (n ? ", " + n + " joueur" + (n > 1 ? "s" : "") : "") + ")"; }
    case "profil-radar": { const n = fusionJoueurs(d.joueurs); return "Profil radar (" + n + " joueur" + (n > 1 ? "s" : "") + " et leurs bilans)"; }
    case "programmation": {
      const pr = d.prog || {}, c = G.load(G.K.prog, {}) || {}; c.plans = parId(c.plans, pr.plans); c.profils = { ...(c.profils || {}), ...(pr.profils || {}) }; G.save(G.K.prog, c);
      const n = fusionJoueurs((d.joueurs && d.joueurs.joueurs) || d.joueurs);
      for (const [id, p] of Object.entries(pr.profils || {})) { const j = G.joueurs.get(id); if (!j) continue; const patch = {}; for (const k of ["classement", "croissance", "zones", "prio"]) if (p[k] != null && (j[k] == null || j[k] === "NC" || j[k] === false || (Array.isArray(j[k]) && !j[k].length))) patch[k] = p[k]; if (Object.keys(patch).length) G.joueurs.update(id, patch); }
      return "Programmation (" + arr(pr.plans).length + " plan" + (arr(pr.plans).length > 1 ? "s" : "") + (n ? ", " + n + " joueurs" : "") + ")";
    }
    case "seances": { const st = d.st || {}, c = G.load(G.K.seances, {}) || {}; const o = { ...st, ...c }; o.seances = parId(c.seances, st.seances); G.save(G.K.seances, o); return "Séances (" + arr(st.seances).length + ")"; }
    case "routines": { const st = d.st || {}, c = G.load(G.K.routines, {}) || {}; const o = { ...st, ...c }; o.routines = parId(c.routines, st.routines);
      o.hist = [...new Map([...arr(c.hist), ...arr(st.hist)].map(h => [JSON.stringify(h), h])).values()]; o.fav = [...new Set([...arr(c.fav), ...arr(st.fav)])]; o.hide = [...new Set([...arr(c.hide), ...arr(st.hide)])]; G.save(G.K.routines, o); return "Routines (" + arr(st.routines).length + ")"; }
  }
  // ancienne appli « Grilles et tests » (Grilles_et_tests_<date>.json) et formats inconnus : on cherche une liste de joueurs
  const cand = [d.joueurs, d.data && d.data.joueurs, d.grilles_v1 && d.grilles_v1.joueurs, d.st && d.st.joueurs, d.players, Array.isArray(d) ? d : null, d.joueurs && d.joueurs.joueurs].find(x => Array.isArray(x) && x.some(p => p && p.nom));
  if (cand) { const n = fusionJoueurs(cand); return (/grilles/i.test(nom || "") ? "Grilles et tests (ancienne appli)" : "Joueurs") + " · " + n + " joueur" + (n > 1 ? "s" : ""); }
  throw new Error("format inconnu");
}

    const o = { jid, date: G.today(), douleur: dz || di ? { zone: dz || "autre", int: di } : null, comment: (F2.get("comment") || "").trim() }; FF.forEach(([k]) => o[k] = +F1.get(k));
    quiet(() => G.journal.addForme(o)); toast(G.isJoueur() ? "Merci, c'est noté !" : "Forme enregistrée"); render(true);
  },
  retourde(b) { const s = SEANCES().find(x => x.id === b.dataset.v); PREF = { jid: b.dataset.jid, ref: s.id, titre: s.nom || s.theme || "Séance", duree: s.duree || 60, date: s.date, type: "seance" }; OPEN.add("j-journal"); keepOpen(); render(true); const x = $("#retour-" + CSS.escape(b.dataset.jid)); if (x) x.scrollIntoView({ block: "start", behavior: "smooth" }); },
  modej(b) {
    const jid = b.dataset.jid || ($("#" + b.dataset.src) || {}).value; if (!jid) { toast("Choisis d'abord un joueur."); return; }
    const code = ($("#rcode") && $("#rcode").value.trim()) || REG().code;
    if (!/^\d{4}$/.test(code)) { toast("Choisis d'abord un code coach à 4 chiffres."); location.hash = "#/reglages"; return; }
    setReg({ code }); G.setMode("joueur", jid); location.hash = "#/"; location.reload();
  },
  profil(b, e) { e.preventDefault(); setReg({ profil: b.dataset.v }); location.hash = "#/"; render(false); },
  moi(b) { setReg({ profil: "autonome", jidMoi: b.dataset.v }); location.hash = "#/"; render(false); },
  coach() { G.setMode("coach"); location.hash = "#/"; location.reload(); },
  monwu(b, e) { e.preventDefault(); const jid = G.mode().jid; G.relais.envoyer({ de: "accueil", vers: "warmup", retour: "index.html", jid, mode: "joueur" }); G.go("warmup"); },
  theme(b) { setReg({ theme: b.dataset.v }); applyReg(); render(true); },
  fs(b) { setReg({ fs: Math.max(85, Math.min(135, (+REG().fs || 100) + +b.dataset.v)) }); applyReg(); render(true); },
  export() { G.telecharger(G.exportAll(), "GRUN_sauvegarde_" + G.today() + ".json"); const m = $("#impm"); if (m) { m.textContent = "Sauvegarde créée : enregistre-la dans Fichiers (iCloud Drive)."; m.className = "msg ok"; } }
};
main.addEventListener("click", e => {
  const b = e.target.closest("[data-a]");
  if (!b) { if (e.target.closest("[data-stop]")) e.stopPropagation(); return; }
  if (b.tagName === "BUTTON" && b.type !== "submit") e.preventDefault();
  if (b.closest("a.li, a.ev") && b.tagName === "BUTTON") e.preventDefault();
  const f = ACT[b.dataset.a]; if (f) f(b, e);
});

/* ---------- démarrage ---------- */
function splash() {
  const s = $("#splash"); if (!s) return; let vu = false;
  try { vu = sessionStorage.getItem("grun_splash") === "1"; sessionStorage.setItem("grun_splash", "1"); } catch (e) {}
  if (vu || matchMedia("(prefers-reduced-motion: reduce)").matches) { s.remove(); return; }
  setTimeout(() => { s.classList.add("out"); setTimeout(() => s.remove(), 300); }, 600);
}
applyReg(); splash();
G.nav(G.isJoueur() ? "acc" : "acc");
rdP.then(() => {
  render(false);
  const rr = G.relais.resultat("accueil"); if (rr) { const r = rr.res || {}; toast("De retour : " + (r.titre || r.nom || "c'est enregistré")); }
});
})();

</script>
