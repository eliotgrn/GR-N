<style>/* GRÜN — styles communs injectés dans chaque module (barre des pôles en bas, éléments partagés).
   Les modules gardent leurs jetons (--bg, --panel, --ink, --mute, --line, --soft) au style Veille. */
:root{--grun:#0F766E;--grun-ink:#0B3B36;--nav-h:62px}
body.grun-has-nav{padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px))}
#grun-nav{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:space-around;align-items:stretch;
  background:var(--panel,#fff);border-top:1px solid var(--line,#D9DDE3);padding-bottom:env(safe-area-inset-bottom,0px);
  box-shadow:0 -4px 18px rgba(0,0,0,.05)}
#grun-nav a{flex:1;max-width:140px;min-height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  text-decoration:none;color:var(--mute,#5D6675);font:600 11.5px/1.1 var(--ui,system-ui,sans-serif);letter-spacing:.01em}
#grun-nav svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#grun-nav a.on{color:var(--ink,#16202E)}
#grun-nav a.on svg{stroke:var(--grun)}

@media print{#grun-nav{display:none}body.grun-has-nav{padding-bottom:0}}
/* fil « poupée russe » : bandeau de retour vers le module appelant */
.grun-relais{position:sticky;top:0;z-index:40;display:flex;gap:10px;align-items:center;justify-content:space-between;
  background:var(--grun);color:#fff;padding:8px 16px;font:600 14px/1.3 var(--ui,system-ui,sans-serif)}
.grun-relais a,.grun-relais button{color:#fff;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);border-radius:8px;
  min-height:36px;padding:0 12px;display:inline-flex;align-items:center;text-decoration:none;font:inherit;white-space:nowrap}
.grun-mod #back{visibility:visible!important}
</style>

<meta name="grun-module" content="grilles"></head><body><title>Grilles et tests</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Même mise en page que l'appli Veille : barre fixe (retour, recherche) ; accueil = accès direct, 4 portes, favoris ; document = fil d'Ariane, L'essentiel ouvert, Le détail en sections dépliables (une par ligne de grille) */
:root{

  --pp:#C2410C; --ge:#1D4ED8; --de:#0F766E;

  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;

}

  --p1:#F27AB8; --p2:#7FB2F0; --p3:#3CC7B2; --p4:#E2B85A; --acc:#E6EAF0; --pp:#F08A4B; --ge:#86A8FF; --de:#3CC7B2; --p5:#C3CCD8; --n1:#F2786A; --n2:#F0B14A; --n3:#5BD08A; --n4:#B79CF5; --n1s:#3A1F1C; --n2s:#3A2C12; --n3s:#183326; --n4s:#2A2140; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10141B; --panel:#181E28; --ink:#E6EAF0; --mute:#9AA4B3; --line:#2B3442; --soft:#212938; --mark:#6B5A12;
  --p1:#F27AB8; --p2:#7FB2F0; --p3:#3CC7B2; --p4:#E2B85A; --acc:#E6EAF0; --pp:#F08A4B; --ge:#86A8FF; --de:#3CC7B2; --p5:#C3CCD8; --n1:#F2786A; --n2:#F0B14A; --n3:#5BD08A; --n4:#B79CF5; --n1s:#3A1F1C; --n2s:#3A2C12; --n3s:#183326; --n4s:#2A2140; color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.45;margin:0;-webkit-tap-highlight-color:transparent}

<header class="top"><div class="topin">
  <button class="ib" id="back" type="button" aria-label="Retour">‹</button>
  <a class="brand" href="#">Grilles</a>
  <div class="sbox"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Rechercher dans les grilles et les tests" autocomplete="off" enterkeyhint="search"></div>
</div></header>
<main id="main"><div class="load">Chargement des grilles…</div></main>

<script>
"use strict";
const PORTES = {
  "1": {n:"Filles", c:"--p1", s:"Les grilles filles de 4 à 18 ans : un dossier par âge, 3 grilles par âge (préparation physique, geste, déplacement)."},
  "2": {n:"Garçons", c:"--p2", s:"Les grilles garçons de 4 à 18 ans : un dossier par âge, 3 grilles par âge (préparation physique, geste, déplacement)."},
  "3": {n:"Tests", c:"--p3", s:"Les 287 fiches de tests : protocole complet et barèmes de tous les âges, filles et garçons."},
  "4": {n:"Mode d'emploi", c:"--p4", s:"Utiliser les grilles, l'âge biologique, les 4 niveaux, les lignes et les règles d'évaluation."}
};
const DOMN = {PP:"Préparation physique", GE:"Biomécanique du geste", DE:"Biomécanique du déplacement"};
let LIGNES = {};


let DOCS = [], BY = {}, NORM = null;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fold = s => { let o=""; for(const ch of s){ const d=ch.normalize("NFD")[0]; o += (d||ch).toLowerCase(); } return o; };
const keyc = c => c.split(".").map(Number);

/* ---------- préférences locales ---------- */
const ST = "grilles_docs_v1";
function load(){ try{ return JSON.parse(localStorage.getItem(ST)) || {}; }catch(e){ return {}; } }
let P = Object.assign({fav:[], rec:[], notes:{}, fs:17, sx:"G", age:"10", dom:"PP", ligne:"0"}, load());
function save(){ try{ localStorage.setItem(ST, JSON.stringify(P)); }catch(e){} }
document.documentElement.style.setProperty("--fs", P.fs+"px");

/* ---------- données ---------- */
async function boot(){
  if(window.GRUN) GRUN.nav("tests");
  try{
    const r = await fetch("data-grilles.json"); const d = await r.json();
    DOCS = d.docs; LIGNES = d.lignes||{}; X = d.x; DOCS.forEach((x,i)=>{ x.i=i; BY[x.c]=x; });
  }catch(e){ $("#main").innerHTML = '<div class="empty">Les grilles n\'ont pas pu se charger. Vérifie la connexion pour la première ouverture, puis recharge la page.</div>'; return; }
  route();
  setTimeout(buildIndex, 50);
}
function buildIndex(){
  if(NORM) return;
  const tmp = document.createElement("div");
  NORM = DOCS.map(x => { tmp.innerHTML = x.h.replace(/></g,"> <"); const t = (x.t+" \n "+tmp.textContent).replace(/\s+/g," "); return {raw:t, f:fold(t)}; });
}

/* ---------- routage ---------- */
window.addEventListener("hashchange", route);
$("#back").onclick = () => { if(history.length > 1) history.back(); else location.hash = ""; };
function route(){
  const h0 = decodeURIComponent(location.hash.slice(1)); const qi = h0.indexOf("?"); const h = qi>=0 ? h0.slice(0,qi) : h0, q = qi>=0 ? h0.slice(qi+1) : "";
  const m = $("#main"); window.scrollTo(0,0); m.style.removeProperty("--pc");
  const mm = document.getElementById("modal"); if(mm) mm.hidden = true;
  /* points d'entrée GRÜN */
  if(h.startsWith("/joueur/")) return showJoueur(h.split("/")[2]);
  if(h.startsWith("/test/")){ const [,, id, hint] = h.split("/"); return isPerso(id) ? showTestPerso(id, hint) : BY[id] ? showDoc(id, hint) : showMesTests(); }
  if(h.startsWith("/ligne/")){ const [,, L, sx, a] = h.split("/"); const k = /^(PP|GE|DE)(\d+)$/.exec(L||""); const age = clampA(+a||+P.age||10);
    if(k) return showDoc(`${sx==="F"?"F":"G"}${pad2(age)}_${k[1]}`, "l"+k[2]); return showHome(); }
  if(h==="/mestests") return showMesTests();
  if(h==="/tests") return showPorte("3");
  if(h==="/test-nouveau") return showTestEdit(null, q);
  if(h.startsWith("/test-edit/")) return showTestEdit(h.split("/")[2], q);
  if(h==="/gbilan" || h.startsWith("/gbilan/")) return showGBilan(h.slice(8));
  if(h.startsWith("/fiche/")) return showFiche(h.split("/")[2], h.split("/")[3]);
  if(h==="/joueurs") return showJoueurs();
  if(h.startsWith("d/")) return showDoc(h.slice(2).split("/")[0], h.split("/")[2]);
  if(h.startsWith("p/")) return showPorte(h.slice(2));
  if(h.startsWith("s/")) { $("#q").value = h.slice(2); return showSearch(h.slice(2)); }
  if(h==="j") return showJoueurs();
  if(h.startsWith("j/")) return showJoueur(h.slice(2));
  if(RO() && h==="") return showJoueur(GR.mode().jid);
  if(h==="/accueil") return showHome();
  showHome();
}
function porteOf(x){ return x.p; }
function colOf(x){ return x.dom ? `var(--${x.dom.toLowerCase()})` : pc(porteOf(x)); }
const pad2 = n => String(n).padStart(2,"0");
function pc(p){ return `var(${PORTES[p].c})`; }

/* ---------- accueil ---------- */
function showHome(){
  document.documentElement.style.setProperty("--acc", "var(--ink)");
  const m = $("#main");
  const count = p => DOCS.filter(x=>porteOf(x)===p).length;
  let html = `<h1>Grilles et tests</h1><p class="lead">Grilles de compétences 4-18 ans · 90 grilles · 287 tests · niveau 3 = attendu du haut niveau de sa génération</p>`;
  html += `<div class="sec"><h2>Accès direct</h2><div class="quick">
    <div class="f"><label for="qs">Sexe</label><select id="qs"><option value="F">Fille</option><option value="G">Garçon</option></select></div>
    <div class="f"><label for="qa">Âge</label><select id="qa">${Array.from({length:15},(_,i)=>String(i+4)).map(a=>`<option value="${a}">${a} ans</option>`).join("")}</select></div>
    <div class="f"><label for="qd">Grille</label><select id="qd"><option value="PP">Préparation physique</option><option value="GE">Biomécanique du geste</option><option value="DE">Biomécanique du déplacement</option></select></div>
    <div class="f" style="flex:1;min-width:200px"><label for="ql">Ligne</label><select id="ql"></select></div>
    <button class="go" id="qgo" type="button">Ouvrir</button></div></div>`;
  const nJ = GR.joueurs.all().length, nT = tc().per.length;
  if(RO()) html += `<div class="sec"><a class="door" href="#/joueur/${GR.mode().jid}" style="--pc:var(--p5)"><b>Mon dossier</b><span>Ton profil radar, tes résultats de tests et ta progression.</span></a></div>`;
  html += `<div class="sec"><h2>Les portes</h2><div class="doors">${Object.entries(PORTES).map(([p,o])=>`<a class="door" href="#p/${p}" style="--pc:var(${o.c})"><b>${p} · ${o.n}</b><span>${o.s}</span><small>${count(p)} documents${p==="3"&&nT?` · ${nT} test${nT>1?"s":""} perso`:""}</small></a>`).join("")}${RO()?"":`<a class="door" href="#j" style="--pc:var(--p5)"><b>5 · Joueurs</b><span>Dossier de chaque joueur : profil radar, grilles remplies, tests et résultats, progression, croissance. Bilans de groupe.</span><small>${nJ} joueur${nJ>1?"s":""}</small></a>`}</div></div>`;
  const favs = P.fav.filter(c=>BY[c]), recs = P.rec.filter(c=>BY[c]).slice(0,8);
  html += `<div class="sec"><h2>Favoris</h2>${favs.length ? listHTML(favs.map(c=>BY[c]), true) : '<div class="empty">Touche ☆ en haut d\'une grille ou d\'un test pour le retrouver ici.</div>'}</div>`;
  if(recs.length) html += `<div class="sec"><h2>Consultés récemment</h2>${listHTML(recs.map(c=>BY[c]), true)}</div>`;
  html += `<div class="sec"><h2>Mes données</h2><div class="tools">
     ${RO()?"":`<button class="ib" id="bsave" type="button">Sauvegarder tout GRÜN</button>
     <label class="ib" for="frest">Restaurer</label><input id="frest" type="file" accept=".json,application/json" hidden>`}
     <button class="ib" id="fsm" type="button" aria-label="Texte plus petit">A−</button><button class="ib" id="fsp" type="button" aria-label="Texte plus grand">A+</button></div><p class="msg" id="dmsg">${RO()?"Tes données sont gardées sur cet appareil.":"Une seule sauvegarde pour toute l'appli (joueurs, groupes, tests, favoris, notes…) ; la restauration accepte aussi les anciens fichiers Grilles et Profil radar."}</p></div>`;
  m.innerHTML = html;
  const qs=$("#qs"), qa=$("#qa"), qd=$("#qd"), ql=$("#ql");
  qs.value=P.sx; qa.value=P.age; qd.value=P.dom;
  const fill=()=>{ const L = LIGNES[qd.value]||[]; ql.innerHTML = `<option value="0">Toute la grille</option>`+L.map((n,i)=>`<option value="${i+1}">${i+1} · ${esc(n)}</option>`).join(""); ql.value = +P.ligne <= L.length ? P.ligne : "0"; };
  fill(); qd.onchange=()=>{ P.ligne="0"; fill(); };
  $("#qgo").onclick=()=>{ P.sx=qs.value; P.age=qa.value; P.dom=qd.value; P.ligne=ql.value||"0"; save(); location.hash = `d/${qs.value}${pad2(qa.value)}_${qd.value}` + (+ql.value ? `/l${ql.value}` : ""); };
  if($("#bsave")){ $("#bsave").onclick=exportData; $("#frest").onchange=importData; }
  $("#fsm").onclick=()=>setFs(-1); $("#fsp").onclick=()=>setFs(1);
}
function setFs(d){ P.fs=Math.max(14,Math.min(24,P.fs+d)); save(); document.documentElement.style.setProperty("--fs",P.fs+"px"); const m=$("#dmsg"); if(m) m.textContent="Taille du texte des documents : "+P.fs+" px."; }
function listHTML(xs, withPath){
  return `<div class="list">${xs.map(x=>`<a class="li" href="#d/${x.c}"><span class="code">${x.c}</span><span class="tt">${esc(x.t)}${x.p==="3"&&tov(x.c)?' <span class="bdg mod">modifié</span>':""}${withPath?`<small>${esc(x.ch)}</small>`:""}</span></a>`).join("")}</div>`;
}
function persoListHTML(ts){ return `<div class="list">${ts.map(t=>`<a class="li" href="#/test/${t.id}"><span class="code">${t.id.replace("T-MOI-","MOI ")}</span><span class="tt">${t.prio?"★ ":""}${esc(t.nom)} <span class="bdg">mon test</span><small>${DOMN[t.dom]||""} · ligne${(t.lignes||[]).length>1?"s":""} ${(t.lignes||[]).join(", ")||"–"}</small></span></a>`).join("")}</div>`; }

/* ---------- porte ---------- */
function showPorte(p){
  if(!PORTES[p]) return showHome();
  document.documentElement.style.setProperty("--acc", pc(p));
  const xs = DOCS.filter(x=>porteOf(x)===p), groups = {};
  xs.forEach(x=>{ (groups[x.d] = groups[x.d] || []).push(x); });
  let html = `<div class="crumb" style="--pc:${pc(p)}"><a href="#${RO()?"/accueil":""}">Accueil</a></div><h1 style="color:${pc(p)}">${p} · ${PORTES[p].n}</h1><p class="lead">${PORTES[p].s}</p>`;
  if(p==="3"){ const per = tc().per;
    html += `<div class="tools" style="margin-top:12px">${RO()?"":`<a class="ib" href="#/test-nouveau">+ Créer un test</a>`}<a class="ib" href="#/mestests">Mes tests et modifications</a></div>`;
    if(per.length){ const byd = {}; per.forEach(t=>(byd[t.dom]=byd[t.dom]||[]).push(t)); html += `<div class="fold" style="--pc:${pc(p)}"><h3>Mes tests</h3>${persoListHTML(DOM3.flatMap(d=>byd[d]||[]))}</div>`; } }
  html += Object.entries(groups).map(([d,arr])=>`<div class="fold" style="--pc:${pc(p)}"><h3>${esc(d)}</h3>${listHTML(arr,false)}</div>`).join("");
  $("#main").innerHTML = html;
}

/* ---------- document ---------- */
function showDoc(code, hint){
  const x = BY[code]; if(!x) return showHome();
  const p = porteOf(x); document.documentElement.style.setProperty("--acc", colOf(x));
  P.rec = [code, ...P.rec.filter(c=>c!==code)].slice(0,20); save();
  const sib = DOCS.filter(y=>y.d===x.d), k = sib.indexOf(x), prev = sib[k-1], next = sib[k+1];
  const fav = P.fav.includes(code);
  const m = $("#main"); m.style.setProperty("--pc", colOf(x));
  m.innerHTML = `<div class="crumb"><a href="#">Accueil</a>›<a href="#p/${p}">${p} · ${PORTES[p].n}</a>›<span>${esc(x.d)}</span></div>
    <div class="dochead"><h1>${esc(x.t)}</h1><div class="acts">
      <button class="ib star" id="fav" type="button" aria-pressed="${fav}">${fav?"★ Favori":"☆ Favori"}</button>
      <button class="ib" id="fsm" type="button" aria-label="Texte plus petit">A−</button><button class="ib" id="fsp" type="button" aria-label="Texte plus grand">A+</button></div></div>
    <div class="crumb" style="margin-top:4px">${esc(x.ch||"")} · ${x.c}</div>${jumps(x)}
    <nav class="toc" id="toc" hidden></nav>
    <article class="doc" id="doc"></article>
    <div class="pn">${prev?`<a href="#d/${prev.c}"><small>‹ Précédent</small>${esc(prev.t)}</a>`:"<span></span>"}${next?`<a class="nx" href="#d/${next.c}"><small>Suivant ›</small>${esc(next.t)}</a>`:"<span></span>"}</div>
    <div class="notes"><label for="nt" style="font-weight:600">Mes notes sur ce document</label><textarea id="nt" placeholder="Idées, joueurs concernés, à tester…"></textarea><div class="msg" id="ntm"></div></div>`;
  // structure : L'essentiel encadré, Le détail en sections dépliables
  const doc = $("#doc"); const tmp = document.createElement("div"); tmp.innerHTML = x.h;
  tmp.querySelectorAll("table").forEach(t=>{ const w=document.createElement("div"); w.className="tw"; t.replaceWith(w); w.appendChild(t); });
  let cur = null, mode = null, sections = [];
  for(const node of [...tmp.childNodes]){
    if(node.nodeName==="H2"){
      const t = fold(node.textContent);
      if(t.includes("essentiel")){ cur = document.createElement("section"); cur.className="ess"; cur.appendChild(node); doc.appendChild(cur); mode="ess"; continue; }
      mode = "det"; doc.appendChild(node); cur = doc; continue;
    }
    if(node.nodeName==="H3" && mode!=="ess"){
      const d = document.createElement("details"); const s = document.createElement("summary"); s.textContent = node.textContent; d.appendChild(s);
      d.id = "s"+sections.length; sections.push([d.id, node.textContent]); doc.appendChild(d); cur = d; continue;
    }
    (cur || doc).appendChild(node);
  }
  if(sections.length>2){ const toc=$("#toc"); toc.hidden=false; toc.innerHTML = `<b>Le détail</b><ol>${sections.map(([id,t])=>`<li><a href="#" data-s="${id}">${esc(t.replace(/^\d+\.\s*/,""))}</a></li>`).join("")}</ol>`;
    toc.onclick = e=>{ const a=e.target.closest("a[data-s]"); if(!a) return; e.preventDefault(); const d=document.getElementById(a.dataset.s); d.open=true; d.scrollIntoView({behavior:"smooth",block:"start"}); }; }
  if(sections.length===1){ doc.querySelector("details").open = true; }
  try{ if(/^[FG]\d\d_(PP|GE|DE)$/.test(code)) enhanceGrid(x); else if(p==="3") enhanceTest(x); }catch(e){ console.warn("enrichissement", e); }
  // favoris, taille, notes
  $("#fav").onclick = ()=>{ const on = !P.fav.includes(code); P.fav = on ? [code,...P.fav] : P.fav.filter(c=>c!==code); save(); $("#fav").setAttribute("aria-pressed",on); $("#fav").textContent = on?"★ Favori":"☆ Favori"; };
  $("#fsm").onclick=()=>setFs(-1); $("#fsp").onclick=()=>setFs(1);
  const nt=$("#nt"); nt.value = P.notes[code]||""; let tm;
  nt.oninput = ()=>{ clearTimeout(tm); tm=setTimeout(()=>{ if(nt.value.trim()) P.notes[code]=nt.value; else delete P.notes[code]; save(); $("#ntm").textContent="Note enregistrée sur cet appareil."; },500); };
  // aller à un âge ou surligner une recherche
  if(hint && hint.startsWith("l")) goLine(+hint.slice(1));
  else if(hint && hint.startsWith("b")) goBareme(hint.slice(1));
  else if(hint && hint.startsWith("q")) highlight(hint.slice(1));
}
function jumps(x){
  const m = /^([FG])(\d\d)_(PP|GE|DE)$/.exec(x.c); if(!m) return "";
  const [_, sx, a2, dom] = m, a = +a2, o = sx==="F"?"G":"F";
  const L = LIGNES[dom]||[];
  return `<div class="jump">${["PP","GE","DE"].map(d=>`<a href="#d/${sx}${a2}_${d}" class="${d===dom?"on":""}">${DOMN[d]}</a>`).join("")}</div>
  <div class="jump">${a>4?`<a href="#d/${sx}${pad2(a-1)}_${dom}">‹ ${a-1} ans</a>`:""}${a<18?`<a href="#d/${sx}${pad2(a+1)}_${dom}">${a+1} ans ›</a>`:""}<a href="#d/${o}${a2}_${dom}">Même grille · ${o==="F"?"filles":"garçons"}</a></div>
`;
}
document.addEventListener("click", e=>{ const a=e.target.closest(".lines a[data-l]"); if(!a) return; e.preventDefault(); goLine(+a.dataset.l); });
function goLine(n){
  const d = [...document.querySelectorAll("#doc details")].find(x=>x.querySelector("summary").textContent.startsWith("Ligne "+n+" ·"));
  if(!d) return; d.open = true; setTimeout(()=>{ d.scrollIntoView({behavior:"smooth",block:"start"}); d.querySelector("summary").classList.add("flash"); },60);
}
function goBareme(k){
  const tr = document.getElementById("b"+k); if(!tr) return; const d = tr.closest("details"); if(d) d.open = true;
  setTimeout(()=>{ tr.scrollIntoView({behavior:"smooth",block:"center"}); tr.classList.add("flash"); },60);
}
function ageIn(text, age){
  const t = fold(text); if(!/\ban|ans\b/.test(t)) return false;
  const nums = (t.match(/\d+/g)||[]).map(Number).filter(n=>n<=25); if(!nums.length) return false;
  if(/\d+\s*(-|a|à|et)\s*\d+/.test(t) && nums.length>=2){ const lo=Math.min(...nums), hi=Math.max(...nums); return age>=lo && age<=hi; }
  return nums.includes(age);
}
function goAge(age){
  const doc = $("#doc");
  let target = [...doc.querySelectorAll("details")].find(d=>ageIn(d.querySelector("summary").textContent, age));
  if(target){ target.open=true; setTimeout(()=>{ target.scrollIntoView({behavior:"smooth",block:"start"}); target.querySelector("summary").classList.add("flash"); },60); return; }
  const h = [...doc.querySelectorAll("h4,h5")].find(e=>ageIn(e.textContent, age));
  if(h){ const d=h.closest("details"); if(d) d.open=true; setTimeout(()=>{ h.scrollIntoView({behavior:"smooth",block:"center"}); h.classList.add("flash"); },60); return; }
  const td = [...doc.querySelectorAll("td:first-child")].find(e=>ageIn(e.textContent, age));
  if(td){ const tr=td.parentNode; setTimeout(()=>{ tr.scrollIntoView({behavior:"smooth",block:"center"}); tr.classList.add("flash"); },60); }
}

/* ---------- recherche ---------- */
let sT;
$("#q").addEventListener("input", e=>{ clearTimeout(sT); const v=e.target.value.trim(); sT=setTimeout(()=>{ if(v.length>=2) history.replaceState(null,"","#s/"+encodeURIComponent(v)), showSearch(v); else if(!v && location.hash.startsWith("#s/")) location.hash=""; },250); });
$("#q").addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.target.blur(); } });
function terms(q){ return fold(q).split(/\s+/).filter(w=>w.length>=2); }
function showSearch(q){
  document.documentElement.style.setProperty("--acc", "var(--ink)");
  buildIndex();
  const ts = terms(q), m = $("#main");
  if(!ts.length){ showHome(); return; }
  const res = [];
  NORM.forEach((n,i)=>{
    let score=0, first=-1;
    for(const t of ts){ let c=0, pos=n.f.indexOf(t); if(pos<0){ score=0; return; } if(first<0||pos<first) first=pos; while(pos>=0 && c<60){ c++; pos=n.f.indexOf(t,pos+t.length); } score+=c; }
    if(fold(DOCS[i].t).includes(ts[0])) score+=40;
    res.push({i, score, first});
  });
  res.sort((a,b)=>b.score-a.score);
  const top = res.slice(0,60);
  let html = `<h1>Recherche</h1><p class="lead">${res.length ? `${res.length} document${res.length>1?"s":""} pour « ${esc(q)} »${res.length>60?" · les 60 plus pertinents":""}` : `Aucun document ne contient « ${esc(q)} ». Essaie un mot plus court ou un synonyme.`}</p><div class="sec">`;
  html += top.map(r=>{ const x=DOCS[r.i], n=NORM[r.i]; const a=Math.max(0,r.first-90), b=Math.min(n.raw.length,r.first+190);
    let snip = (a?"…":"")+n.raw.slice(a,b)+(b<n.raw.length?"…":"");
    snip = markTerms(esc(snip), ts);
    return `<a class="res" href="#d/${x.c}/q${encodeURIComponent(q)}" style="--pc:${colOf(x)}"><div class="t">${esc(x.t)}</div><div class="w">${x.c} · ${esc(x.ch)}</div><div class="s">${snip}</div></a>`; }).join("");
  const pm = tc().per.filter(t=>{ const f = fold([t.nom,t.protocole,t.materiel,t.id].join(" ")); return ts.every(w=>f.includes(w)); });
  if(pm.length) html = html.replace('<div class="sec">', `<div class="sec">${persoListHTML(pm)}<div style="height:8px"></div>`);
  m.innerHTML = html + "</div>";
}
function markTerms(htmlText, ts){
  const f = fold(htmlText); let out="", i=0;
  const hits=[]; ts.forEach(t=>{ let p=f.indexOf(t); while(p>=0){ hits.push([p,p+t.length]); p=f.indexOf(t,p+t.length); } });
  hits.sort((a,b)=>a[0]-b[0]); let last=0;
  for(const [s,e] of hits){ if(s<last) continue; const pre=htmlText.slice(last,s); if(/&[a-z]*$/.test(pre)) continue; out+=pre+"<mark>"+htmlText.slice(s,e)+"</mark>"; last=e; }
  return out+htmlText.slice(last);
}
function highlight(q){
  const ts = terms(q); if(!ts.length) return; const doc=$("#doc");
  const walker = document.createTreeWalker(doc, NodeFilter.SHOW_TEXT); const nodes=[]; while(walker.nextNode()) nodes.push(walker.currentNode);
  let firstMark=null;
  for(const n of nodes){ const f=fold(n.nodeValue); const hits=[]; ts.forEach(t=>{ let p=f.indexOf(t); while(p>=0){ hits.push([p,p+t.length]); p=f.indexOf(t,p+t.length); } });
    if(!hits.length) continue; hits.sort((a,b)=>a[0]-b[0]);
    const frag=document.createDocumentFragment(); let last=0;
    for(const [s,e] of hits){ if(s<last) continue; frag.append(n.nodeValue.slice(last,s)); const mk=document.createElement("mark"); mk.textContent=n.nodeValue.slice(s,e); frag.append(mk); if(!firstMark) firstMark=mk; last=e; }
    frag.append(n.nodeValue.slice(last)); n.replaceWith(frag); }
  doc.querySelectorAll("mark").forEach(mk=>{ const d=mk.closest("details"); if(d) d.open=true; });
  if(firstMark) setTimeout(()=>firstMark.scrollIntoView({behavior:"smooth",block:"center"}),80);
}

const ok3 = a => Array.isArray(a) && a.length===3 && a.every(x=>typeof x==="number" && isFinite(x));
function tdom(t){ const p=tc().by[t]; return p ? p.dom : t.slice(2,4); }
function tnom(t){ const p=tc().by[t]; if(p) return p.nom||t; const o=tov(t); return (o&&o.nom) || (BY[t]?BY[t].t:t); }
const texists = t => !!(tc().by[t] || BY[t]);

function tunite(t){ const p=tc().by[t]; if(p) return pmes(p).map(m=>m.unite).filter(Boolean).join(", "); return X.u[t]||""; }
function seuilsOf(t, sx, age){ age = String(age); if(age==="A" || +age>18) age = "18"; if(age==="18") return seuils0(t,sx,"18") || seuils0(t,sx,"A"); return seuils0(t,sx,age); }
function seuils0(t, sx, age){
  const p = tc().by[t];
  if(p){ const s = p.seuils && p.seuils[sx] && p.seuils[sx][age]; if(!s) return null; const ms = pmes(p), o = {};
    if(Array.isArray(s)){ if(ok3(s)) o[ms[0].k] = s; } else for(const m of ms) if(ok3(s[m.k])) o[m.k] = s[m.k];

  if(ov && ov.seuils){ const s = ov.seuils[sx] && ov.seuils[sx][age]; if(!s) return null; const o = {}; for(const k in s) if(ok3(s[k])) o[k] = s[k]; return Object.keys(o).length ? o : null; }
  return (X.s[t] && X.s[t][sx] && X.s[t][sx][age]) || null;

function mlabel(t, k){ const p=tc().by[t]; if(!p) return k; const m=pmes(p).find(x=>x.k===k); return m ? m.nom+(m.unite?" ("+m.unite+")":"") : k; }
function ascOf(t, k, th){ const p=tc().by[t]; if(p){ const m=pmes(p).find(x=>x.k===k); return ((m&&m.sens)||p.sens||"grand") !== "petit"; }
  return th[0]<th[2] || (th[0]===th[2] && /grand/.test(X.sens[t]||"")); }
const lvOne = (v, th, asc) => asc ? (v>=th[2]?4:v>=th[1]?3:v>=th[0]?2:1) : (v<=th[2]?4:v<=th[1]?3:v<=th[0]?2:1);
function niveau(t, sx, age, vals){ const S = seuilsOf(t, sx, age); if(!S || !vals) return null; let lv = 4;
  for(const k in S){ const v = parseN(vals[k]); if(v==null) return null; lv = Math.min(lv, lvOne(v, S[k], ascOf(t,k,S[k]))); }

const nf = x => String(Math.round(x*1000)/1000).replace(".",",");

function persoFor(d, n, sx, age){ return tc().per.filter(t=>t.dom===d && (t.lignes||[]).map(Number).includes(n) && seuilsOf(t.id, sx, age)); }
function lineT(sx, age, d, i){ const L = (X.g[gcode(sx,age,d)]||[])[i]; if(!L) return null; const per = persoFor(d, i+1, sx, age);

/* ---------- RADAR (SVG, couleurs résolues : sert aussi à l'image PNG) ---------- */
function geomR(n, kind){ return kind==="wide" ? {W:880,H:660,cx:440,cy:330,R:215,fs:17} : {W:600,H:600,cx:300,cy:300,R:224,fs:kind==="mini"?26:28}; }
function wrapLabel(t, max){ const w = t.split(" "), out = []; let cur = ""; for(const x of w){ if((cur+" "+x).trim().length>max && cur){ out.push(cur); cur = x; } else cur = (cur+" "+x).trim(); } if(cur) out.push(cur); return out.slice(0,4); }
function radarInner(d, o){
  const names = LIGNES[d], n = names.length, Gm = geomR(n, o.kind), A = i => -Math.PI/2 + i*2*Math.PI/n, g = o.g, v = o.v;
  const col = cssv("--"+d.toLowerCase()), ink = cssv("--ink"), mute = cssv("--mute"), line = cssv("--line"), panel = cssv("--panel"), fam = "Barlow, system-ui, sans-serif";
  const P = (i,x) => [Gm.cx+Gm.R*x/4*Math.cos(A(i)), Gm.cy+Gm.R*x/4*Math.sin(A(i))], f = x => x.toFixed(1);
  let s = `<rect x="0" y="0" width="${Gm.W}" height="${Gm.H}" fill="${o.bg||"transparent"}"/>`;
  for(let k=4;k>=1;k--) s += `<polygon points="${names.map((_,i)=>P(i,k).map(f).join(",")).join(" ")}" fill="${cssv("--n"+k+"s")}" stroke="${k===3?cssv("--n3"):line}" stroke-width="${k===3?3:1}"/>`;
  for(let k=1;k<=4;k++) s += `<text x="${Gm.cx+5}" y="${f(Gm.cy-Gm.R*k/4+15)}" font-size="${o.kind==="wide"?14:18}" font-weight="700" fill="${cssv("--n"+k)}" font-family="${fam}">${k}</text>`;
  for(let i=0;i<n;i++){ const gr = !g[i], [x2,y2] = P(i,4);
    s += `<line x1="${Gm.cx}" y1="${Gm.cy}" x2="${f(x2)}" y2="${f(y2)}" stroke="${gr?mute:line}" stroke-width="1.2" ${gr?'stroke-dasharray="4 5"':""}/>`;
    const a = A(i), lx = Gm.cx+(Gm.R+(o.kind==="wide"?22:30))*Math.cos(a), ly = Gm.cy+(Gm.R+(o.kind==="wide"?22:30))*Math.sin(a), ca = Math.cos(a);
    const anchor = Math.abs(ca)<0.25 ? "middle" : (ca>0?"start":"end"), on = i===o.sel && o.kind!=="mini";
    const L = o.kind==="wide" ? [(i+1)+" · "+wrapLabel(names[i],16)[0], ...wrapLabel(names[i],16).slice(1)] : [String(i+1)];
    s += `<text x="${f(lx)}" y="${f(ly-(L.length-1)*9.5+(Math.sin(a)>0.3?8:0)+(o.kind==="wide"?0:9))}" text-anchor="${anchor}" font-size="${Gm.fs}" font-weight="${on?700:500}" fill="${gr?mute:(on?col:ink)}" opacity="${gr?.55:1}" font-family="${fam}">${L.map((t,k)=>`<tspan x="${f(lx)}" dy="${k?19:0}">${esc(t)}</tspan>`).join("")}</text>`; }
  const poly = (vv, gg, st) => { const pts = []; for(let i=0;i<n;i++){ if(!gg[i]) continue; const x = vv[i]; if(x==null) continue; pts.push(P(i,x)); }
    if(pts.length>=2) s += `<${pts.length>2?"polygon":"polyline"} points="${pts.map(p=>p.map(f).join(",")).join(" ")}" ${st}/>`; };
  if(o.comp) poly(o.comp.v, o.comp.g, `fill="none" stroke="${mute}" stroke-width="2.6" stroke-dasharray="8 6"`);
  poly(v, g, `fill="${col}" fill-opacity="0.22" stroke="${col}" stroke-width="3.2" stroke-linejoin="round"`);
  for(let i=0;i<n;i++){ if(!g[i] || v[i]==null) continue; const [x,y] = P(i, v[i]);
    s += `<circle cx="${f(x)}" cy="${f(y)}" r="${o.kind==="mini"?8:(i===o.sel?11:8)}" fill="${cssv("--n"+Math.min(4,Math.max(1,Math.floor(v[i]))))}" stroke="${panel}" stroke-width="2.5"/>`; }
  return s;
}
function radarSVG(d, o){ const Gm = geomR(LIGNES[d].length, o.kind); return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${Gm.W} ${Gm.H}" ${o.id?`id="${o.id}"`:""} class="${o.kind==="mini"?"rmini":"rbig"}" role="img" aria-label="Radar ${esc(DOMN[d])}">${radarInner(d,o)}</svg>`; }
function radarData(j, b, d){ const g = X.g[gcode(j.sexe,ak(b),d)]||[]; return {g, v:g.map((_,i)=>b.v[d][i]??null)}; }
function compB(j, b){ if(UI.comp==="none") return null; const bs = sortB(j); if(UI.comp==="prev"){ const i = bs.findIndex(x=>x.id===b.id); return i>0 ? bs[i-1] : null; } return bs.find(x=>x.id===UI.comp && x.id!==b.id) || null; }
function radarOpts(j, b, d, kind, extra){ const r = radarData(j,b,d), cb = compB(j,b); return Object.assign({g:r.g, v:r.v, kind, comp: cb ? radarData(j,cb,d) : null}, extra||{}); }

  if(RO()) return;
  const kind = svg.viewBox.baseVal.width===880 ? "wide" : "narrow"; GEO = geomR(LIGNES[d].length, kind);
  const pv = (e, lock) => { const r = svg.getBoundingClientRect(), s = GEO.W/r.width, x = (e.clientX-r.left)*s - GEO.cx, y = (e.clientY-r.top)*s - GEO.cy, n = LIGNES[d].length, A = i => -Math.PI/2 + i*2*Math.PI/n;
    let best = lock, bd = 9; const ang = Math.atan2(y,x);

const GB = {jids:[], tests:null};
function gbPlan(j){ const b = lastB(j); return {sx:j.sexe, age:conseil(j) || (b?ak(b):10)}; }
function gbTests(){ const box = $("#gbt"); if(!box) return; const js = GB.jids.map(getP).filter(Boolean);

    if(bad.length){ msg.textContent = "Seuils dans le désordre : "+bad.slice(0,6).join(", ")+(bad.length>6?"…":"")+". Corrige avant d'enregistrer."; return; }
    if(part.length){ msg.textContent = "Barème incomplet (3 seuils nécessaires) : "+part.slice(0,6).join(", ")+(part.length>6?"…":"")+"."; return; }
    if(t.mode==="perso"){ const rec = {nom:t.nom.trim(), dom:t.dom, lignes:t.lignes, protocole:t.protocole, materiel:t.materiel, mesures:t.mesures, sens:t.sens, prio:t.prio, vid:t.vid, seuils:out};
      let id = t.id; if(id) GR.tests.edit(id, rec); else id = GR.tests.add(rec).id; TC = null; location.hash = "/test/"+id; return; }
    const patch = {}; if(t.protocole.trim()) patch.protocole = t.protocole; if(t.materiel!==(X.mat[t.id]||"")) patch.materiel = t.materiel; if(t.vid) patch.vid = t.vid;
    const same = ["F","G"].every(sx=>AGESA.every(a=>JSON.stringify(out[sx][a]||null)===JSON.stringify((X.s[t.id]&&X.s[t.id][sx]&&X.s[t.id][sx][a])||null)));
    if(!same) patch.seuils = out;
    GR.tests.reset(t.id); if(Object.keys(patch).length) GR.tests.edit(t.id, patch); TC = null; location.hash = "d/"+t.id; };
  const rs = $("#tereset"); if(rs) rs.onclick = ()=>{ if(!rs.dataset.ok){ rs.dataset.ok = 1; rs.textContent = "Toucher encore pour remettre l'original"; return; } GR.tests.reset(t.id); TC = null; location.hash = "d/"+t.id; };
  const dl = $("#tedel"); if(dl) dl.onclick = ()=>{ if(!dl.dataset.ok){ dl.dataset.ok = 1; dl.textContent = "Toucher encore pour supprimer"; return; } GR.tests.remove(t.id); TC = null; location.hash = "/mestests"; };
}

/* ---------- enrichissement des documents (grilles et fiches de tests) ---------- */
function enhanceGrid(x){ const mm = /^([FG])(\d\d)_(PP|GE|DE)$/.exec(x.c); if(!mm) return; const sx = mm[1], age = +mm[2], d = mm[3];
  document.querySelectorAll("#doc details").forEach(det=>{ const s = det.querySelector("summary").textContent; const k = /^Ligne (\d+) ·/.exec(s); if(!k || /non évaluée/.test(s)) return; const n = +k[1];
    const h4 = [...det.querySelectorAll("h4")].find(e=>/^Tests de la ligne/.test(e.textContent)); const tb = h4 && h4.nextElementSibling && h4.nextElementSibling.querySelector("tbody");
    if(tb){ tb.querySelectorAll("tr").forEach(tr=>{ const a = tr.querySelector('a.ref[href^="#d/T-"]'); if(!a) return; const t = a.getAttribute("href").split("/")[1]; const o = tov(t); if(!o) return;
        a.insertAdjacentHTML("afterend", ' <span class="bdg mod">modifié</span>'); if(o.seuils){ const tds = tr.querySelectorAll("td"); for(let lv=1;lv<=4;lv++) if(tds[lv]) tds[lv].textContent = btxt(t,sx,age,lv)||"–"; } });
      persoFor(d, n, sx, age).forEach(t=>tb.insertAdjacentHTML("beforeend", `<tr><td>${t.prio?"★ ":""}<a class="ref" href="#/test/${t.id}/b${sx}${age}">${esc(t.nom)}</a> <span class="bdg">mon test</span><br><small>${t.id} · ${esc(tunite(t.id))}</small></td>${[1,2,3,4].map(lv=>`<td>${esc(btxt(t.id,sx,age,lv))}</td>`).join("")}</tr>`)); }
    det.insertAdjacentHTML("beforeend", `<p class="xlp">${lineLinks(d, n-1, age)}${RO()?"":`<a class="xla" href="#/test-nouveau?l=${d}${n}">+ Mon test pour cette ligne</a>`}</p>`); });
}
function enhanceTest(x){ const t = x.c, o = tov(t);
  const acts = document.querySelector(".dochead .acts"); if(acts && !RO()) acts.insertAdjacentHTML("afterbegin", `<a class="ib" href="#/test-edit/${t}">Modifier ce test</a>`);
  tvideo(t).then(v=>{ if(v && acts && acts.isConnected) acts.insertAdjacentHTML("afterbegin", `<a class="ib" href="${esc(v)}" target="_blank" rel="noopener">▶ Vidéo</a>`); });
  if(!o) return;
  const h1 = document.querySelector(".dochead h1"); if(h1) h1.insertAdjacentHTML("beforeend", ' <span class="bdg mod">modifié</span>');
  const doc = $("#doc"); doc.insertAdjacentHTML("afterbegin", `<div class="att mine"><b>Ta version</b>${o.protocole?`<p>${esc(o.protocole).replace(/\n/g,"<br>")}</p>`:""}${o.materiel!=null&&o.materiel!==(X.mat[t]||"")?`<p><b>Matériel :</b> ${esc(o.materiel)}</p>`:""}${o.seuils?"<p>Barèmes modifiés (ci-dessous).</p>":""}${RO()?"":`<p class="tools"><a class="ib sm" href="#/test-edit/${t}">Modifier</a><button class="ib sm" type="button" id="treset">Remettre l'original</button></p>`}</div>`);
  const rs = $("#treset"); if(rs) rs.onclick = ()=>{ if(!rs.dataset.ok){ rs.dataset.ok = 1; rs.textContent = "Toucher encore pour remettre l'original"; return; } GR.tests.reset(t); TC = null; route(); };
  if(o.seuils) doc.querySelectorAll("details").forEach(det=>{ const s = det.querySelector("summary").textContent; const k = /^Barèmes · (filles|garçons)/.exec(s); if(!k) return; const sx = k[1]==="filles"?"F":"G";
    const tb = det.querySelector("tbody"); if(!tb) return; det.querySelector("summary").textContent = s+" (modifiés)";
    tb.innerHTML = ageRows(t,sx).map(a=>`<tr id="b${sx}${a}"><td><b>${agL(a)}</b></td>${[1,2,3,4].map(lv=>`<td>${esc(btxt(t,sx,a,lv))}</td>`).join("")}</tr>`).join("") || `<tr><td colspan="5">Aucun barème.</td></tr>`; });
}

/* ---------- sauvegarde / restauration (une seule pour tout GRÜN, anciens fichiers acceptés) ---------- */
function importJoueursAnciens(list, radar){ let n = 0;
  for(const x0 of list||[]){ if(!x0 || !x0.nom || !Array.isArray(x0.bilans)) continue; const x = JSON.parse(JSON.stringify(x0)); x.bilans = x.bilans.map(b=>{ b.id = b.id||uid(); return normB(b); });
    const ex = getP(x.id) || GR.joueurs.all({archives:true}).find(y=>y.nom===x.nom && (y.naissance||"")===(x.naissance||""));
    if(!ex){ const j = {...x, id:x.id||uid(), sexe:x.sexe==="F"?"F":"G"}; delete j.maj; SELF++; try{ GR.joueurs.save(j); } finally { SELF--; } n++; continue; }
    const j = getP(ex.id); for(const b of x.bilans){ const k = j.bilans.findIndex(y=>y.id===b.id); if(k>=0){ if(!radar) j.bilans[k] = b; else j.bilans[k].v = b.v; } else if(!j.bilans.some(y=>y.date===b.date && y.age===b.age && radar)) j.bilans.push(b); }
    if(!radar) for(const k of ["sexe","naissance","groupe","notes"]) if(x[k]!=null) j[k] = x[k]; jsave(j); n++; }
  return n; }
async function exportData(){ await GR.telecharger(GR.exportAll(), "GRUN_sauvegarde_"+today()+".json"); const m = $("#dmsg"); if(m) m.textContent = "Sauvegarde de tout GRÜN prête (joueurs, groupes, tests, banque, séances…)."; }
async function importData(e){
  const f = e.target.files&&e.target.files[0]; e.target.value = ""; if(!f) return; const m = $("#dmsg");
  try{ const d = JSON.parse(await f.text());
    if(d && d.app==="GRUN" && d.data){ GR.importAll(d); P = Object.assign(P, load()); TC = null; route(); $("#dmsg").textContent = "Sauvegarde GRÜN restaurée (fusionnée avec les données de l'appareil)."; return; }
    if(d && d.format==="grilles-docs"){ P.fav = [...new Set([...(d.fav||[]),...P.fav])]; P.notes = Object.assign({}, P.notes, d.notes||{}); save(); const n = importJoueursAnciens(d.joueurs, false); route(); $("#dmsg").textContent = `Ancienne sauvegarde Grilles restaurée : favoris, notes et ${n} joueur${n>1?"s":""}.`; return; }
    const rl = d && (d.format==="profil-radar" ? d.joueurs : Array.isArray(d) ? d : null);
    if(rl){ const n = importJoueursAnciens(rl, true); route(); $("#dmsg").textContent = `Sauvegarde Profil radar restaurée : ${n} joueur${n>1?"s":""}.`; return; }
    throw 0; }
  catch(err){ m.textContent = "Fichier non reconnu : choisis une sauvegarde GRÜN, Grilles_… ou Profils_radar_….json."; }
}
