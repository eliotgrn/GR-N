<script>
"use strict";
/* ===== MiniPDF : vrai fichier PDF fabriqué sur l'appareil, sans bibliothèque (Helvetica, A4) ===== */
const MiniPDF = (()=>{
  const CP = {"€":128,"‚":130,"ƒ":131,"„":132,"…":133,"†":134,"‡":135,"ˆ":136,"‰":137,"Š":138,"‹":139,"Œ":140,"Ž":142,"‘":145,"’":146,"“":147,"”":148,"•":149,"–":150,"—":151,"˜":152,"™":153,"š":154,"›":155,"œ":156,"ž":158,"Ÿ":159};
  const SUB = {"→":"->","←":"<-","≤":"<=","≥":">=","✓":"OK","★":"*","ⓘ":"i","✎":""," ":" "," ":" ","‑":"-","≈":"~","×":"×","…":"…","Δ":"D","°":"°"};
  function enc(s){ let o=""; for(const ch of String(s??"")){ let c=ch; if(c.charCodeAt(0)>255 && !(c in CP) && SUB[c]!=null) c=SUB[c]; for(const k of c){ const n=k.charCodeAt(0); if(n<256) o+=k; else if(CP[k]) o+=String.fromCharCode(CP[k]); else o+="?"; } } return o.replace(/\\/g,"\\\\").replace(/\(/g,"\\(").replace(/\)/g,"\\)"); }
  let ctx=null;
  function width(s,size,bold){ if(!ctx){ ctx=document.createElement("canvas").getContext("2d"); } ctx.font=(bold?"bold ":"")+"100px Helvetica, Arial, sans-serif"; return ctx.measureText(String(s)).width/100*size*1.02; }
  function hex(c){ const m=/^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(c||"#000000"); return m?[1,2,3].map(i=>(parseInt(m[i],16)/255).toFixed(3)).join(" "):"0 0 0"; }
  class Doc{
    constructor(opt={}){ this.W=opt.landscape?842:595; this.H=opt.landscape?595:842; this.M=opt.margin||36; this.pages=[]; this.addPage(); }
    addPage(){ this.cur=[]; this.pages.push(this.cur); this.y=this.M; return this; }
    text(x,y,s,o={}){ const sz=o.size||10; this.cur.push(`BT /${o.bold?"F2":"F1"} ${sz} Tf ${hex(o.color)} rg ${x.toFixed(2)} ${(this.H-y-sz*0.8).toFixed(2)} Td (${enc(s)}) Tj ET`); }
    rect(x,y,w,h,o={}){ const c=[]; if(o.fill) c.push(hex(o.fill)+" rg"); if(o.stroke) c.push(hex(o.stroke)+" RG "+(o.lw||0.6)+" w"); c.push(`${x.toFixed(2)} ${(this.H-y-h).toFixed(2)} ${w.toFixed(2)} ${h.toFixed(2)} re ${o.fill&&o.stroke?"B":o.fill?"f":"S"}`); this.cur.push(c.join(" ")); }
    line(x1,y1,x2,y2,o={}){ this.cur.push(`${hex(o.color||"#C8CDD4")} RG ${o.lw||0.6} w ${x1.toFixed(2)} ${(this.H-y1).toFixed(2)} m ${x2.toFixed(2)} ${(this.H-y2).toFixed(2)} l S`); }
    wrap(s,size,maxw,bold){ const out=[]; for(const para of String(s??"").split("\n")){ let line=""; for(const w of para.split(/\s+/)){ if(!w) continue; const t=line?line+" "+w:w; if(width(t,size,bold)<=maxw||!line) line=t; else { out.push(line); line=w; } } out.push(line); } return out; }
    need(h){ if(this.y+h>this.H-this.M) { this.addPage(); return true; } return false; }
    /* paragraphe avec retour à la ligne et saut de page automatique */
    para(s,o={}){ const sz=o.size||10, lh=sz*(o.lh||1.3), x=o.x??this.M, w=o.w??(this.W-this.M-x); for(const l of this.wrap(s,sz,w,o.bold)){ this.need(lh); this.text(x,this.y,l,o); this.y+=lh; } this.y+=o.after??2; }
    out(){
      const objs=[]; const add=s=>{ objs.push(s); return objs.length; };
      add("<< /Type /Catalog /Pages 2 0 R >>"); add("PAGES");
      add("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>");
      add("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>");
      const kids=[];
      for(const p of this.pages){ const st=p.join("\n"); const c=add(`<< /Length ${st.length} >>\nstream\n${st}\nendstream`); kids.push(add(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${this.W} ${this.H}] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ${c} 0 R >>`)); }
      objs[1]=`<< /Type /Pages /Kids [${kids.map(k=>k+" 0 R").join(" ")}] /Count ${kids.length} >>`;
      let s="%PDF-1.4\n%\xE2\xE3\xCF\xD3\n"; const off=[];
      objs.forEach((o,i)=>{ off.push(s.length); s+=`${i+1} 0 obj\n${o}\nendobj\n`; });
      const x=s.length; s+=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`+off.map(o=>String(o).padStart(10,"0")+" 00000 n \n").join("")+`trailer\n<< /Size ${objs.length+1} /Root 1 0 R >>\nstartxref\n${x}\n%%EOF`;
      const b=new Uint8Array(s.length); for(let i=0;i<s.length;i++) b[i]=s.charCodeAt(i)&255; return new Blob([b],{type:"application/pdf"});
    }
  }
  /* remise du fichier : feuille de partage (Imprimer, Enregistrer dans Fichiers…) sinon téléchargement */
  async function deliver(blob,name){
    const file=new File([blob],name,{type:"application/pdf"});
    try{ if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:name}); return "share"; } }catch(e){ if(e && e.name==="AbortError") return "abort"; }
    const u=URL.createObjectURL(blob), a=document.createElement("a"); a.href=u; a.download=name; a.rel="noopener"; document.body.appendChild(a); a.click(); a.remove();
    return "download";
  }
  return {Doc, deliver, width};
})();

/* ===== PARTAGE PAR LIEN : l'objet voyage dans l'adresse (#x/…), compressé quand l'appareil le permet ===== */
const Partage = (()=>{
  const toB64=u8=>{ let s=""; for(let i=0;i<u8.length;i+=0x8000) s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000)); return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); };
  const fromB64=s=>{ const b=atob(s.replace(/-/g,"+").replace(/_/g,"/")); const u=new Uint8Array(b.length); for(let i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u; };
  async function pipe(u8,T){ const st=new Blob([u8]).stream().pipeThrough(T); return new Uint8Array(await new Response(st).arrayBuffer()); }
  async function enc(obj){
    const raw=new TextEncoder().encode(JSON.stringify(obj));
    try{ if(window.CompressionStream) return "z"+toB64(await pipe(raw,new CompressionStream("deflate-raw"))); }catch(e){}
    return "p"+toB64(raw);
  }
  async function dec(code){
    const k=code[0], u=fromB64(code.slice(1));
    const raw = k==="z" ? await pipe(u,new DecompressionStream("deflate-raw")) : u;
    return JSON.parse(new TextDecoder().decode(raw));
  }
  async function envoyer(obj,titre,texte,openSheet,esc){
    const url=location.origin+location.pathname+"#x/"+await enc(obj);
    try{ if(navigator.share){ await navigator.share({title:titre,text:texte,url}); return; } }catch(e){ if(e&&e.name==="AbortError") return; }
    let ok=false; try{ await navigator.clipboard.writeText(url); ok=true; }catch(e){}
    openSheet(`<div class="shh"><b>${esc(titre)}</b><button class="ib" data-close type="button">×</button></div><p class="msg">${ok?"Lien copié. ":""}Colle ce lien dans un message : il ouvre directement la même chose sur le téléphone de la personne.</p><textarea class="srch" rows="5" readonly>${esc(url)}</textarea>`);
  }
  return {enc,dec,envoyer};
})();

/* ===== CREATE MY SÉANCE (GRÜN) : l'appli construit la structure, propose pour chaque case les exos de la banque, le coach choisit =====
   Poupée russe : dans Create my prog (relais), contient Create my warm-up (relais).
   Données propres : seances_v1 {seances:[Seance], modeles:[Modele], mat, lieu, relais, relaisProg, run}. Joueurs, groupes, journal, banque : GRUN.* */
function nomCourt(t,n=60){ t=String(t||"").trim(); if(t.length<=n) return t; const c=t.slice(0,n).replace(/\s+\S*$/,""); return c.replace(/[\s,;:·–-]+$/,"")+"…"; }
const SK="seances_v1", PK="programmation_v1", CK="programmation_cache_v1";
let DATA={ex:[],fams:[],mat:[]}, EX={}, FAM={}, HIDE=new Set();
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>GRUN.uid();
const todayIso=()=>GRUN.today();
const frD=s=>s?String(s).slice(0,10).split("-").reverse().join("/"):"";
const norm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");

function loadST(){ const s=GRUN.load(SK,{})||{}; if(!Array.isArray(s.seances)) s.seances=[]; if(!Array.isArray(s.modeles)) s.modeles=[]; s.lieu||="court";
  /* séances anciennes ou importées incomplètes : champs minimaux (sinon page blanche ou « undefined min ») */
  s.seances=s.seances.filter(x=>x&&x.id); s.seances.forEach(x=>{ if(!Array.isArray(x.lignes)) x.lignes=[]; if(!Array.isArray(x.joueurs)) x.joueurs=[]; x.type||="PPI"; if(!(+x.duree>0)) x.duree=60; x.phase||="G"; if(x.boxes&&!Array.isArray(x.boxes)) x.boxes=null; if(Array.isArray(x.boxes)&&!x.boxes.length) x.boxes=null; (x.boxes||[]).forEach(b=>{ if(!Array.isArray(b.ex)) b.ex=[]; if(!Array.isArray(b.L)) b.L=[]; }); });
  return s; }

 GE:["Service à plat","Service slicé","Service lifté","Coup droit lifté","Coup droit à plat","Coup droit slicé","Revers lifté","Revers à plat","Revers slicé","Volée de coup droit","Volée de revers","Smash","Amortie et touché de balle"],

/* ---------- banque (GRUN.banque : base + exos perso + modifications ; les masqués ne sont pas proposés) ---------- */
function kOf(f){ const m=/^5\.(\d+)\.(\d+)/.exec(f||""); if(!m) return "jeu"; const a=+m[1], b=+m[2];
  if(a===1) return b<=3?"force":b===4?"halte":b<=7?"gain":b<=10?"puis":b===11?"vit":b<=13?"cod":b===14?"aero":b===15?"rsa":b<=18?"coord":b<=20?"equi":b<=22?"mob":b===23?"etd":"ets";
  if(a===2) return b===1?"ech":b<=4?"prev":b===5?"recup":b<=7?"jeuph":b===8?"visu":"routine";
  if(a===3) return "tech"; if(a===4) return "depl"; if(a===5) return b===6?"match":"jeu"; if(a===6) return "ech"; return "jeu"; }
function normEx(e){ if(!Array.isArray(e.L)) e.L=e.L?[e.L]:[]; if(!Array.isArray(e.m)) e.m=[]; e.a=+e.a||4; e.v=+e.v||2; if(e.ax==null) e.ax=18; e.k||=kOf(e.f); e.n||="Exo sans nom"; e.dom||=(e.L[0]||"PP").slice(0,2); e.ma??=""; return e; }
async function loadBanque(){
  const B=await GRUN.banque.load();
  HIDE=new Set(B.hide||[]); EX={}; for(const e of B.ex){ normEx(e); EX[e.id]=e; }
  let mat=B.mat, fams=B.fams;
  if(!mat||!fams){ try{ const d=await (await fetch("data-seances.json")).json(); mat||=d.mat; fams||=d.fams; }catch(e){} }
  DATA={ex:B.ex,fams:fams||[],mat:mat||[]}; FAM={}; for(const f of DATA.fams) FAM[f.c]=f; LFAM={};
}
function exoOf(x){ if(!x) return null; const e=EX[x.id]; if(e) return e; if(x.snap) return normEx({...x.snap,id:x.id}); return null; }
const tx=e=>{ if(e._t==null){ e._t=norm(e.n+" "+(e.s||"")+" "+(e.ob||"")); e._td=norm(e.n+" "+(e.de||"")); e._tp=norm(e.n+" "+(e.s||"")+" "+(FAM[e.f]?.t||"")); } return e; };

/* ---------- joueurs, groupes (fiche unique GRUN.joueurs) ---------- */
const ageOf=j=>{ const a=j?GRUN.ageCiv(j.naissance):null; return a==null?null:Math.min(18,a); };   // GRÜN = 4-18 ans : au-delà, 18 ans
const ageTxt=j=>{ const a=ageOf(j); return a==null?"":" · "+a+" ans"; };
function joueursDe(s){ if(s.gid&&GRUN.groupes.get(s.gid)) return GRUN.groupes.joueurs(s.gid); return (s.joueurs||[]).map(id=>GRUN.joueurs.get(id)).filter(Boolean); }
function concerne(s,jid){ return (s.joueurs||[]).includes(jid) || (s.gid && (GRUN.groupes.get(s.gid)?.jids||[]).includes(jid)); }
function faiblesDe(j){ const F=new Set((j.prio||[]).filter(isLine)); const b=[...(j.bilans||[])].sort((a,b)=>a.date<b.date?1:-1)[0];
  if(b) for(const d of ["PP","GE","DE"]) (b.v?.[d]||[]).forEach((v,i)=>{ if(v&&v<=2) F.add(d+(i+1)); }); return [...F]; }
function croisDe(j){ if(j.croissance) return true; try{ const m=GRUN.maturite(j); return !!(m&&/autour/.test(m.statut)); }catch(e){ return false; } }
function whoTxt(s,c){ const J=joueursDe(s), g=s.gid&&GRUN.groupes.get(s.gid);
  if(g) return "Groupe "+esc(g.nom)+" ("+J.length+")"+(s.libre?.extra?" + "+s.libre.extra:"");
  return J.length?esc(J.map(j=>j.nom).join(", "))+(s.libre?.extra?" + "+s.libre.extra:""):c.n+" joueur"+(c.n>1?"s":"")+", "+c.al; }

/* ---------- contexte de la séance ---------- */
const STOP=new Set("avant apres entre puis chaque toujours selon leurs notre votre comme quand votre seance travail sur les des dans avec sans pour plus moins tres bien".split(" "));
function ctxOf(s){
  const sel=joueursDe(s), L=s.libre||{}; let age, niv=0, zones=new Set(), crois=false, faibles=new Set(), n, sexe="G";
  if(sel.length){
    const ages=sel.map(ageOf).filter(a=>a!=null); age=ages.length?Math.min(...ages):(+L.age||13);
    niv=Math.max(0,...sel.map(j=>niveauDe(j.classement||"NC",ageOf(j)||13)));
    for(const j of sel){ (j.zones||[]).forEach(z=>zones.add(z)); if(croisDe(j)) crois=true; faiblesDe(j).forEach(l=>faibles.add(l)); }
    n=sel.length+(L.extra||0); sexe=sel.filter(j=>j.sexe==="F").length*2>=sel.length?"F":"G";
  } else { age=+L.age||13; niv=+L.niv||0; n=L.n||1; (L.zones||[]).forEach(z=>zones.add(z)); crois=!!L.crois; sexe=L.sexe==="F"?"F":"G"; }
  age=Math.max(4,Math.min(18,age));   // GRÜN = 4-18 ans (ancien libre.adulte : 18 ans)
  const words=norm(s.theme).split(/[^a-z0-9]+/).filter(w=>w.length>4&&!STOP.has(w));
  return {age,al:age+" ans",niv,zones:[...zones],crois,faibles:[...faibles],n,sexe,mat:new Set(s.mat||[]),lieu:s.lieu,phase:s.phase,charge:s.charge,words,lignes:s.lignes||[],done:doneMap(s,sel)};
}
/* ce que les joueurs ont déjà fait (séances faites) : par ligne, niveau maximal atteint */
function doneMap(s,sel){
  const jids=new Set(sel.map(j=>j.id)), out={L:{},ids:new Set()}; if(!jids.size&&!s.gid) return out;
  for(const x of ST.seances){ if(x.id===s.id||!x.faite) continue;
    const ok=(s.gid&&x.gid===s.gid)||joueursDe(x).some(j=>jids.has(j.id)); if(!ok) continue;
    const ids=x.faite.ex||(x.boxes||[]).flatMap(b=>b.ex.filter(Boolean).map(y=>y.id));
    for(const id of ids){ const e=EX[id]; if(!e) continue; out.ids.add(id); for(const l of e.L) out.L[l]=Math.max(out.L[l]||0,e.v); } }
  return out;
}

/* ---------- classement des exos pour une case ---------- */
function okEx(e,c){
  if((e.a||4)>c.age||(e.ax&&e.ax<c.age)) return false;
  if(e.c&&c.lieu!=="court") return false;
  if(e.e&&c.lieu==="salle") return false;
  for(const m of e.m||[]) if(!c.mat.has(m)) return false;
  return true;
}
const KWC={};
const kwOf=box=>typeof box.kw==="string"&&box.kw?(KWC[box.kw]||=new RegExp(box.kw)):null;
function heavy(e){ tx(e); return e.f==="5.1.4"||((e.f==="5.1.8"||e.f==="5.1.9")&&e.v>=3)||/charge|lest|contrebas|profondeur/.test(e._t); }
function upLevel(e,box,c){ const lines=box&&box.L?.length?e.L.filter(l=>box.L.includes(l)):e.L; let md=0; for(const l of lines) md=Math.max(md,c.done.L[l]||0); return md; }
function scoreEx(e,box,c,used){
  tx(e); let s=0; const t=e._t;
  if(box.L?.length&&e.L.some(l=>box.L.includes(l))) s+=6;
  if(box.f?.includes(e.f)) s+=3-Math.min(2,box.f.indexOf(e.f)*0.6);
  const kw=kwOf(box); if(kw&&kw.test(t)) s+=3;
  const tv=c.age<=9?1:c.age<=11?2:c.age<=14?2.5:3.2+(c.niv>=2?0.4:0);
  s-=Math.abs(e.v-tv)*1.2;
  if(e.a<=c.age-7&&e.v<=1) s-=1.5;
  const fatig=/force|halte|puis|rsa|aero/.test(e.k);
  if((c.phase==="P"||c.phase==="C")&&fatig&&e.v>=3) s-=1.5;
  if((c.phase==="R0"||c.phase==="R")&&e.v>=3) s-=1.5;
  if(box.low&&e.v>=3) s-=2;
  if(c.crois&&heavy(e)) s-=4;
  if(!box.prev) for(const z of c.zones) if(ZR[z]?.test(e._td)) s-=5;
  if(box.prev) for(const z of c.zones) if(ZPREV[z]?.test(e._tp)) s+=4;
  if(c.faibles.length&&e.L.some(l=>c.faibles.includes(l))) s+=1.5;
  let w=0; for(const x of c.words) if(t.includes(x)) w++; s+=Math.min(4,w*1.2);
  const md=upLevel(e,box,c); if(md){ if(e.v===md+1) s+=3; else if(e.v<md) s-=1.5; }
  if(c.done.ids.has(e.id)) s-=1;
  if(e.perso) s+=0.5;
  if(used.has(e.id)) s-=3;
  return s;
}
function pool(box,c,used){
  const out=[];
  for(const e of DATA.ex){
    if(HIDE.has(e.id)) continue;
    const inF=box.f?.includes(e.f), inL=box.L?.length&&e.L.some(l=>box.L.includes(l));
    if(!inF&&!inL) continue;
    if(box.dom&&!box.dom.includes(e.dom)) continue;
    if(!okEx(e,c)) continue;
    out.push({e,s:scoreEx(e,box,c,used)});
  }
  return out.sort((a,b)=>b.s-a.s);
}
/* exo inadapté (âge, croissance) → message ; remplaçant = meilleur exo de la case, même sous-famille d'abord */
function warnEx(e,c){ if(!e) return null; if((e.a||4)>c.age) return "prévu dès "+e.a+" ans"; if(e.ax&&e.ax<c.age) return "prévu jusqu'à "+e.ax+" ans"; if(c.crois&&heavy(e)) return "déconseillé pendant le pic de croissance"; return null; }
function altFor(e,box,c,used){ const P=pool(box,c,used).filter(p=>p.e.id!==e.id&&!warnEx(p.e,c)); return (P.find(p=>p.e.s===e.s)||P[0])?.e||null; }

/* ---------- familles d'une ligne ---------- */
let LFAM={};
function famsOfLine(l){ if(LFAM[l]) return LFAM[l]; const c={}; for(const e of DATA.ex) if(e.L.includes(l)) c[e.f]=(c[e.f]||0)+1; return LFAM[l]=Object.entries(c).filter(([,n])=>n>=4).map(([f])=>f); }

/* ---------- modèles de structure (trame d'échauffement : 2.14.1 et 2.14.3 ; ordre des contenus : documents « séances types ») ---------- */
function box(nom,part,o){ return {id:uid(),nom,part,min:0,ex:[],at:null,...o}; }
function wuMinutes(s,c){
  const D=+s.duree||60, L=s.lignes||[], tennis=/TI|TC|PM/.test(s.type);
  let w=c.age<=6?8:c.age<=9?12:c.age<=12?15:c.age<=15?18:20;
  if(L.some(l=>/^PP(4|5|6|7)$/.test(l))||/vitesse|explosi|saut|pliom|test|bilan/.test(norm(s.theme))) w+=4;   // allonger avant la vitesse, l'explosif, les sauts, les tests
  else if(L.length&&L.every(l=>l==="PP8")) w-=3;                                                             // raccourcir avant l'aérobie continu
  if(tennis) w=Math.round(w*0.85);
  return Math.max(5,Math.min(w,Math.round(D*0.33)));
}
function structure(s){
  const c=ctxOf(s), D=+s.duree||60, T=s.type, tennis=T==="TI"||T==="TC"||T==="PM";
  const L=s.lignes||[], PPL=L.filter(l=>/^(PP|DE)/.test(l)), GEL=L.filter(l=>/^GE/.test(l)), DEL=L.filter(l=>/^DE/.test(l));
  const boxes=[];
  const wT=wuMinutes(s,c);
  boxes.push(box("Mise en route","E",{f:["5.6.1","5.2.1","5.2.6"],kw:"trot|marche|course|footing|navette|mise en route|jumping|corde|poursuite",low:1}));
  boxes.push(box("Mobilité","E",{f:["5.6.2","5.1.21","5.1.22","5.1.23"],low:1}));
  boxes.push(box("Activation et prévention","E",{f:["5.6.3","5.2.2","5.2.3","5.2.4","5.1.5","5.2.9"],prev:1,low:1}));
  boxes.push(box("Gammes et vitesse","E",{f:["5.6.4","5.6.6","5.2.1","5.1.16","5.1.11","5.4.1"],kw:"gamme|montee|talons|pas chasse|skipping|depart|griffe|rythme",low:1}));
  const specL=tennis?[...GEL,...DEL]:PPL;
  boxes.push(box("Spécifique au thème","E",tennis?{f:["5.6.5","5.3.7","5.3.14","5.3.15","5.4.1"],L:specL,low:1}:{f:specL.flatMap(famsOfLine),L:specL,low:1}));
  const W=[0.2,0.25,0.2,0.2,0.15]; let acc=0; boxes.forEach((b,i)=>{ b.min=i<4?Math.max(1,Math.round(wT*W[i])):0; acc+=b.min; }); boxes[4].min=Math.max(1,wT-acc);
  const nC=D<=40?2:D<=60?3:D<=80?4:5, corps=[];
  if(T==="PPI"||T==="PPC"){
    for(const l of PPL) corps.push(box(lineName(l),"C",{L:[l],f:famsOfLine(l)}));
    for(const x of ["PP3","prev","PP11","PP10","PP12"]){ if(corps.length>=nC) break; if(x==="prev"){ if(c.zones.length) corps.push(box("Prévention ciblée","C",{f:["5.2.2","5.2.3","5.2.4"],prev:1})); continue; } if(!PPL.includes(x)) corps.push(box(lineName(x),"C",{L:[x],f:famsOfLine(x)})); }
    if(T==="PPC"&&corps.length) corps[corps.length-1].at={n:Math.min(4,Math.max(2,Math.ceil((c.n||4)/3)))};
  } else if(T==="TI"){
    const g=GEL[0]||"GE4", d=DEL[0]||"DE7";
    corps.push(box("Éducatif du geste : "+lineName(g),"C",{L:[g],f:famsOfLine(g).filter(f=>f.startsWith("5.3")),dom:["GE"]}));
    corps.push(box("Appuis et déplacement : "+lineName(d),"C",{L:[d],f:["5.4.1","5.4.2"],dom:["DE","GE","PP"]}));
    corps.push(box("Répétition en situation : "+lineName(g),"C",{L:[g],f:["5.3.5","5.3.6","5.3.7","5.3.8","5.5.2"],dom:["GE","JEU"]}));
    if(GEL[1]) corps.push(box("Éducatif du geste : "+lineName(GEL[1]),"C",{L:[GEL[1]],f:famsOfLine(GEL[1]).filter(f=>f.startsWith("5.3")),dom:["GE"]}));
    corps.push(box("Jeu à thème","C",{L:GEL.length?GEL:[g],f:["5.5.1","5.5.2","5.5.5","5.5.8"],dom:["JEU"]}));
  } else if(T==="TC"){
    const g=GEL[0]||"GE4";
    corps.push(box("Exercice technique : "+lineName(g),"C",{L:[g],f:famsOfLine(g).filter(f=>f.startsWith("5.3")),dom:["GE"]}));
    corps.push(box("Situation tactique","C",{L:GEL,f:["5.5.5","5.5.1","5.5.2"],dom:["JEU"]}));
    corps.push(box("Jeu à thème, forme de match","C",{L:GEL,f:["5.5.6","5.5.4"],dom:["JEU"]}));
    corps.push(box("Physique et technique intégrés","C",{L:[...GEL,...DEL],f:["5.5.3"],dom:["JEU"]}));
    if(nC>=5) corps.push(box("Double","C",{f:["5.5.4"],dom:["JEU"]}));
  } else {
    corps.push(box("Routine et concentration","C",{f:["5.5.7","5.2.8"],kw:"routine|respir|concentr|attention|focal"}));
    corps.push(box("Situation mentale sur le court","C",{f:["5.5.7"]}));
    corps.push(box("Jeu sous pression","C",{f:["5.5.6","5.5.7"],kw:"pression|score|enjeu|decisif|tie"}));
    corps.push(box("Perception et décision","C",{f:["5.5.1","5.2.8"]}));
  }
  const C2=corps.slice(0,nC);
  const fT=D<=45?6:D<=75?8:10, fin=[box("Récupération active","F",{f:["5.2.5"],low:1}),box("Étirements et mobilité","F",{f:["5.1.24","5.1.21","5.1.22"],low:1})];
  if(c.zones.length||T==="PPI"||T==="PPC") fin.push(box("Prévention","F",{f:["5.2.2","5.2.3","5.2.4"],prev:1,low:1}));
  fin.forEach((b,i)=>b.min=Math.floor(fT/fin.length)+(i<fT%fin.length?1:0));
  const cT=Math.max(10,D-wT-fT); C2.forEach((b,i)=>b.min=Math.floor(cT/C2.length)+(i<cT%C2.length?1:0));
  return [...boxes,...C2,...fin];
}
/* pré-remplissage : chaque case vide reçoit le meilleur exo classé (2 si la case dure 16 min ou plus), dosage selon l'âge */
function autoFill(s,c){
  c||=ctxOf(s); const used=new Set(s.boxes.flatMap(b=>b.ex.filter(Boolean).map(x=>x.id))); let n=0;
  for(const B of s.boxes){
    if(B.part==="E"&&s.wmode==="routine"&&s.warmup) continue;
    if(B.at){ for(let i=0;i<B.at.n;i++){ if(B.ex[i]) continue; const p=pool(B,c,used).find(p=>!used.has(p.e.id)); if(!p) break; B.ex[i]={id:p.e.id,d:dose(p.e,c)}; used.add(p.e.id); n++; } continue; }
    const want=B.part==="C"&&B.min>=16?2:1;
    while(B.ex.length<want){ const p=pool(B,c,used).find(p=>!used.has(p.e.id)); if(!p) break; B.ex.push({id:p.e.id,d:dose(p.e,c)}); used.add(p.e.id); n++; }
  }
  return n;
}

/* ---------- dosage proposé (âge, phase, charge) ---------- */
function dose(e,c){
  if(e.dos) return e.dos;
  if(String(e.f||"").startsWith("5.6")||(e.w&&e.k==="jeu")) return (e.w?.dur?e.w.dur:3)+" min";
  const a=c.age, ph=c.phase, light=ph==="P"||ph==="C"||ph==="R"||ph==="R0"||/faible|legere|basse|^1$/.test(norm(c.charge)), y=a<=10, m=a<=12;
  const D={
    force: y?"2 × 8 à 10, geste contrôlé, récup 1 min":m?"3 × 8 à 10, récup 1 min":a<=15?"3 à 4 × 6 à 8, récup 1 min 30":"4 × 4 à 6, récup 2 à 3 min",
    halte: a<=12?"3 × 5 au bâton, technique seule":a<=15?"4 × 3, charge légère, récup 2 min":"5 × 2 à 3, récup 2 à 3 min",
    gain: y?"3 × 15 à 20 s, récup 30 s":"3 × 30 à 45 s, récup 30 s",
    puis: y?"3 × 5, ludique, récup complète":a<=14?"3 × 5 à 6, récup 1 min 30":"4 × 4 à 6, récup complète 2 min",
    vit: y?"6 sprints de 5 à 10 m, retour en marchant":"6 à 8 sprints de 5 à 20 m, récup 1 min",
    cod:"6 à 8 passages de 5 à 8 s, récup 45 s à 1 min",
    aero: y?"10 à 15 min en jouant":m?"15 à 20 min continu ou 2 × 8 min":"20 à 30 min continu ou 3 × 8 min",
    rsa: y?"2 blocs de 3 à 4 min, récup 3 min":"2 à 3 blocs de 5 à 6 min, récup 3 min",
    coord:"4 à 6 passages, qualité avant vitesse", equi:"3 × 30 s par jambe", mob:"2 × 8 à 10 répétitions lentes", etd:"1 × 8 à 10 par côté", ets:"2 × 20 à 30 s par zone",
    ech:"2 à 4 min", prev:"2 × 10 à 12, lent", recup:"5 à 8 min", jeuph:"8 à 12 min", visu:"6 à 8 min", routine:"1 tour complet",
    tech: y?"3 blocs de 10 balles, récup 1 min":"3 à 4 blocs de 12 à 15 balles, récup 1 min",
    depl:"4 à 6 passages de 20 à 30 s, récup 40 s", jeu:"2 à 3 manches de 6 à 8 min", match:"1 set court ou 2 × 10 min"
  };
  let t=D[e.k]||"À régler";
  if(light&&/force|halte|puis|aero|rsa|tech|jeu/.test(e.k)) t+=" · volume réduit d'un tiers";
  return t;
}
/* un cran de plus : une série (ou un passage, un bloc) de plus ; sinon +20 % de temps d'effort */
function bumpDose(d){
  if(!d) return "+1 série"; let done=false;
  let t=d.replace(/(\d+)(\s*(?:à\s*(\d+)\s*)?)×/,(m,a,mid,b)=>{ done=true; return b?(+a+1)+" à "+(+b+1)+" ×":(+a+1)+mid+"×"; });
  if(!done) t=d.replace(/(\d+)(\s*(?:à\s*(\d+)\s*)?)(sprints|passages|blocs|manches|tours|séries|lancers|répétitions)/,(m,a,mid,b,w)=>{ done=true; return b?(+a+1)+" à "+(+b+1)+" "+w:(+a+1)+mid+w; });
  if(!done){ const [p,...r]=d.split(/(?=récup)/); const q=p.replace(/(\d+)(\s*)(s|min)\b/,(m,a,sp,u)=>{ done=true; return Math.max(+a+1,Math.round(+a*1.2))+sp+u; }); t=[q,...r].join(""); }
  return done?t:d+" · +1 série";
}
function harder(e,c,box){
  const P=DATA.ex.filter(x=>!HIDE.has(x.id)&&x.id!==e.id&&x.s===e.s&&x.v===e.v+1&&(!e.L.length||x.L.some(l=>e.L.includes(l)))&&okEx(x,c)&&!(c.crois&&heavy(x)));
  if(!P.length) return null; const u=new Set(); return P.map(x=>({x,s:scoreEx(x,box||{L:e.L,f:[e.f]},c,u)})).sort((a,b)=>b.s-a.s)[0].x;
}

function upd(s){ s.maj=todayIso(); saveNow(); const y=scrollY; showSeance(s.id); scrollTo(0,y); }
let TT=null; function toast(t){ let el=$("#toast"); if(!el){ el=document.createElement("div"); el.id="toast"; el.setAttribute("role","status"); document.body.appendChild(el); } el.textContent=t; el.hidden=false; clearTimeout(TT); TT=setTimeout(()=>el.hidden=true,2200); }
/* échauffement : routine du warm-up attachée, ou échauffement simple en 5 étapes */

     <div class="boxf noprint"><button type="button" class="go sm" data-wu="go">Modifier dans Create my warm-up</button><span class="sp"></span><button type="button" class="lnk" data-wu="simple">Échauffement simple (5 étapes)</button><button type="button" class="lnk" data-wu="del">Détacher</button></div></div>`;
  }

    <button type="button" class="go sm" data-wu="go">Construire l'échauffement avec Create my warm-up</button>${W?`<button type="button" class="ib sm" data-wu="routine">Reprendre le warm-up attaché (${fmtMin(W.min)} min)</button>`:""}</div>`;
}
function bindWu(s){

function boxHtml(s,b,bi,c,used){

      <div class="exa noprint"><button type="button" class="ib sm" data-pick="${bi}" data-slot="${ei}" data-rep="1">Changer</button>${at?"":`<button type="button" class="ib sm" data-mv="${bi}:${ei}:-1" aria-label="Monter">↑</button><button type="button" class="ib sm" data-mv="${bi}:${ei}:1" aria-label="Descendre">↓</button>`}<button type="button" class="ib sm" data-rm="${bi}:${ei}" aria-label="Retirer">×</button></div></div>`; };

   <p class="msg">${P.length} exos possibles (âge ${c.al}, ${(LIEUX[c.lieu]||"").toLowerCase()}, ton matériel). Les plus adaptés sont en haut. ${c.done.ids.size?RULE_HIST:""}</p>

   <input class="srch" id="pq" type="search" placeholder="Rechercher dans ces exos">

  const draw=()=>{
    const qq=norm(q).split(/\s+/).filter(Boolean);
    const L=P.filter(({e})=>(!ff||e.f===ff)&&(!lv||e.v==lv)&&(!qq.length||qq.every(w=>tx(e)._t.includes(w))));

    $("#pl").innerHTML=!L.length?`<div class="empty">Aucun exo. Vérifie le matériel, le lieu ou l'âge dans les réglages, ou crée ton exo.</div>`:

    $$("[data-inf]",sheet).forEach(b=>b.onclick=()=>fiche(b.dataset.inf,()=>picker(s,bi,slot,replace)));
  };

function appliquerModele(m,tgt,age,date){

/* ---------- PROGRESSION AUTOMATIQUE (semaine suivante) ---------- */
function progression(s){
  const n=clone(s); n.id=uid(); n.date=addDays(s.date,7); n.nom=(s.nom||"Séance").replace(/\s*\(S\+\d+\)$/,"")+" (S+"+((+(/\(S\+(\d+)\)$/.exec(s.nom||"")||[])[1]||0)+1)+")";
  n.src=null; n.faite=null; n.prerempli=false; n.modeleNote=null; n.prog={de:s.id}; n.cree=n.maj=todayIso();
  const c=ctxOf(n); let up=0, dz=0;
  for(const b of n.boxes||[]) b.ex=b.ex.map(x=>{ if(!x) return x; const e=exoOf(x); if(!e) return x;
    const h=b.part==="C"?harder(e,c,b):null;            // échauffement et retour au calme : le dosage seul monte
    if(h){ up++; return {id:h.id,d:dose(h,c),up:"exo",de:e.id}; }
    if(b.part==="C"){ dz++; return {...x,d:bumpDose(x.d),up:"dose"}; } return x; });
  n.progNote=`Progression de « ${s.nom||"séance"} » : ${up} exo${up>1?"s":""} remplacé${up>1?"s":""} par leur version plus dure, ${dz} dosage${dz>1?"s":""} monté${dz>1?"s":""} d'un cran.`;
  ST.seances.push(n); saveNow(); return n;
}

/* ---------- ENVOI AU JOUEUR (lien) ---------- */
function envoyerSeance(s){
  const c=ctxOf(s), J=joueursDe(s); const o=clone(s); o.joueurs=[]; o.gid=null; o.src=null; o.faite=null; o.prerempli=false;
  o.libre={...o.libre,age:c.age,n:c.n,zones:c.zones,crois:c.crois}; o.recu=J.map(j=>j.nom.split(" ")[0]).join(", ")||true;
  if(J.length===1) o.j={id:J[0].id,nom:J[0].nom,sexe:J[0].sexe,naissance:J[0].naissance};
  for(const b of o.boxes||[]) for(const x of b.ex) if(x){ const e=EX[x.id]; if(e&&e.perso) x.snap={n:e.n,de:e.de,co:e.co,ma:e.ma,ob:e.ob,L:e.L,v:e.v,a:e.a,f:e.f,k:e.k}; }
  Partage.envoyer({v:2,s:o},"Séance : "+(s.nom||"séance"),`Séance « ${s.nom||""} » du ${frD(s.date)} : ouvre ce lien.`,openSheet,esc);
}
async function recevoir(code){
  try{ const d=await Partage.dec(code); const s=d.s; s.id=uid(); s.maj=todayIso();
    if(s.j){ try{ const j=GRUN.joueurs.ensure(s.j); s.joueurs=[j.id]; }catch(e){} delete s.j; }
    else if(MOI()) s.joueurs=[MOI()];
    ST.seances.push(s); saveNow(); location.replace("#/s/"+s.id); }
  catch(e){ main.innerHTML=`<div class="empty">Ce lien de séance est abîmé. Demande qu'on te le renvoie.</div>`; }
}

/* ---------- PDF DE LA SÉANCE ---------- */
async function pdfSeance(s){
  const b=$("#prt"); b.textContent="Préparation…";
  try{
  const c=ctxOf(s), d=new MiniPDF.Doc(), M=d.M, W=d.W-2*M;
  const COL={E:"#0F766E",C:"#1D4ED8",F:"#7C3AED"};
  d.para(s.nom||"Séance",{size:18,bold:true,after:4});
  d.para(`${TYPES[s.type].n} · ${frD(s.date)} · ${PHASES[s.phase]||""} · ${s.duree} min · ${LIEUX[s.lieu]||""}`,{size:10,color:"#5D6675"});
  d.para(whoTxt(s,c).replace(/&[^;]+;/g,"'")+" · "+c.al,{size:10,color:"#5D6675"});
  if(s.theme) d.para("Thème : "+s.theme,{size:11,bold:true,after:2});
  if(s.lignes.length) d.para("Lignes : "+s.lignes.map(l=>l+" "+lineName(l)).join(" · "),{size:9,color:"#5D6675"});
  if(c.zones.length||c.crois) d.para("Vigilance : "+[...c.zones.map(z=>ZN[z]||z),...(c.crois?["croissance"]:[])].join(", "),{size:9,color:"#B91C1C"});
  d.y+=6;
  for(const p of ["E","C","F"]){
    const wu=p==="E"&&s.wmode==="routine"&&s.warmup;
    const bx=wu?wuBlocs(s.warmup.routine).map(b=>({nom:b.nom,min:b.min,jeux:b.jeux})):s.boxes.filter(b=>b.part===p); if(!bx.length) continue;
    d.need(40); d.rect(M,d.y,W,20,{fill:COL[p]}); d.text(M+8,d.y+5,PARTS[p],{size:12,bold:true,color:"#FFFFFF"});
    const mt=partMin(s,p)+" min"; d.text(M+W-8-MiniPDF.width(mt,11,true),d.y+5,mt,{size:11,bold:true,color:"#FFFFFF"}); d.y+=26;
    for(const B of bx){
      d.need(34); const mn=(B.min||0)+" min";
      d.text(M,d.y,B.nom,{size:11.5,bold:true}); d.text(M+W-MiniPDF.width(mn,10.5,true),d.y,mn,{size:10.5,bold:true,color:COL[p]}); d.y+=16;
      if(wu){ for(const j of B.jeux){ const e=EX[j.id]; d.need(24); d.para(e?.n||j.n||j.id,{size:10.5,bold:true,x:M+10,after:0}); const t=e?.w?.but||e?.ob; if(t) d.para(t,{size:9,color:"#333333",x:M+10,after:4}); } d.line(M,d.y,M+W,d.y); d.y+=8; continue; }
      if(B.at) d.para(`${B.at.n} ateliers · ${Math.round((B.min||0)/B.at.n)} min chacun · groupes de ${Math.ceil(c.n/B.at.n)} · rotation au signal`,{size:9,color:"#5D6675",x:M+10});
      const L=B.ex.map((x,i)=>[x,i]).filter(([x])=>exoOf(x));
      if(!L.length) d.para("(aucun exo choisi)",{size:9,color:"#8A94A3",x:M+10});
      for(const [x,i] of L){ const e=exoOf(x);
        d.need(30); d.para((B.at?`Atelier ${i+1} · `:"")+e.n,{size:10.5,bold:true,x:M+10,after:0});
        if(x.d) d.para(x.d,{size:9.5,color:COL[p],x:M+10,after:0});
        if(e.co) d.para("Consignes : "+arr(e.co),{size:9,color:"#333333",x:M+10,after:0});
        if(e.ma) d.para("Matériel : "+e.ma,{size:8.5,color:"#5D6675",x:M+10,after:5});
      }
      d.line(M,d.y,M+W,d.y); d.y+=8;
    }
    d.y+=4;
  }
  const r=await MiniPDF.deliver(d.out(),`Séance ${(s.nom||"").replace(/[\\/:*?"<>|]/g,"").slice(0,40)} ${frD(s.date).replace(/\//g,"-")}.pdf`);
  b.textContent=r==="download"?"PDF téléchargé":"Imprimer / PDF";
  }catch(e){ b.textContent="Erreur PDF"; console.error(e); }
  setTimeout(()=>{ const x=$("#prt"); if(x) x.textContent="Imprimer / PDF"; },2500);
}

/* ---------- MODE TERRAIN COMMUN : warm-up guidé (jeu par jeu) puis séance (exo par exo), retour à la fin ---------- */
let TIMER=null, RTIMER=null, ACX=null, WL=null;
function beep(n=3){ try{ ACX||=new (window.AudioContext||window.webkitAudioContext)(); for(let i=0;i<n;i++){ const t=i*0.25, o=ACX.createOscillator(), g=ACX.createGain(); o.frequency.value=i<n-1?880:1320; o.connect(g); g.connect(ACX.destination); g.gain.setValueAtTime(0.25,ACX.currentTime+t); g.gain.exponentialRampToValueAtTime(0.001,ACX.currentTime+t+0.2); o.start(ACX.currentTime+t); o.stop(ACX.currentTime+t+0.22); } }catch(e){} try{ navigator.vibrate&&navigator.vibrate([300,100,300]); }catch(e){} }
function steps(s){
  const S=[];
  if(s.wmode==="routine"&&s.warmup) wuBlocs(s.warmup.routine).forEach((b,bi)=>{ const n=b.jeux.length||1; b.jeux.forEach((j,ji)=>S.push({k:"wu",key:`w${bi}.${ji}`,part:"E",cas:b.nom,id:j.id,n:j.n,sec:j.sec||Math.max(20,Math.round((b.min||3)*60/n))})); });
  (s.boxes||[]).forEach((b,bi)=>{ if(b.part==="E"&&s.wmode==="routine"&&s.warmup) return;
    const ex=b.ex.map((x,ei)=>({x,ei})).filter(({x})=>x);
    if(!ex.length){ S.push({k:"box",key:`b${bi}`,part:b.part,cas:b.nom,sec:(+b.min||0)*60}); return; }
    ex.forEach(({x,ei},i)=>S.push({k:"ex",key:`b${bi}.${ei}`,part:b.part,cas:b.nom,bi,ei,id:x.id,d:x.d,at:b.at?ei+1:null,sec:Math.max(30,Math.round((+b.min||0)*60/(b.at?1:ex.length))),rot:b.at?Math.round((+b.min||0)*60/b.at.n):null}));
  });
  return S;
}
const seriesOf=d=>{ const m=/(\d+)\s*(?:à\s*\d+\s*)?×/.exec(d||""); return m?Math.min(10,+m[1]):0; };
const recupOf=d=>{ const m=/récup[^0-9,]*(\d+)\s*(min|s)?(?:\s*(\d+))?/i.exec(d||""); if(!m) return /récup/i.test(d||"")?120:60; return m[2]==="s"?+m[1]:+m[1]*60+(+m[3]||0); };
const mmss=t=>{ const a=Math.abs(t); return (t<0?"+":"")+Math.floor(a/60)+":"+String(a%60).padStart(2,"0"); };
function showTerrain(id,k){
  const s=getS(id); if(!s?.boxes){ go("#/"); return; }
  if(!COACH()&&!concerne(s,MOI())&&!s.recu){ go("#/"); return; }
  const S=steps(s); if(!S.length){ main.innerHTML=`<div class="empty">Cette séance est vide.</div>`; return; }
  if(!ST.run||ST.run.sid!==id){ ST.run={sid:id,etat:{},debut:Date.now()}; saveNow(); }
  if(k==null||k===""){ k=S.findIndex(x=>!ST.run.etat[x.key]); if(k<0) k=0; }
  k=Math.max(0,+k||0); if(k>=S.length){ go("#/retour/"+id); return; }
  try{ if(!WL&&navigator.wakeLock) navigator.wakeLock.request("screen").then(w=>{ WL=w; w.addEventListener("release",()=>WL=null); }).catch(()=>{}); }catch(e){}
  const x=S[k], e=x.id?exoOf({id:x.id})||EX[x.id]:null, wu=x.k==="wu";
  const nSer=x.k==="ex"?seriesOf(x.d):0, rec=recupOf(x.d);
  const nWu=S.filter(y=>y.k==="wu").length, pos=wu?`Échauffement · jeu ${k+1}/${nWu}`:`${PARTS[x.part]} · ${k+1-nWu}/${S.length-nWu}`;
  const bar=`<div class="gbar" aria-hidden="true">${S.map((y,m)=>`<i class="${y.k==="wu"?"w ":""}${ST.run.etat[y.key]==="fait"?"on":ST.run.etat[y.key]==="saute"?"sk":""}${m===k?" cur":""}"></i>`).join("")}</div>`;
  const nx=S[k+1];
  main.innerHTML=`<div class="ter"><div class="terh"><a class="ib" href="#/s/${s.id}">Quitter</a><span>${pos}</span></div>${bar}
   <div class="etq">${esc(x.cas)}${x.at?" · atelier "+x.at:""}</div>
   <h1>${esc(e?.n||x.n||x.cas)}</h1>
   ${x.d?`<p class="dz big">${esc(x.d)}</p>`:wu&&e?.w?.but?`<p class="lead">${esc(e.w.but)}</p>`:""}
   <div class="clock" id="clk"></div>
   <div class="tools"><button class="go big" id="st" type="button">Démarrer</button><button class="ib" id="rz" type="button" aria-label="Remettre le chrono">⟲ ${mmss(x.sec)}</button><span id="vb"></span></div>
   ${x.rot?`<p class="msg">Ateliers : rotation toutes les ${mmss(x.rot)} au signal.</p>`:""}
   ${nSer?`<div class="ser"><b>Série <span id="sn">1</span> / ${nSer}</b><button type="button" class="go sm" id="sdone">Série faite → récup ${mmss(rec)}</button><span class="clock sm" id="rclk" hidden></span></div>`:""}
   <div id="vid"></div>
   ${e?`<div class="terx">${e.co?`<p><b>Consignes.</b> ${esc(arr(e.co))}</p>`:""}${e.de?`<p class="msg"><b>Déroulement.</b> ${esc(e.de)}</p>`:""}${e.ma&&!/^aucun/.test(e.ma)?`<p class="msg"><b>Matériel.</b> ${esc(e.ma)}</p>`:""}</div>`:x.k==="box"?`<div class="empty">Aucun exo choisi dans cette case : fais-la librement.</div>`:""}
   <div class="tools tfin"><button class="go big" id="ok" type="button">✓ Fait${nx?", suivant":""}</button><button class="ib" id="sk" type="button">Sauter</button>${k?`<a class="ib" href="#/terrain/${s.id}/${k-1}">‹ Précédent</a>`:""}</div>
   ${nx?`<p class="msg">Ensuite : ${esc((nx.id&&(exoOf({id:nx.id})||{}).n)||nx.n||nx.cas)}${nx.k==="wu"||x.k!=="wu"?"":" (fin de l'échauffement)"}</p>`:`<p class="msg">Dernier exo : ensuite, le retour.</p>`}</div>`;
  clearInterval(TIMER); clearInterval(RTIMER); let left=x.sec, run=false;
  const show=()=>{ const c=$("#clk"); if(!c) return; c.textContent=mmss(left); c.classList.toggle("over",left<0); };
  show();
  $("#st").onclick=()=>{ run=!run; $("#st").textContent=run?"Pause":"Reprendre"; clearInterval(TIMER); if(run){ try{ ACX||=new (window.AudioContext||window.webkitAudioContext)(); ACX.resume&&ACX.resume(); }catch(er){} TIMER=setInterval(()=>{ left--; show(); if(left===0) beep(3); if(x.rot&&left>0&&(x.sec-left)%x.rot===0) beep(2); },1000); } };
  $("#rz").onclick=()=>{ left=x.sec; show(); };
  if(nSer){ let sn=1; $("#sdone").onclick=()=>{ if(sn>=nSer){ $("#sdone").textContent="Séries terminées ✓"; $("#sdone").disabled=true; beep(1); return; } let r=rec; const rc=$("#rclk"); rc.hidden=false; rc.textContent=mmss(r); $("#sdone").disabled=true; clearInterval(RTIMER);
      RTIMER=setInterval(()=>{ r--; rc.textContent=mmss(r); if(r<=0){ clearInterval(RTIMER); beep(3); sn++; $("#sn").textContent=sn; rc.hidden=true; $("#sdone").disabled=false; $("#sdone").textContent=sn>=nSer?"Dernière série faite":"Série faite → récup "+mmss(rec); } },1000); }; }
  const mark=v=>{ ST.run.etat[x.key]=v; saveNow(); clearInterval(TIMER); clearInterval(RTIMER); go(k+1>=S.length?"#/retour/"+s.id:"#/terrain/"+s.id+"/"+(k+1)); };
  $("#ok").onclick=()=>mark("fait"); $("#sk").onclick=()=>mark("saute");
  if(x.id) videoOf(x.id).then(v=>{ if(!v||!$("#vb")) return; $("#vb").innerHTML=`<button type="button" class="ib" id="vbt">▶ Vidéo</button>`; $("#vbt").onclick=()=>{ const el=$("#vid"); if(el.innerHTML) el.innerHTML=""; else { el.innerHTML=vidHtml(v); if(!v.u&&!/\.(mp4|mov|webm|m4v)/i.test(v.l)) window.open(v.l,"_blank","noopener"); } }; });
}
/* RETOUR : dureté ressentie, durée réelle, douleur, commentaire → journal de chaque joueur */
function showRetour(id){
  const s=getS(id); if(!s){ go("#/"); return; }
  clearInterval(TIMER); clearInterval(RTIMER); try{ WL&&WL.release(); }catch(e){}
  const S=steps(s), run=ST.run&&ST.run.sid===id?ST.run:{etat:{},debut:null};
  const nF=S.filter(x=>run.etat[x.key]==="fait").length, nS=S.filter(x=>run.etat[x.key]==="saute").length;
  const ecoule=run.debut?Math.round((Date.now()-run.debut)/6e4):0, reel=ecoule>=s.duree*0.4?ecoule:s.duree;   // chrono réel si plausible, sinon durée prévue
  let J=joueursDe(s); if(MOI()) J=J.filter(j=>j.id===MOI()).concat(J.length?[]:[GRUN.joueurs.get(MOI())].filter(Boolean));
  const solo=J.length<=1, j0=J[0];
  const zoneSel=(id,v)=>`<select id="${id}" aria-label="Zone de la douleur"><option value="">Pas de douleur</option>${Object.entries(ZONES_RETOUR).map(([k,n])=>`<option value="${k}"${v===k?" selected":""}>${n}</option>`).join("")}</select>`;
  const intSel=id=>`<select id="${id}" aria-label="Intensité de la douleur">${[...Array(10)].map((_,i)=>`<option value="${i+1}"${i===2?" selected":""}>${i+1}/10</option>`).join("")}</select>`;
  const rpeSel=id=>`<select id="${id}" aria-label="Dureté ressentie"><option value="">–</option>${[...Array(11)].map((_,i)=>`<option value="${i}">${i}</option>`).join("")}</select>`;
  main.innerHTML=`<div class="ter fin"><h1>Séance terminée 💪</h1><p class="lead">${nF} fait${nF>1?"s":""}${nS?", "+nS+" sauté"+(nS>1?"s":""):""} sur ${S.length}. ${COACH()?"Note le retour de chaque joueur :":"Dis-moi comment ça s'est passé :"} il part dans ${solo?"son":"leur"} dossier (charge, suivi).</p>
   <div class="card" style="margin-top:12px"><div class="row"><div class="f"><label for="rd">Durée réelle (min)</label><input id="rd" type="number" min="1" max="300" value="${reel}"></div></div>
   ${solo?`<div class="f"><label>${MOI()?"Dureté ressentie":"Dureté ressentie"+(j0?" · "+esc(j0.nom):"")} (0 = repos, 10 = maximal)</label><div class="chips rpe">${[...Array(11)].map((_,i)=>`<button type="button" class="tg" data-rpe="${i}" aria-pressed="false">${i}</button>`).join("")}</div></div>
     <div class="row"><div class="f grow"><label for="rz0">Douleur</label>${zoneSel("rz0","")}</div><div class="f" id="ri0w" hidden><label for="ri0">Intensité</label>${intSel("ri0")}</div></div>
     <div class="f"><label for="rc0">Commentaire</label><textarea id="rc0" rows="2" placeholder="${MOI()?"Ce qui était dur, ce que tu as aimé…":"Ressenti, qualité, à retenir…"}"></textarea></div>`
   :`<div class="f"><label for="rall">Même dureté pour tous</label>${rpeSel("rall")}</div>
     <div class="plist">${J.map((j,i)=>`<div class="prow"><b>${esc(j.nom)}</b><div class="f"><label for="rr${i}">Dureté</label>${rpeSel("rr"+i)}</div><div class="f"><label for="rz${i}">Douleur</label>${zoneSel("rz"+i,"")}</div><div class="f"><label for="ri${i}">Intensité</label>${intSel("ri"+i)}</div><div class="f pc"><label for="rc${i}">Commentaire</label><input id="rc${i}" placeholder="facultatif"></div></div>`).join("")}</div>`}
   <p class="msg" id="rmsg"></p>
   <div class="tools"><button class="go big" id="rok" type="button">Enregistrer le retour</button><a class="ib" href="#/terrain/${s.id}">Revenir au terrain</a></div></div></div>`;
  let rpe0=null;
  $$("[data-rpe]").forEach(b=>b.onclick=()=>{ rpe0=+b.dataset.rpe; $$("[data-rpe]").forEach(x=>x.setAttribute("aria-pressed",x===b)); });
  $("#rz0")&&($("#rz0").onchange=e=>$("#ri0w").hidden=!e.target.value);
  $("#rall")&&($("#rall").onchange=e=>J.forEach((_,i)=>$("#rr"+i).value=e.target.value));
  $("#rok").onclick=()=>{
    const duree=Math.max(1,+$("#rd").value||s.duree), fait=nF===S.length?true:nF+nS===0?true:nF?"partiel":false, date=todayIso(), ids=[];
    const exF=S.filter(x=>x.id&&(run.etat[x.key]==="fait"||!run.etat[x.key])).map(x=>x.id);
    const rec=(jid,rpe,z,int,com)=>{ if(!jid) return; const r=GRUN.journal.addRetour({jid,date,type:"seance",ref:s.id,titre:s.nom||"Séance",duree,rpe,douleur:z?{zone:z,int}:null,fait,comment:com||""}); ids.push(r.id); };
    const rpes=[];
    if(solo){ if(rpe0==null){ $("#rmsg").textContent="Choisis la dureté ressentie (0 à 10)."; return; } rpes.push(rpe0); rec(j0?.id,rpe0,$("#rz0").value,+$("#ri0").value,$("#rc0").value.trim()); }
    else J.forEach((j,i)=>{ const v=$("#rr"+i).value; if(v==="") return; rpes.push(+v); rec(j.id,+v,$("#rz"+i).value,+$("#ri"+i).value,$("#rc"+i).value.trim()); });
    if(!solo&&!rpes.length){ $("#rmsg").textContent="Note au moins la dureté d'un joueur."; return; }
    s.faite={date,duree,rpe:rpes.length?Math.round(rpes.reduce((a,b)=>a+b,0)/rpes.length*10)/10:null,fait,ex:[...new Set(exF)],retours:ids,n:rpes.length};
    s.statut="faite"; s.maj=date; ST.run=null; saveNow();
    main.innerHTML=`<div class="ter fin"><h1>Retour enregistré ✓</h1><p class="lead">${ids.length?ids.length+" retour"+(ids.length>1?"s":"")+" dans le journal"+(ids.length>1?" des joueurs":" du joueur")+". ":""}Séance marquée faite le ${frD(date)}.</p>
     <div class="tools"><a class="go" href="#/s/${s.id}">Voir la séance</a>${J.length===1?`<a class="ib" href="index.html#/j/${J[0].id}">${MOI()?"Mon dossier":"Dossier de "+esc(J[0].nom.split(" ")[0])}</a>`:s.gid?`<a class="ib" href="index.html#/g/${s.gid}">Dossier du groupe</a>`:""}<a class="ib" href="#/">${MOI()?"Mes séances":"Accueil"}</a></div></div>`;
  };
}

/* ---------- ROUTAGE ---------- */
function parseHash(){ let h=location.hash.slice(1); if(h.startsWith("/")) h=h.slice(1); const i=h.indexOf("?"); const path=i<0?h:h.slice(0,i), qs=i<0?"":h.slice(i+1);
  const p=path.split("/").map(x=>{ try{ return decodeURIComponent(x); }catch(e){ return x; } }); return {a:p[0]||"",b:p[1],c:p[2],q:new URLSearchParams(qs)}; }
function route(){
  clearInterval(TIMER); clearInterval(RTIMER); closeSheet();
  const {a,b,c,q}=parseHash(), J=!COACH();
  const ter=a==="t"||a==="terrain"; document.body.classList.toggle("terrain",ter);
  if(!ter&&WL){ try{ WL.release(); }catch(e){} WL=null; }
  bandeau();
  if(a==="x"&&b){ recevoir(b); return; }
  if(a==="nouvelle") nouvelle(q);
  else if(a==="r"&&b&&!J) showReglages(b);
  else if(a==="s"&&b) showSeance(b);
  else if(ter&&b) showTerrain(b,c);
  else if(a==="retour"&&b) showRetour(b);
  else if(a==="joueur"&&b) showJoueur(b);
  else if(a==="groupe"&&b) showGroupe(b);
  else if(a==="modeles") showModeles();
  else if(a==="pl"&&b&&!J) showPlanList(b);
  else if(a==="p"&&b&&!J) fromPlan(b,c);
  else showHome();
  if(a!=="s") scrollTo(0,0);
  $("#back").style.visibility=a?"visible":"hidden";
}
addEventListener("hashchange",route);
function rerender(){ if(document.body.classList.contains("terrain")) return; if(!sheet.hidden) return; const y=scrollY; route(); scrollTo(0,y); }
async function boot(){
  try{ const rg=GRUN.load(GRUN.K.reglages,{})||{}; if(rg.theme==="light"||rg.theme==="dark") document.documentElement.dataset.theme=rg.theme; }catch(e){}
  GRUN.nav("create");
  try{ await loadBanque(); }
  catch(e){ console.error(e); main.innerHTML=`<div class="empty">Impossible de charger la banque d'exercices. Ouvre l'appli une fois avec une connexion.</div>`; return; }
  const sid=retourWarmup();
  if(sid&&parseHash().a!=="s") location.replace("#/s/"+sid);
  route();
  if(sid) toast("Échauffement attaché à la séance");
  GRUN.on("grun:banque",async()=>{ await loadBanque(); rerender(); });
  GRUN.on("grun:joueurs",rerender);
  GRUN.on(SK,()=>{ ST=loadST(); rerender(); });
}
