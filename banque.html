<style>/* GRÜN — styles communs injectés dans chaque module (barre des pôles en bas, éléments partagés).
   Les modules gardent leurs jetons (--bg, --panel, --ink, --mute, --line, --soft) au style Veille. */
:root{--grun:#0F766E;--grun-ink:#0B3B36;--nav-h:62px}
body.grun-has-nav{padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px))}
#grun-nav{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:space-around;align-items:stretch;
  background:var(--panel,#fff);border-top:1px solid var(--line,#D9DDE3);padding-bottom:env(safe-area-inset-bottom,0px);
  box-shadow:0 -4px 18px rgba(0,0,0,.05)}
#grun-nav a{flex:1;max-width:140px;min-height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  text-decoration:none;color:var(--mute,#5D6675);font:600 11.5px/1.1 var(--ui,system-ui,sans-serif);letter-spacing:.01em}
#grun-nav svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#grun-nav a.on{color:var(--ink,#16202E)}
#grun-nav a.on svg{stroke:var(--grun)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) #grun-nav{box-shadow:none}}
@media print{#grun-nav{display:none}body.grun-has-nav{padding-bottom:0}}
/* fil « poupée russe » : bandeau de retour vers le module appelant */
.grun-relais{position:sticky;top:0;z-index:40;display:flex;gap:10px;align-items:center;justify-content:space-between;
  background:var(--grun);color:#fff;padding:8px 16px;font:600 14px/1.3 var(--ui,system-ui,sans-serif)}
.grun-relais a,.grun-relais button{color:#fff;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);border-radius:8px;
  min-height:36px;padding:0 12px;display:inline-flex;align-items:center;text-decoration:none;font:inherit;white-space:nowrap}
.grun-mod #back{visibility:visible!important}
</style>

<style>
/* Layout : barre fixe (retour, recherche, + exo) ; explorateur = filtres en puces + liste des exercices ; fiche = en-tête coloré par domaine, photo, vidéo, repères, consignes, liens croisés ; formulaire de création / modification ; propositions */

}

  --pp:#F08A4B; --ge:#86A8FF; --de:#3CC7B2; --ph:#E2B85A; --jeu:#B79CF5; --acc:#E7EBF1; --ok:#5BD08A; --oks:#183326; --warn:#F2B35E; --warns:#33270F; --bad:#F87171; color-scheme:dark}

<script>

function addVidTools(box,e,has){

      dos, dosq:dq, vid:$("#f_vid").value.trim(), img:IMG };
    if($("#w_on").checked){
      const et=$("#w_et").value, ets=[...new Set([et,...$$('input[name="ets"]:checked').map(y=>y.value)])], ci=$$('input[name="ci"]:checked').map(y=>y.value);
      let w0=+$("#w_a0").value||a, w1=+$("#w_a1").value||ax; if(w1<w0) [w0,w1]=[w1,w0];
      x.w={ et, ets, ci, a:[w0,w1], fmt:$$('input[name="fmt"]:checked').map(y=>y.value), lieu:$$('input[name="lieu"]:checked').map(y=>y.value), int:+$("#w_int").value, dur:Math.max(1,Math.min(15,+$("#w_dur").value||3)),
        apres:$$('input[name="apres"]:checked').map(y=>y.value), but:x.ob ? cap(x.ob) : n, mat:mm.filter(c=>WMAT.has(c)), L, va:"", complet: (CIB[et]||[]).every(([c])=>ci.includes(c)) };
      if(!x.w.fmt.length) x.w.fmt=["seul"]; if(!x.w.lieu.length) x.w.lieu=["court"]; if(!x.w.apres.length) x.w.apres=["tennis","pp","match","bilan"];
    } else if(e && e.w) x.w=null;
    if(!e || e.perso) x.st=($$('input[name="st"]:checked')[0]||{}).value||"perso";
    const nom=(GRUN.load(GRUN.K.reglages,{})||{}).nomCoach; if(nom && !e) x.par=nom;
    let nid;
    if(!e){ const nx=GRUN.banque.add(x); nid=nx.id; if(!GRUN.banque.perso().some(y=>y.id===nid)){ msg.className="msg err"; msg.textContent="Enregistrement impossible : la mémoire de l'appareil est pleine (essaie sans photo)."; return; } }
    else if(e.perso){ GRUN.banque.edit(e.id,x); nid=e.id; }
    else { const patch={}; for(const k in x){ const cur=e[k]; if(JSON.stringify(cur??"")!==JSON.stringify(x[k]??"")) patch[k]=x[k]; }
      if(!("a" in patch || "ax" in patch || "v" in patch)) delete patch.an; if(!("L" in patch)) delete patch.li; if(!dos && !e.dosq) delete patch.dosq; if(!$("#f_ma").value.trim() && !("m" in patch)) delete patch.ma;
      if(Object.keys(patch).length) GRUN.banque.edit(e.id,patch); nid=e.id; }
    if(VFILE){ try{ await IDB.put(nid,VFILE); LOCALV.add(nid); }catch(err){ alertBox("La vidéo n'a pas pu être enregistrée sur l'appareil (espace insuffisant ?). Utilise plutôt un lien."); } }
    await reload(); EDITING=false; back(nid);
  };
}

/* ---------- propositions : circuit de validation (fichier ce soir, en ligne demain) ---------- */
const PROPKEYS = ["n","f","s","dom","L","a","ax","v","an","li","ob","de","co","er","ut","ma","m","c","e","dos","dosq","vid","img","w","par","id","cree"];
const clean = e => Object.fromEntries(PROPKEYS.filter(k=>e[k]!=null && e[k]!=="").map(k=>[k,e[k]]));
function showProps(){
  if(J()) return reserve();
  document.documentElement.style.setProperty("--acc","var(--ink)");
  const mine = EX.filter(e=>e.perso && e.st==="propose"), val = EX.filter(e=>e.perso && e.st==="valide"), rec = P.recues||[];
  const pv = x => `<details><summary>Voir la fiche</summary><dl>${[["Famille",(FBY[x.f]||MOIFAM).t+(x.s?" · "+x.s:"")],["Lignes",(x.L||[]).join(", ")],["Âge et niveau",`${x.a||"?"} à ${x.ax||18} ans · niveau ${x.v||1}`],["Objectif",x.ob],["Description",x.de],["Consignes",x.co],["Erreurs",x.er],["Matériel",x.ma],["Dosage",x.dos],["Échauffement",x.w?[ETN[x.w.et],...(x.w.ets||[]).filter(y=>y!==x.w.et).map(y=>ETN[y])].join(" + "):""],["Vidéo",x.vid]].filter(([,y])=>y).map(([k,y])=>`<dt>${k}</dt><dd>${esc(y)}</dd>`).join("")}${x.img?`<dd><img class="imgprev" src="${esc(x.img)}" alt=""></dd>`:""}</dl></details>`;
  $("#main").innerHTML = `<h1>Propositions</h1><p class="lead">Un coach propose un exercice → Eliot le relit et le valide → il devient un exercice de la méthode, visible par tous les abonnés (en ligne demain ; ce soir, par fichier).</p>${tabs("/propositions")}
   <div class="sec"><h2>Mes exercices proposés · ${mine.length}</h2><p class="msg">Mets le statut « Proposé à la méthode » sur un de tes exos (bouton Modifier), puis exporte le fichier et envoie-le à Eliot. Les vidéos de l'appareil ne partent pas dans le fichier : mets plutôt un lien.</p>
    ${mine.length?rowsHTML(mine):'<div class="empty">Aucun exercice proposé pour l\'instant.</div>'}
    <div class="actbar" style="margin-top:10px"><button class="btn pri" id="pexp" type="button" ${mine.length?"":"disabled"}>Exporter mes propositions (fichier)</button></div></div>
   <div class="sec"><h2>Propositions reçues · ${rec.length}</h2><p class="msg">Importe un fichier GRUN_propositions_….json reçu d'un coach, relis chaque exercice, puis valide-le (il entre dans la banque avec le statut « Exercice de la méthode ») ou refuse-le.</p>
    <div class="actbar" style="margin:8px 0"><label class="btn" for="pimp">Importer un fichier de propositions</label><input id="pimp" type="file" accept=".json,application/json" hidden></div><div class="msg" id="pmsg" role="status"></div>
    ${rec.map(r=>`<div class="prop" data-r="${r.rid}"><div class="headrow"><div><b>${esc(r.ex.n)}</b><div class="msg">Proposé par ${esc(r.de||"un coach")} · ${esc(GRUN.frD(r.date))}${nameTaken(r.ex.n)?' · <span style="color:var(--warn)">nom déjà pris : il sera complété par le nom du coach</span>':""}</div></div>
      <div class="actbar"><button class="btn pri sm" type="button" data-ok="${r.rid}">Valider</button><button class="btn dan sm" type="button" data-no="${r.rid}">Refuser</button></div></div>${pv(r.ex)}</div>`).join("") || '<div class="empty">Aucune proposition en attente.</div>'}</div>
   <div class="sec"><h2>Exercices de la méthode ajoutés · ${val.length}</h2>${val.length?rowsHTML(val):'<div class="empty">Aucun pour l\'instant.</div>'}</div>
   ${(P.traitees||[]).length?`<div class="sec"><h2>Historique</h2><div class="list">${P.traitees.slice(0,30).map(t=>`<div class="row" style="--dc:${t.res==="validé"?"var(--ok)":"var(--bad)"}"><span class="bar"></span><span class="id">${esc(GRUN.frD(t.date))}</span><span class="nm"><b>${esc(t.n)}</b><small>${esc(t.de||"")} · ${t.res}${t.id?" · "+t.id:""}</small></span><span class="meta"></span></div>`).join("")}</div></div>`:""}`;
  $("#pexp").onclick=()=>{ const nom=(GRUN.load(GRUN.K.reglages,{})||{}).nomCoach||"";
    GRUN.telecharger({app:"GRUN", type:"propositions_banque", v:1, date:today(), de:nom, ex:mine.map(clean)}, `GRUN_propositions_${today()}.json`); $("#pmsg").textContent=""; };
  $("#pimp").onchange=async ev=>{ const f=ev.target.files[0]; ev.target.value=""; if(!f) return; try{ const d=JSON.parse(await f.text()); const n=importProps(d); showProps(); $("#pmsg").className="msg ok"; $("#pmsg").textContent=`${n} proposition${n>1?"s":""} ajoutée${n>1?"s":""} à relire.`; }catch(err){ $("#pmsg").className="msg err"; $("#pmsg").textContent="Ce fichier n'est pas un fichier de propositions (GRUN_propositions_….json)."; } };
  $$("[data-ok]").forEach(b=>b.onclick=async()=>{ const r=P.recues.find(y=>y.rid===b.dataset.ok); if(!r) return;
    const x={...r.ex}; const pid=x.id; delete x.id; delete x.cree; if(nameTaken(x.n)) x.n=`${x.n} (${r.de||"proposé"})`; let k=2; while(nameTaken(x.n)) x.n=`${r.ex.n} (${r.de||"proposé"} ${k++})`;
    if(!FBY[x.f]) x.f="MOI";
    const nx=GRUN.banque.add({...x, st:"valide", propPar:r.de||"", propId:pid||""});
    P.recues=P.recues.filter(y=>y.rid!==r.rid); P.traitees=[{n:nx.n,de:r.de,date:today(),res:"validé",id:nx.id},...(P.traitees||[])]; save(); await reload(); showProps(); });
  $$("[data-no]").forEach(b=>b.onclick=()=>{ if(!b.dataset.c){ b.dataset.c=1; b.textContent="Confirmer le refus"; return; } const r=P.recues.find(y=>y.rid===b.dataset.no); if(!r) return;
    P.recues=P.recues.filter(y=>y.rid!==r.rid); P.traitees=[{n:r.ex.n,de:r.de,date:today(),res:"refusé"},...(P.traitees||[])]; save(); showProps(); });
}
function importProps(d){
  const L = Array.isArray(d) ? d : (d && Array.isArray(d.ex) ? d.ex : null);
  if(!L || (d.type && d.type!=="propositions_banque")) throw new Error("format");
  let n=0; P.recues=P.recues||[];
  for(const x of L){ if(!x || !x.n) continue; const ex=clean(x); if(P.recues.some(r=>fold(r.ex.n)===fold(ex.n) && (r.de||"")===(d.de||""))) continue;
    P.recues.push({rid:GRUN.uid(), de:d.de||x.par||"", date:d.date||today(), ex}); n++; }
  save(); return n;
}

/* ---------- familles ---------- */
function showFams(){
  document.documentElement.style.setProperty("--acc","var(--ink)");
  const groups={}; FAMS.forEach(f=>{ if(f.c==="MOI" && !EX.some(e=>e.f==="MOI")) return; (groups[f.dossier]=groups[f.dossier]||[]).push(f); });
  $("#main").innerHTML=`<h1>Familles d'exercices</h1><p class="lead">${FAMS.length-1} familles · chacune avec son mode d'emploi, sa progression et ses repères d'âge</p>${tabs("familles")}`+
    Object.entries(groups).map(([g,fs])=>`<div class="sec"><h2>${esc(g.replace(/^\d+\.\d+\s/,""))}</h2><div class="fams" style="margin-top:8px">${fs.map(f=>`<a class="fam" href="#f/${f.c}" style="--dc:${dc(f.dom)}"><b>${esc(f.t)}</b><small>${EX.filter(e=>e.f===f.c).length} exercices · ${f.subs.length} sous-familles</small></a>`).join("")}</div></div>`).join("");
}
function showFam(c){
  const f=FBY[c]; if(!f) return showFams(); document.documentElement.style.setProperty("--acc",dc(f.dom));
  const xs=EX.filter(e=>e.f===c && !HIDE.has(e.id)), subs={}; xs.forEach(e=>{ (subs[e.s]=subs[e.s]||[]).push(e); });
  const m=$("#main"); m.style.setProperty("--dc",dc(f.dom));
  m.innerHTML=`<div class="crumb"><a href="#familles">Familles</a>›<span>${esc(f.dossier)}</span></div><h1 style="margin-top:4px">${esc(f.t)}</h1><p class="lead">${xs.length} exercices</p>
   <div class="intro"><details><summary>Mode d'emploi de la famille : à quoi elle sert, comment choisir, progression, repères d'âge</summary><div class="tw">${f.intro}</div></details></div>`+
   Object.entries(subs).map(([s,arr])=>`<h3 class="subh">${esc(s)}</h3>${rowsHTML(arr)}`).join("");
}

/* ---------- favoris et listes ---------- */
function showFav(){
  document.documentElement.style.setProperty("--acc","var(--ink)");
  const xs=[...FAV].map(i=>BY[i]).filter(Boolean);
  $("#main").innerHTML=`<h1>Favoris</h1><p class="lead">Touche ♡ sur une fiche pour l'ajouter ici. Tes favoris reviennent en priorité dans Create.</p>${tabs("favoris")}<div class="sec">${xs.length?rowsHTML(xs):'<div class="empty">Aucun favori pour l\'instant.</div>'}</div>`+dataBox();
  bindData();
}
function showLists(){
  document.documentElement.style.setProperty("--acc","var(--ink)");
  $("#main").innerHTML=`<h1>Mes séances</h1><p class="lead">Regroupe des exercices pour une séance, un joueur ou un groupe. Pour une séance complète et structurée : <a class="ref" href="seances.html">Create my séance</a>.</p>${tabs("listes")}
   <div class="sec"><div class="actbar"><input id="ln" type="text" placeholder="Nom de la séance (ex. U12 jeudi · vitesse)" style="flex:1;min-width:200px;min-height:40px;border:1px solid var(--line);border-radius:9px;padding:0 10px;background:var(--panel)"><button class="btn pri" id="lnew" type="button">Créer</button></div></div>
   <div class="sec">${P.lists.length?`<div class="list">${P.lists.map(l=>`<a class="row" href="#l/${l.id}" style="--dc:var(--ink)"><span class="bar"></span><span class="id">${l.ex.length} ex.</span><span class="nm"><b>${esc(l.n)}</b><small>${l.ex.slice(0,4).map(i=>BY[i]?BY[i].n:i).map(esc).join(" · ")}</small></span><span class="meta"></span></a>`).join("")}</div>`:'<div class="empty">Aucune séance. Crée-en une ci-dessus, puis ajoute des exercices avec « + Ma liste » sur leur fiche.</div>'}</div>`;
  $("#lnew").onclick=()=>{ const n=$("#ln").value.trim(); if(!n){ $("#ln").focus(); return; } P.lists.unshift({id:Date.now().toString(36), n, ex:[]}); save(); showLists(); };
}
function showList(lid){
  const l=P.lists.find(x=>x.id===lid); if(!l) return showLists(); document.documentElement.style.setProperty("--acc","var(--ink)");
  const xs=l.ex.map(i=>BY[i]).filter(Boolean);
  $("#main").innerHTML=`<div class="crumb" style="--dc:var(--ink)"><a href="#listes">Mes séances</a></div><h1 style="margin-top:4px">${esc(l.n)}</h1><p class="lead">${xs.length} exercice${xs.length>1?"s":""}</p>
   <div class="sec actbar"><button class="btn" id="lcopy" type="button">Copier la séance en texte</button><button class="btn" id="lren" type="button">Renommer</button><button class="btn" id="ldel" type="button">Supprimer la séance</button></div><div class="msg" id="lmsg"></div>
   <div class="sec">${xs.length?`<div class="list">${xs.map((e,k)=>`<div class="row" style="--dc:${dc(e.dom)}"><span class="bar"></span><span class="id">${k+1}. ${e.id}</span><a class="nm" href="#/ex/${e.id}" style="text-decoration:none"><b>${esc(e.n)}</b><small>${esc(e.ma||"")}</small></a><span class="meta"><button class="chip" data-up="${k}" type="button" aria-label="Monter">↑</button><button class="chip" data-dn="${k}" type="button" aria-label="Descendre">↓</button><button class="chip" data-rm="${k}" type="button" aria-label="Retirer">✕</button></span></div>`).join("")}</div>`:'<div class="empty">Ajoute des exercices avec « + Ma liste » sur leur fiche.</div>'}</div>`;
  $$("[data-up]").forEach(b=>b.onclick=()=>{ const k=+b.dataset.up; if(k>0){ [l.ex[k-1],l.ex[k]]=[l.ex[k],l.ex[k-1]]; save(); showList(lid);} });
  $$("[data-dn]").forEach(b=>b.onclick=()=>{ const k=+b.dataset.dn; if(k<l.ex.length-1){ [l.ex[k+1],l.ex[k]]=[l.ex[k],l.ex[k+1]]; save(); showList(lid);} });
  $$("[data-rm]").forEach(b=>b.onclick=()=>{ l.ex.splice(+b.dataset.rm,1); save(); showList(lid); });
  $("#lcopy").onclick=async()=>{ const t=l.n+"\n\n"+xs.map((e,k)=>`${k+1}. ${e.id} · ${e.n}\n   Objectif : ${e.ob}\n   Matériel : ${e.ma}\n   Consignes : ${e.co}${e.dos?`\n   Dosage : ${e.dos}`:""}`).join("\n\n"); try{ await navigator.clipboard.writeText(t); $("#lmsg").textContent="Séance copiée : colle-la dans Notes ou un message."; }catch(err){ modal((b,close)=>{ b.innerHTML='<div class="msg">Sélectionne le texte puis copie-le.</div>'; const ta=document.createElement("textarea"); ta.value=t; ta.style.cssText="width:100%;min-height:260px"; b.appendChild(ta); ta.select(); const k=document.createElement("button"); k.className="btn"; k.textContent="Fermer"; k.onclick=close; b.appendChild(k); }); } };
  $("#lren").onclick=()=>modal((b,close)=>{ b.innerHTML=`<h2>Renommer</h2><input id="rn" type="text" value="${esc(l.n)}"><div class="actbar"><button class="btn pri" id="rok" type="button">Enregistrer</button></div>`; $("#rok").onclick=()=>{ const v=$("#rn").value.trim(); if(v){ l.n=v; save(); } close(); showList(lid); }; });
  $("#ldel").onclick=()=>{ const b=$("#ldel"); if(b.dataset.c){ P.lists=P.lists.filter(x=>x.id!==lid); save(); location.hash="listes"; } else { b.dataset.c=1; b.textContent="Confirmer la suppression"; } };
}
function pickList(id){
  modal((b,close)=>{
    b.innerHTML=`<h2>Ajouter ${id} à une liste</h2>${P.lists.map(l=>`<button class="btn" type="button" data-l="${l.id}" style="justify-content:flex-start">${esc(l.n)} · ${l.ex.length} ex.${l.ex.includes(id)?" ✓":""}</button>`).join("")}<div class="actbar"><input id="nl" type="text" placeholder="Nouvelle liste" style="flex:1"><button class="btn pri" id="nlok" type="button">Créer et ajouter</button></div>`;
    b.querySelectorAll("[data-l]").forEach(x=>x.onclick=()=>{ const l=P.lists.find(y=>y.id===x.dataset.l); if(!l.ex.includes(id)) l.ex.push(id); save(); close(); });
    $("#nlok").onclick=()=>{ const n=$("#nl").value.trim(); if(!n) return; P.lists.unshift({id:Date.now().toString(36), n, ex:[id]}); save(); close(); };
  });
}

/* ---------- vidéos à tourner ---------- */
function showShoot(){
  document.documentElement.style.setProperty("--acc","var(--ink)");
  const done=EX.filter(e=>hasVid(e.id)).length;
  $("#main").innerHTML=`<h1>Vidéos de démonstration</h1><p class="lead"><b>${done}</b> exercice${done>1?"s":""} avec vidéo sur ${EX.length.toLocaleString("fr-FR")} · ${EX.length-done} à tourner</p>${tabs("tournage")}
   <div class="sec intro" style="padding:12px 18px"><b>Comment ajouter les vidéos</b><ol style="margin:6px 0 0;padding-left:20px;line-height:1.6">
   <li>Filme l'exercice et nomme le fichier avec son identifiant : <code>FOR-0123.mp4</code>.</li>
   <li>Sur la fiche, touche <b>Ajouter un lien vidéo</b> (YouTube non répertoriée, iCloud, Drive…) ou <b>Choisir une vidéo de l'appareil</b> (gardée hors ligne sur cet iPad).</li>
   <li>Pour que les vidéos soient dans l'appli pour tout le monde et sur tous tes appareils : touche <b>Sauvegarder</b> ci-dessous et envoie le fichier à Claude, qui les ajoutera à l'appli.</li></ol></div>
   <div class="sec actbar"><a class="btn" href="#" id="fsans">Voir les exercices sans vidéo</a><button class="btn" id="copyshoot" type="button">Copier la liste de tournage</button></div><div class="msg" id="smsg"></div>`+dataBox();
  $("#fsans").onclick=ev=>{ ev.preventDefault(); P.f.vid="0"; save(); location.hash=""; showExplore(); };
  $("#copyshoot").onclick=async()=>{ const t=EX.filter(e=>!hasVid(e.id)).map(e=>`${e.id}.mp4\t${e.n}\t${e.ma||""}`).join("\n"); try{ await navigator.clipboard.writeText(t); $("#smsg").textContent="Liste copiée ("+t.split("\n").length+" exercices) : colle-la dans Notes ou Numbers."; }catch(err){ $("#smsg").textContent="Copie impossible dans cette vue."; } };
  bindData();
}

/* ---------- sauvegarde : une seule pour tout GRÜN (GRUN.exportAll / importAll) ; anciens fichiers Banque_exercices_….json acceptés ---------- */
function dataBox(){ return `<div class="sec"><h2>Mes données</h2><div class="actbar" style="margin-top:8px"><button class="btn" id="dsave" type="button">Sauvegarder toute l'appli</button><label class="btn" for="drest">Restaurer</label><input id="drest" type="file" accept=".json,application/json" hidden></div><div class="msg" id="dmsg">${FLASH?esc(FLASH):`Une seule sauvegarde pour tout GRÜN : joueurs, séances, exos créés et modifiés, favoris, listes, notes, liens vidéo. Les vidéos choisies sur l'appareil ne sont pas incluses. Les anciennes sauvegardes de la banque (Banque_exercices_….json) sont acceptées.`}</div></div>`; }
function bindData(){
  $("#dsave").onclick=()=>GRUN.telecharger(GRUN.exportAll(), "GRUN_sauvegarde_"+today()+".json");
  $("#drest").onchange=async ev=>{ const f=ev.target.files[0]; ev.target.value=""; if(!f) return; const msg={set textContent(t){ dmsg(t); }};
    try{ const d=JSON.parse(await f.text());
      if(d && d.app==="GRUN" && d.data){ GRUN.importAll(d); P=loadP(); await reload(); msg.textContent="Sauvegarde GRÜN restaurée (fusionnée avec les données de l'appareil)."; return; }
      if(d && d.type==="propositions_banque"){ const n=importProps(d); msg.textContent=`${n} proposition${n>1?"s":""} à relire dans l'onglet Propositions.`; return; }
      if(!d || d.format!=="banque") throw 0;
      for(const id of d.fav||[]) if(!FAV.has(id) && BY[id]){ GRUN.banque.toggleFav(id); FAV.add(id); }
      const ids=new Set(P.lists.map(l=>l.id)); (d.lists||[]).forEach(l=>{ if(!ids.has(l.id)) P.lists.push(l); }); P.notes=Object.assign({},P.notes,d.notes||{}); P.links=Object.assign({},P.links,d.links||{}); save(); msg.textContent="Données de l'ancienne banque restaurées."; }
    catch(e){ msg.textContent="Ce fichier n'est pas une sauvegarde reconnue (GRUN_sauvegarde_….json ou Banque_exercices_….json)."; } };
}

boot();
