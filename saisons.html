<style>/* GRÜN — styles communs injectés dans chaque module (barre des pôles en bas, éléments partagés).
   Les modules gardent leurs jetons (--bg, --panel, --ink, --mute, --line, --soft) au style Veille. */
:root{--grun:#0F766E;--grun-ink:#0B3B36;--nav-h:62px}
body.grun-has-nav{padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px))}
#grun-nav{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:space-around;align-items:stretch;
  background:var(--panel,#fff);border-top:1px solid var(--line,#D9DDE3);padding-bottom:env(safe-area-inset-bottom,0px);
  box-shadow:0 -4px 18px rgba(0,0,0,.05)}
#grun-nav a{flex:1;max-width:140px;min-height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  text-decoration:none;color:var(--mute,#5D6675);font:600 11.5px/1.1 var(--ui,system-ui,sans-serif);letter-spacing:.01em}
#grun-nav svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#grun-nav a.on{color:var(--ink,#16202E)}
#grun-nav a.on svg{stroke:var(--grun)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) #grun-nav{box-shadow:none}}
@media print{#grun-nav{display:none}body.grun-has-nav{padding-bottom:0}}
/* fil « poupée russe » : bandeau de retour vers le module appelant */
.grun-relais{position:sticky;top:0;z-index:40;display:flex;gap:10px;align-items:center;justify-content:space-between;
  background:var(--grun);color:#fff;padding:8px 16px;font:600 14px/1.3 var(--ui,system-ui,sans-serif)}
.grun-relais a,.grun-relais button{color:#fff;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);border-radius:8px;
  min-height:36px;padding:0 12px;display:inline-flex;align-items:center;text-decoration:none;font:inherit;white-space:nowrap}
.grun-mod #back{visibility:visible!important}
/* mode simple / mode expert (GRUN.expert) : « xp » = réservé au mode expert ; « xs » = seulement en mode simple */
html.grun-simple .xp{display:none!important}
html.grun-expert .xs{display:none!important}
/* « Plus d'options » : réglages fins et actions rares, repliés (même aspect dans tous les modules) */
details.grun-plus{margin-top:14px;border:1px solid var(--line,#D9DDE3);border-radius:12px;background:var(--panel,#fff)}
details.grun-plus>summary{list-style:none;cursor:pointer;min-height:46px;display:flex;align-items:center;gap:8px;padding:0 14px;font:600 15px/1.2 var(--ui,system-ui,sans-serif);color:var(--mute,#5D6675)}
details.grun-plus>summary::-webkit-details-marker{display:none}
details.grun-plus>summary::before{content:"+";font-weight:700;width:1em;color:var(--mute,#5D6675)}
details.grun-plus[open]>summary::before{content:"–"}
details.grun-plus>.grun-plusb{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}
/* Grilles : bilan en cours + un gros bouton « Créer un nouveau bilan » */
.bil1{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-top:14px;padding:12px 14px;border:1px solid var(--line,#D9DDE3);border-left:4px solid var(--acc,#0F766E);border-radius:12px;background:var(--panel,#fff)}
.bil1 b{display:block;font-size:1.1rem}
.bil1 small{color:var(--mute,#5D6675)}
.go.big{min-height:46px;padding:0 18px;font-size:1.02rem}
/* listes : colonne « code » masquée en mode simple (classe hasx sur la ligne, cx sur le code) */
html.grun-simple .hasx{grid-template-columns:minmax(0,1fr)!important}
html.grun-simple .cx{display:none!important}
/* Grilles : « L'essentiel » en cartes sur téléphone ; toucher une ligne ouvre son détail */
#doc table.cartes td.lgo{cursor:pointer;color:var(--acc,#0F766E);font-weight:700}
@media (max-width:640px){
  #doc table.cartes,#doc table.cartes tbody,#doc table.cartes tr,#doc table.cartes td{display:block;width:auto!important}
  #doc table.cartes thead{display:none}
  #doc table.cartes tr{padding:10px 12px;border-bottom:1px solid var(--line,#D9DDE3)}
  #doc table.cartes td{border:none!important;padding:2px 0!important}
  #doc table.cartes td.lgo{font-size:1.05em}
  #doc table.cartes td.lgo::after{content:" ›"}
  #doc table.cartes td:nth-child(3)::before{content:"Test ★ : ";font-weight:600;color:var(--mute,#5D6675)}
}
/* lignes de grille affichées en clair : les noms longs passent à la ligne */
.lc{white-space:normal!important;overflow-wrap:anywhere;display:inline-block;max-width:100%}
.boxh>div{min-width:0;flex:1 1 auto}
/* bouton PDF commun (même aspect et même libellé « … PDF » dans tous les modules) : <button class="grun-pdf"><svg/><span>Rapport PDF</span></button> */
.grun-pdf{display:inline-flex;align-items:center;gap:7px;min-height:42px;padding:0 14px;border-radius:10px;border:1.5px solid var(--grun,#0F766E);background:var(--panel,#fff);color:var(--grun,#0F766E);font:700 15px/1 var(--ui,system-ui,sans-serif);cursor:pointer;white-space:nowrap;text-decoration:none}
.grun-pdf svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.grun-pdf:disabled{opacity:.6}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .grun-pdf{color:#2DD4BF;border-color:#2DD4BF}}
:root[data-theme="dark"] .grun-pdf{color:#2DD4BF;border-color:#2DD4BF}
</style>

<script>
"use strict";
const PORTES = {
  "1": {n:"Filles", c:"--p1", s:"Les saisons de référence filles de __A__ : frise, mésocycles, chaque semaine et le thème de chaque séance."},
  "2": {n:"Garçons", c:"--p2", s:"Les saisons de référence garçons de __A__ : frise, mésocycles, chaque semaine et le thème de chaque séance."},
  "3": {n:"La méthode", c:"--p3", s:"Calendrier 2026-2027, semaines types __G__, types de cycles, charge, lignes des grilles."}
};
const GR = window.GRUN || null;
const normCode = c => { const m=/^([FG])(\d{1,2})$/i.exec(c||""); return m ? m[1].toUpperCase()+String(+m[2]).padStart(2,"0") : c; };
const progHref = (code, w, jid) => (GR ? GR.href("prog","#/nouveau/"+(jid||"")) : "prog.html#/nouveau/"+(jid||"")) + "?base="+code + (w?"&w="+w:"");
/* joueurs de GRÜN : la saison de leur âge (4-18 ans ; au-delà de 18 ans, la saison 18 ans) et de leur sexe */
const JR = () => { try{ if(!GR||!GR.joueurs) return [];
  if(GR.isJoueur()){ const j=GR.joueurs.get(GR.mode().jid); return j?[j]:[]; }
  if(GR.isAutonome&&GR.isAutonome()&&GR.moi()){ const j=GR.joueurs.get(GR.moi()); if(j) return [j]; }
  return GR.joueurs.all(); }catch(e){ return []; } };
const jAge = j => { const a = GR&&j&&j.naissance ? GR.ageCiv(j.naissance) : null; return a==null ? null : Math.max(4, Math.min(18, a)); };
const jCode = j => { const a=jAge(j); return a!=null && /^[FG]$/.test(j.sexe||"") ? normCode(j.sexe+a) : null; };
const jGet = id => { try{ return id&&GR&&GR.joueurs ? GR.joueurs.get(id) : null; }catch(e){ return null; } };
let AGES = [];
let CALW = [];
const pad2 = n => String(n).padStart(2,"0");
function curWeek(){ const t=new Date().toISOString().slice(0,10); const w=CALW.find(x=>x.du<=t&&t<=x.au); if(w) return w.n; return CALW.length&&t<CALW[0].du?1:52; }
const MOISC=["janv.","févr.","mars","avril","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
const dd = s => { const d=new Date(s+"T12:00:00"); return d.getDate()+" "+MOISC[d.getMonth()]; };


let DOCS = [], BY = {}, NORM = null, JID = null;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fold = s => { let o=""; for(const ch of s){ const d=ch.normalize("NFD")[0]; o += (d||ch).toLowerCase(); } return o; };
const keyc = c => c.split(".").map(Number);

/* ---------- préférences locales ---------- */
const ST = "saisons_v1";
function load(){ try{ return JSON.parse(localStorage.getItem(ST)) || {}; }catch(e){ return {}; } }
let P = Object.assign({fav:[], rec:[], notes:{}, fs:17, sx:"G", age:"14"}, load());
function save(){ try{ localStorage.setItem(ST, JSON.stringify(P)); }catch(e){} }
document.documentElement.style.setProperty("--fs", P.fs+"px");

/* ---------- données ---------- */
async function boot(){
  try{
    const r = await fetch("data-saisons.json"); const d = await r.json();
    DOCS = d.docs; CALW = d.cal||[]; DOCS.forEach((x,i)=>{ x.i=i; BY[x.c]=x; });
    AGES = [...new Set(DOCS.filter(x=>x.age).map(x=>x.age))].sort((a,b)=>a-b);
    const rng = AGES.length ? AGES[0]+" à "+AGES[AGES.length-1]+" ans" : "";
    const gs = DOCS.filter(x=>/^Semaine type/.test(x.t)).map(x=>x.t.replace("Semaine type ","").replace(" ans",""));
    for(const k in PORTES) PORTES[k].s = PORTES[k].s.replace("__A__", rng).replace("__G__", gs.join(", ").replace(/, ([^,]*)$/," et $1")+" ans");
  }catch(e){ $("#main").innerHTML = '<div class="empty">Les saisons n\'ont pas pu se charger. Vérifie la connexion pour la première ouverture, puis recharge la page.</div>'; return; }
  route();
  setTimeout(buildIndex, 50);
}
function buildIndex(){
  if(NORM) return;
  const tmp = document.createElement("div");
  NORM = DOCS.map(x => { tmp.innerHTML = x.h; const t = (x.t+" \n "+tmp.textContent).replace(/\s+/g," "); return {raw:t, f:fold(t)}; });
}

/* ---------- routage ---------- */
window.addEventListener("hashchange", route);
$("#back").onclick = () => { if(history.length > 1) history.back(); else location.hash = ""; };
function route(){
  let h = decodeURIComponent(location.hash.slice(1)); const qi = h.indexOf("?j="); JID = null;
  if(qi>=0 && !h.startsWith("s/")){ JID = h.slice(qi+3) || null; h = h.slice(0, qi); }
  const m = $("#main"); window.scrollTo(0,0);
  if(h.startsWith("/s/")) { const [c,w]=h.slice(3).split("/"); return showDoc(normCode(c), w); }   // GRÜN : saisons.html#/s/<code>[/w<n>]
  if(h.startsWith("d/")) return showDoc(normCode(h.slice(2).split("/")[0]), h.split("/")[2]);
  if(h.startsWith("p/")) return showPorte(h.slice(2));
  if(h.startsWith("s/")) { $("#q").value = h.slice(2); return showSearch(h.slice(2)); }
  showHome();
}
function porteOf(x){ return x.p; }
function pc(p){ return `var(${PORTES[p].c})`; }

/* ---------- accueil ---------- */
function showHome(){
  document.documentElement.style.setProperty("--acc", "var(--ink)");
  const m = $("#main");
  const count = p => DOCS.filter(x=>porteOf(x)===p).length;
  const cw = curWeek(), cwk = CALW.find(x=>x.n===cw);
  let html = `<h1>Référentiel de programmation</h1><p class="lead">Saisons de référence de la méthode · ${AGES.length?AGES[0]+" à "+AGES[AGES.length-1]+" ans":""} · filles et garçons · compétitions, préparation physique, biomécanique, tennis et préparation mentale</p>`;
  html += `<div class="sec"><h2>Accès direct</h2><div class="quick">
    <div class="f"><label for="qs">Sexe</label><select id="qs"><option value="F">Fille</option><option value="G">Garçon</option></select></div>
    <div class="f"><label for="qa">Âge</label><select id="qa">${AGES.map(a=>`<option value="${a}">${a} ans</option>`).join("")}</select></div>
    <div class="f" style="flex:1;min-width:200px"><label for="qw">Semaine</label><select id="qw"><option value="0">Toute la saison</option>${CALW.map(w=>`<option value="${w.n}">S${w.n} · ${dd(w.du)} - ${dd(w.au)}${w.n===cw?" (en cours)":""}</option>`).join("")}</select></div>

  const js = JR().filter(j=>BY[jCode(j)]);
  if(js.length) html += `<div class="sec"><h2>${js.length>1?"La saison de mes joueurs":"Ma saison"}</h2><p class="msg" style="margin:-4px 0 8px">Ouvre la saison de son âge et de son sexe, directement à la semaine en cours (S${cw}).</p><div class="pjs">${js.slice(0,24).map(j=>`<a class="pj" href="#/s/${jCode(j)}/w${cw}?j=${encodeURIComponent(j.id)}"><b>${esc(j.nom)}</b><small>Saison ${j.sexe==="F"?"fille":"garçon"} ${jAge(j)} ans · S${cw}</small></a>`).join("")}</div></div>`;
  html += `<div class="sec"><h2>Les portes</h2><div class="doors">${Object.entries(PORTES).map(([p,o])=>`<a class="door" href="#p/${p}" style="--pc:var(${o.c})"><b>${o.n}</b><span>${o.s}</span><small>${count(p)} documents</small></a>`).join("")}</div></div>`;
  const favs = P.fav.filter(c=>BY[c]), recs = P.rec.filter(c=>BY[c]).slice(0,8);
  html += `<div class="sec"><h2>Favoris</h2>${favs.length ? listHTML(favs.map(c=>BY[c]), true) : '<div class="empty">Touche ☆ en haut d\'un document pour le retrouver ici.</div>'}</div>`;
  if(recs.length) html += `<div class="sec"><h2>Consultés récemment</h2>${listHTML(recs.map(c=>BY[c]), true)}</div>`;
  html += `<details class="grun-plus"><summary>Plus d'options : sauvegarde, taille du texte</summary><div class="grun-plusb"><div class="tools">
     <button class="ib" id="bsave" type="button">Sauvegarder</button>
     <label class="ib" for="frest">Restaurer</label><input id="frest" type="file" accept=".json,application/json" hidden>
     <button class="ib" id="fsm" type="button" aria-label="Texte plus petit">A−</button><button class="ib" id="fsp" type="button" aria-label="Texte plus grand">A+</button></div><p class="msg" id="dmsg">Favoris et notes sont gardés sur cet appareil.</p></div></details>`;
  m.innerHTML = html;
  const qs=$("#qs"), qa=$("#qa"), qw=$("#qw"); qs.value=P.sx; qa.value=AGES.includes(+P.age)?P.age:String(AGES[AGES.length-1]||14); qw.value="0";
  const cd=()=>normCode(qs.value+qa.value);
  $("#qgo").onclick=()=>{ P.sx=qs.value; P.age=qa.value; save(); location.hash = `/s/${cd()}` + (+qw.value ? `/w${qw.value}` : ""); };
  $("#qnow").onclick=()=>{ P.sx=qs.value; P.age=qa.value; save(); location.hash = `/s/${cd()}/w${curWeek()}`; };
  $("#bsave").onclick=exportData; $("#frest").onchange=importData;
  $("#fsm").onclick=()=>setFs(-1); $("#fsp").onclick=()=>setFs(1);
}
function setFs(d){ P.fs=Math.max(14,Math.min(24,P.fs+d)); save(); document.documentElement.style.setProperty("--fs",P.fs+"px"); const m=$("#dmsg"); if(m) m.textContent="Taille du texte des documents : "+P.fs+" px."; }
function listHTML(xs, withPath){
  return `<div class="list">${xs.map(x=>`<a class="li hasx" href="#d/${x.c}"><span class="code cx">${x.c}</span><span class="tt">${esc(x.t)}${withPath?`<small>${esc(x.ch)}</small>`:""}</span></a>`).join("")}</div>`;
}

/* ---------- porte ---------- */
function showPorte(p){
  if(!PORTES[p]) return showHome();
  document.documentElement.style.setProperty("--acc", pc(p));
  const xs = DOCS.filter(x=>porteOf(x)===p), groups = {};
  xs.forEach(x=>{ (groups[x.d] = groups[x.d] || []).push(x); });
  let html = `<div class="crumb" style="--pc:${pc(p)}"><a href="#">Accueil</a></div><h1 style="color:${pc(p)}">${PORTES[p].n}</h1><p class="lead">${PORTES[p].s}</p>`;
  html += Object.entries(groups).map(([d,arr])=>`<div class="fold" style="--pc:${pc(p)}"><h3>${esc(d)}</h3>${listHTML(arr,false)}</div>`).join("");
  $("#main").innerHTML = html;
}

/* ---------- document ---------- */
function showDoc(code, hint){
  const x = BY[code]; if(!x) return showHome();
  const p = porteOf(x); document.documentElement.style.setProperty("--acc", pc(p));
  P.rec = [code, ...P.rec.filter(c=>c!==code)].slice(0,20); save();
  const sib = DOCS.filter(y=>y.d===x.d), k = sib.indexOf(x), prev = sib[k-1], next = sib[k+1];
  const fav = P.fav.includes(code), jb = jGet(JID);
  const m = $("#main"); m.style.setProperty("--pc", pc(p));
  m.innerHTML = `<div class="crumb"><a href="#">Accueil</a>›<a href="#p/${p}">${PORTES[p].n}</a>›<span>${esc(String(x.d).replace(/^\d+(\.\d+)*\s/,""))}</span></div>
    <div class="dochead"><h1>${esc(x.t)}</h1><div class="acts">
      <button class="ib star" id="fav" type="button" aria-pressed="${fav}">${fav?"★ Favori":"☆ Favori"}</button>
      <button class="ib" id="fsm" type="button" aria-label="Texte plus petit">A−</button><button class="ib" id="fsp" type="button" aria-label="Texte plus grand">A+</button></div></div>
    <div class="crumb xp" style="margin-top:4px">${esc(x.ch||"")}</div>${jumps(x)}
    ${x.sx?`${jb?`<div class="pjbar">Pour <b>${esc(jb.nom)}</b>${jCode(jb)!==x.c?` · sa saison : <a href="#/s/${jCode(jb)}/w${curWeek()}?j=${encodeURIComponent(jb.id)}">${jb.sexe==="F"?"fille":"garçon"} ${jAge(jb)} ans</a>`:""}</div>`:""}<div class="basebar"><a class="go bl" href="${progHref(x.c, 0, jb&&jb.id)}">${jb?`Créer la prog de ${esc(jb.nom)} sur cette saison →`:"Utiliser comme base dans Create my prog →"}</a><a class="ib" href="${progHref(x.c, curWeek(), jb&&jb.id)}">Créer les séances de cette semaine (S${curWeek()})</a></div>`:""}
    <nav class="toc xp" id="toc" hidden></nav>
    <article class="doc" id="doc"></article>
    <div class="pn">${prev?`<a href="#d/${prev.c}"><small>‹ Précédent</small>${esc(prev.t)}</a>`:"<span></span>"}${next?`<a class="nx" href="#d/${next.c}"><small>Suivant ›</small>${esc(next.t)}</a>`:"<span></span>"}</div>
    <div class="notes"><label for="nt" style="font-weight:600">Mes notes sur ce document</label><textarea id="nt" placeholder="Idées, joueurs concernés, à tester…"></textarea><div class="msg" id="ntm"></div></div>`;
  // structure : L'essentiel encadré, Le détail en sections dépliables
  const doc = $("#doc"); const tmp = document.createElement("div"); tmp.innerHTML = x.h;
  tmp.querySelectorAll("table").forEach(t=>{ const w=document.createElement("div"); w.className="tw"; t.replaceWith(w); w.appendChild(t); });
  let cur = null, mode = null, sections = [];
  for(const node of [...tmp.childNodes]){
    if(node.nodeName==="H2"){
      const t = fold(node.textContent);
      if(t.includes("essentiel")){ cur = document.createElement("section"); cur.className="ess"; cur.appendChild(node); doc.appendChild(cur); mode="ess"; continue; }
      mode = "det"; doc.appendChild(node); cur = doc; continue;
    }
    if(node.nodeName==="H3" && mode!=="ess"){
      const d = document.createElement("details"); const s = document.createElement("summary"); s.textContent = node.textContent; d.appendChild(s);
      d.id = "s"+sections.length; sections.push([d.id, node.textContent]); doc.appendChild(d); cur = d; continue;
    }
    (cur || doc).appendChild(node);
  }
  if(sections.length>2){ const toc=$("#toc"); toc.hidden=false; toc.innerHTML = `<b>Le détail</b><ol>${sections.map(([id,t])=>`<li><a href="#" data-s="${id}">${esc(t.replace(/^\d+\.\s*/,""))}</a></li>`).join("")}</ol>`;
    toc.onclick = e=>{ const a=e.target.closest("a[data-s]"); if(!a) return; e.preventDefault(); const d=document.getElementById(a.dataset.s); d.open=true; d.scrollIntoView({behavior:"smooth",block:"start"}); }; }
  if(sections.length===1){ doc.querySelector("details").open = true; }
  if(window.GRUN&&GRUN.clair) GRUN.clair(document.getElementById("doc"));   /* lignes de grille en clair (mode simple) */
  doc.querySelectorAll('.wkgo a[href*="#/nouveau/"]').forEach(a=>{ const q=a.getAttribute("href").split("?")[1]||""; const w=(q.match(/w=(\d+)/)||[])[1]; a.href = progHref(x.c, w, jb&&jb.id); });
  if(jb) $("#main").querySelectorAll('.jump a[href^="#/s/"]').forEach(a=>{ a.href += "?j="+encodeURIComponent(jb.id); });
  // favoris, taille, notes
  $("#fav").onclick = ()=>{ const on = !P.fav.includes(code); P.fav = on ? [code,...P.fav] : P.fav.filter(c=>c!==code); save(); $("#fav").setAttribute("aria-pressed",on); $("#fav").textContent = on?"★ Favori":"☆ Favori"; };
  $("#fsm").onclick=()=>setFs(-1); $("#fsp").onclick=()=>setFs(1);
  const nt=$("#nt"); nt.value = P.notes[code]||""; let tm;
  nt.oninput = ()=>{ clearTimeout(tm); tm=setTimeout(()=>{ if(nt.value.trim()) P.notes[code]=nt.value; else delete P.notes[code]; save(); $("#ntm").textContent="Note enregistrée sur cet appareil."; },500); };
  // aller à un âge ou surligner une recherche
  if(hint && hint.startsWith("w")) goWeek(+hint.slice(1));
  else if(hint && hint.startsWith("a")) goAge(+hint.slice(1));
  else if(hint && hint.startsWith("q")) highlight(hint.slice(1));
}
function jumps(x){
  if(!x.sx) return ""; const a=x.age, o=x.sx==="F"?"G":"F";
  const c=(s,n)=>normCode(s+n);
  return `<div class="jump">${BY[c(x.sx,a-1)]?`<a href="#/s/${c(x.sx,a-1)}">‹ ${a-1} ans</a>`:""}${BY[c(x.sx,a+1)]?`<a href="#/s/${c(x.sx,a+1)}">${a+1} ans ›</a>`:""}${BY[c(o,a)]?`<a href="#/s/${c(o,a)}">Même âge · ${o==="F"?"filles":"garçons"}</a>`:""}<button type="button" class="now" data-now="1">Cette semaine (S${curWeek()})</button></div>`;
}
document.addEventListener("click", e=>{
  const n=e.target.closest("[data-now]"); if(n){ e.preventDefault(); goWeek(curWeek()); return; }
  const w=e.target.closest("svg.frise a[data-w]"); if(w){ e.preventDefault(); goWeek(+w.dataset.w); }
});
function goWeek(n){
  const h=document.getElementById("w"+n); if(!h) return; const d=h.closest("details"); if(d) d.open=true;
  setTimeout(()=>{ h.scrollIntoView({behavior:"smooth",block:"start"}); h.classList.add("flash"); },60);
}
function ageIn(text, age){
  const t = fold(text); if(!/\ban|ans\b/.test(t)) return false;
  const nums = (t.match(/\d+/g)||[]).map(Number).filter(n=>n<=25); if(!nums.length) return false;
  if(/\d+\s*(-|a|à|et)\s*\d+/.test(t) && nums.length>=2){ const lo=Math.min(...nums), hi=Math.max(...nums); return age>=lo && age<=hi; }
  return nums.includes(age);
}
function goAge(age){
  const doc = $("#doc");
  let target = [...doc.querySelectorAll("details")].find(d=>ageIn(d.querySelector("summary").textContent, age));
  if(target){ target.open=true; setTimeout(()=>{ target.scrollIntoView({behavior:"smooth",block:"start"}); target.querySelector("summary").classList.add("flash"); },60); return; }
  const h = [...doc.querySelectorAll("h4,h5")].find(e=>ageIn(e.textContent, age));
  if(h){ const d=h.closest("details"); if(d) d.open=true; setTimeout(()=>{ h.scrollIntoView({behavior:"smooth",block:"center"}); h.classList.add("flash"); },60); return; }
  const td = [...doc.querySelectorAll("td:first-child")].find(e=>ageIn(e.textContent, age));
  if(td){ const tr=td.parentNode; setTimeout(()=>{ tr.scrollIntoView({behavior:"smooth",block:"center"}); tr.classList.add("flash"); },60); }
}

/* ---------- recherche ---------- */
let sT;
$("#q").addEventListener("input", e=>{ clearTimeout(sT); const v=e.target.value.trim(); sT=setTimeout(()=>{ if(v.length>=2) history.replaceState(null,"","#s/"+encodeURIComponent(v)), showSearch(v); else if(!v && location.hash.startsWith("#s/")) location.hash=""; },250); });
$("#q").addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.target.blur(); } });
function terms(q){ return fold(q).split(/\s+/).filter(w=>w.length>=2); }
function showSearch(q){
  document.documentElement.style.setProperty("--acc", "var(--ink)");
  buildIndex();
  const ts = terms(q), m = $("#main");
  if(!ts.length){ showHome(); return; }
  const res = [];
  NORM.forEach((n,i)=>{
    let score=0, first=-1;
    for(const t of ts){ let c=0, pos=n.f.indexOf(t); if(pos<0){ score=0; return; } if(first<0||pos<first) first=pos; while(pos>=0 && c<60){ c++; pos=n.f.indexOf(t,pos+t.length); } score+=c; }
    if(fold(DOCS[i].t).includes(ts[0])) score+=40;
    res.push({i, score, first});
  });
  res.sort((a,b)=>b.score-a.score);
  const top = res.slice(0,60);
  let html = `<h1>Recherche</h1><p class="lead">${res.length ? `${res.length} document${res.length>1?"s":""} pour « ${esc(q)} »${res.length>60?" · les 60 plus pertinents":""}` : `Aucun document ne contient « ${esc(q)} ». Essaie un mot plus court ou un synonyme.`}</p><div class="sec">`;
  html += top.map(r=>{ const x=DOCS[r.i], n=NORM[r.i]; const a=Math.max(0,r.first-90), b=Math.min(n.raw.length,r.first+190);
    let snip = (a?"…":"")+n.raw.slice(a,b)+(b<n.raw.length?"…":"");
    snip = markTerms(esc(snip), ts);
    return `<a class="res" href="#d/${x.c}/q${encodeURIComponent(q)}" style="--pc:${pc(porteOf(x))}"><div class="t">${esc(x.t)}</div><div class="w">${esc(x.ch)}</div><div class="s">${snip}</div></a>`; }).join("");
  m.innerHTML = html + "</div>";
}
function markTerms(htmlText, ts){
  const f = fold(htmlText); let out="", i=0;
  const hits=[]; ts.forEach(t=>{ let p=f.indexOf(t); while(p>=0){ hits.push([p,p+t.length]); p=f.indexOf(t,p+t.length); } });
  hits.sort((a,b)=>a[0]-b[0]); let last=0;
  for(const [s,e] of hits){ if(s<last) continue; const pre=htmlText.slice(last,s); if(/&[a-z]*$/.test(pre)) continue; out+=pre+"<mark>"+htmlText.slice(s,e)+"</mark>"; last=e; }
  return out+htmlText.slice(last);
}
function highlight(q){
  const ts = terms(q); if(!ts.length) return; const doc=$("#doc");
  const walker = document.createTreeWalker(doc, NodeFilter.SHOW_TEXT); const nodes=[]; while(walker.nextNode()) nodes.push(walker.currentNode);
  let firstMark=null;
  for(const n of nodes){ const f=fold(n.nodeValue); const hits=[]; ts.forEach(t=>{ let p=f.indexOf(t); while(p>=0){ hits.push([p,p+t.length]); p=f.indexOf(t,p+t.length); } });
    if(!hits.length) continue; hits.sort((a,b)=>a[0]-b[0]);
    const frag=document.createDocumentFragment(); let last=0;
    for(const [s,e] of hits){ if(s<last) continue; frag.append(n.nodeValue.slice(last,s)); const mk=document.createElement("mark"); mk.textContent=n.nodeValue.slice(s,e); frag.append(mk); if(!firstMark) firstMark=mk; last=e; }
    frag.append(n.nodeValue.slice(last)); n.replaceWith(frag); }
  doc.querySelectorAll("mark").forEach(mk=>{ const d=mk.closest("details"); if(d) d.open=true; });
  if(firstMark) setTimeout(()=>firstMark.scrollIntoView({behavior:"smooth",block:"center"}),80);
}

/* ---------- sauvegarde ---------- */
async function exportData(){
  if(GR){ GR.telecharger(GR.exportAll(), "GRUN_sauvegarde_"+new Date().toISOString().slice(0,10)+".json"); const m=$("#dmsg"); if(m) m.textContent="Sauvegarde de toute l'appli créée : garde-la dans Fichiers."; return; }
  const blob = new Blob([JSON.stringify({format:"saisons", version:1, date:new Date().toISOString().slice(0,10), fav:P.fav, notes:P.notes}, null, 1)], {type:"application/json"});
  const name = "Saisons_favoris_notes_"+new Date().toISOString().slice(0,10)+".json";
  let dl=null; try{ dl = await window.claude?.use?.("downloads"); }catch(e){}
  if(dl){ try{ await dl.save({filename:name, data:blob}); return; }catch(e){ if(e&&e.code==="declined") return; } }
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove();
}
async function importData(e){
  const f=e.target.files&&e.target.files[0]; e.target.value=""; if(!f) return; const m=$("#dmsg");
  try{ const d=JSON.parse(await f.text());
    if(GR && d.app==="GRUN"){ GR.importAll(d); P = Object.assign({fav:[], rec:[], notes:{}, fs:17, sx:"G", age:"14"}, load()); showHome(); $("#dmsg").textContent="Sauvegarde restaurée."; return; }
    if(d.format!=="saisons") throw 0;
    P.fav=[...new Set([...(d.fav||[]),...P.fav])]; P.notes=Object.assign({},P.notes,d.notes||{}); save(); showHome(); $("#dmsg").textContent="Favoris et notes restaurés."; }
  catch(err){ m.textContent="Ce fichier n'est pas une sauvegarde de cette appli (Saisons_favoris_notes_….json)."; }
}

if(GR){ try{ GR.nav("res"); if(GR.isJoueur()) document.body.classList.add("joueur"); }catch(e){} }
boot();
